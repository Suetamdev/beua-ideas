 # Elven Supremacy Ideas
 elven_supremacy_ideas:0 "Elven Supremacy Ideas"
 elven_supremacy_ideas_desc:0 ""
 elven_supremacy_idea_1:0 "Remember the Forebears"
 elven_supremacy_idea_1_desc:0 "Our people have a long and complex history, stretching back to the days when elves dominated the ancient world."
 elven_supremacy_idea_2:0 "Reclaiming Our Birthright"
 elven_supremacy_idea_2_desc:0 "But why should the past remain in the past? We should focus our efforts on restoring the old values of elvenkind, and make sure that all our peoples follow the one true order."
 elven_supremacy_idea_3:0 "Lessons From Jaher"
 elven_supremacy_idea_3_desc:0 "The New Sun Cult spreaded like wildfire, as Jaher the Sun Elf was proclaimed to be the reincarnation of the Bulwari sun god Surakel. By using local cults and religions the same way, we too can better spread our faith."
 elven_supremacy_idea_4:0 "Seniority Rule"
 elven_supremacy_idea_4_desc:0 "The elves are known by all to be longest-lived race in Halann. With lives as long as ours, our rulers have all the time in the world to consolidate their rule and perfect their duties."
 elven_supremacy_idea_5:0 "Police State"
 elven_supremacy_idea_5_desc:0 "It is a constant fight to keep minorities in line, task forces will be set up to specifically deal with these undesireables."
 elven_supremacy_idea_6:0 "Manifest Destiny"
 elven_supremacy_idea_6_desc:0 "By supporting a resettlement program, we can offset elves' low fertility rates and accelerate the integration of newly conquered realms."
 elven_supremacy_idea_7:0 "Conscript Cannon Fodder"
 elven_supremacy_idea_7_desc:0 "We must strive for victory, and we must purge the undesireables from our land. Why not kill two birds with one stone, and force our lessers to serve as frontline soldiers? Our officers may complain of their lack of discipline, but they won't complain when they need fresh bodies."

 # Jurisprudence Ideas
 jurisprudence_ideas:0 "Jurisprudence Ideas"
 jurisprudence_ideas_desc:0 "A functional legal system is desired and considered important in our state."
 jurisprudence_idea_1:0 "Collection of Laws"
 jurisprudence_idea_1_desc:0 "Laws give people security and foothold."
 jurisprudence_idea_2:0 "Ministry of Justice"
 jurisprudence_idea_2_desc:0 "The ministry of justice is occupied creating new laws and update old ones."
 jurisprudence_idea_3:0 "Lawyer Tradition"
 jurisprudence_idea_3_desc:0 "Our lawyers keep the land running."
 jurisprudence_idea_4:0 "Business Law"
 jurisprudence_idea_4_desc:0 "Business law is important to lay down some rules with the interaction with other countries."
 jurisprudence_idea_5:0 "Anti Usury Laws"
 jurisprudence_idea_5_desc:0 "Usury paralyzes the economy. We shall fight it."
 jurisprudence_idea_6:0 "Public International Law"
 jurisprudence_idea_6_desc:0 "Public international law determines some basic rules in the interactions of states."
 jurisprudence_idea_7:0 "Minority Rights"
 jurisprudence_idea_7_desc:0 "Minority rights stabilize our realm and reduce uprisings."

 # Health Ideas
 health_ideas:0 "Health Ideas"
 health_ideas_desc:0 "The state will improve the health of the people for their own good."
 health_idea_1:0 "Longer Working Hours"
 health_idea_1_desc:0 "Someone who works longer, generates more money."
 health_idea_2:0 "Decreased Danger of Epidemic"
 health_idea_2_desc:0 "There is little that can do more damage to the economy than epidemics. Good practices will prevent them."
 health_idea_3:0 "Improved Lifespan"
 health_idea_3_desc:0 "Through improving the lifespan of our people, we can build our population."
 health_idea_4:0 "Sturdiness"
 health_idea_4_desc:0 "Someone with a sturdy body can better endure extreme situations."
 health_idea_5:0 "Decreased Infant Death"
 health_idea_5_desc:0 "If fewer infants die, our supplies of workers and soldiers will grow greatly."
 health_idea_6:0 "Medicine Technology"
 health_idea_6_desc:0 "Improving medical technology will help us advancing in science."
 health_idea_7:0 "Public Hospitals"
 health_idea_7_desc:0 "Public hospitals will please the common people."

 # State Administration Ideas
 state_administration_ideas:0 "State Administration Ideas"
 state_administration_ideas_desc:0 "A good state administration can do wonders."
 state_administration_idea_1:0 "Community Law"
 state_administration_idea_1_desc:0 "Community law will ensure that we keep control over distant provinces and thus increase our capabilities to maintain many states."
 state_administration_idea_2:0 "Inland Trade"
 state_administration_idea_2_desc:0 "We need to support inland trade by building a road system."
 state_administration_idea_3:0 "Administrative Espionage"
 state_administration_idea_3_desc:0 "Our eyes and ears need to be everywhere or we might miss an important detail."
 state_administration_idea_4:0 "Administrative Law"
 state_administration_idea_4_desc:0 "Administrative law keeps the administration transparent and incorrupt."
 state_administration_idea_5:0 "Administrative Centers"
 state_administration_idea_5_desc:0 "By organizing local administration into regional centers, we can better manage our realm. \n\n§GGain one random point of development§! in every province in a state upon centralization."
 state_administration_idea_6:0 "Steering Trade"
 state_administration_idea_6_desc:0 "We need to steer trade to the direction where it is most profitable for us."
 state_administration_idea_7:0 "Enforcement of Progress"
 state_administration_idea_7_desc:0 "Sometimes the peasant population and the unprogressive might be reluctant to accept technical advancements. We need to convince them that advancement is best for them."

 # Centralism Ideas
 centralism_ideas:0 "Centralism Ideas"
 centralism_ideas_desc:0 "Our state is centrally ruled."
 centralism_idea_1:0 "Meritocratic Rule"
 centralism_idea_1_desc:0 "A system of meritocracy will increase the efficiency of our state's governance."
 centralism_idea_2:0 "Central Tax Administration"
 centralism_idea_2_desc:0 "The founding of a centralized taxation system will make our tax collection less vulnerable to corruption and fraud."
 centralism_idea_3:0 "Home Field Advantage"
 centralism_idea_3_desc:0 "Our focus on our core lands has taught us how to best fight in them."
 centralism_idea_4:0 "Central Planning"
 centralism_idea_4_desc:0 "By focusing our internal developments in key locations, we can accelerate overall growth.\n\nExpanding Infrastructure grants Goods Produced: §G+5%§! and Manpower: §G+10%§! §RThis bonus is halved for Dwarven holds!§!"
 centralism_idea_5:0 "Increased Integration"
 centralism_idea_5_desc:0 "To build a successful nation, we must curtail the autonomy of our subjects."
 centralism_idea_6:0 "Metropolis Development"
 centralism_idea_6_desc:0 "Our expertise in developing cities has led to new architectural developments and quality of living."
 centralism_idea_7:0 "Meritocratic Rule"
 centralism_idea_7_desc:0 "A system of meritocracy will increase the efficiency of our state's governance."

 # Decentralism Ideas
 decentralism_ideas:0 "Decentralism Ideas"
 decentralism_ideas_desc: "Our state is ruled decentrally."
 decentralism_idea_1: "Local Governors"
 decentralism_idea_1_desc: "By divesting power from the central authority to local governors, we can insure their loyalty."
 decentralism_idea_2: "Decentralized Administration"
 decentralism_idea_2_desc: "Because of our big territory, we have to work in a decentralized way to govern."
 decentralism_idea_3: "Empowered Autonomy"
 decentralism_idea_3_desc: "We should recognize the strength of local authorities, and leverage them to our advantage."
 decentralism_idea_4: "Cultural Centers"
 decentralism_idea_4_desc: "We won't focus on one cultural center alone, but on many."
 decentralism_idea_5: "Great State"
 decentralism_idea_5_desc: "Our state's tradition of 'blobbing' has made us more efficient in acquiring further land."
 decentralism_idea_6: "Local Trade"
 decentralism_idea_6_desc: "Sometimes local trade in a province can be very profitable in itself. We will remember that."
 decentralism_idea_7: "Co-Prosperity"
 decentralism_idea_7_desc: "By establishing the properity of our subjects, we may in turn enrich ourselves.\n\n§TEnables converting §YVassals§! and §YClient States§! into §YDominions§!§!. §RYou need to have idea:§! §YSphere of Influence(Imperialism Ideas)§! or §YPostal Service(Influence Ideas)§!"

 # Industrial Ideas
 archmage_necromancy:0 "Limit Break: Necromancy"
 desc_archmage_necromancy:0 "Comprehensive insight into the soul-tether allows us to halt the decay of consciousness and command the cycle of life."
 archmage_evocation:0 "Limit Break: Evocation"
 desc_archmage_evocation:0 "Mastery over the fundamental forces of the ether enables the channeling of raw energy without the need for physical catalysts."
 archmage_divination:0 "Limit Break: Divination"
 desc_archmage_divination:0 "The collapse of temporal barriers grants us total clarity of the past, present, and the infinite web of future possibilities."
 archmage_abjuration:0 "Limit Break: Abjuration"
 desc_archmage_abjuration:0 "Deep understanding of metaphysical resonance allows for the creation of barriers that are absolute and impenetrable."
 archmage_conjuration:0 "Limit Break: Conjuration"
 desc_archmage_conjuration:0 "Knowledge of planar coordinates and spatial folding permits the instantaneous manifestation of matter from the void."
 archmage_enchantment:0 "Limit Break: Enchantment"
 desc_archmage_enchantment:0 "Expert grasp of the psyche's frequency enables the seamless alignment of external wills with our own design."
 archmage_transmutation:0 "Limit Break: Transmutation"
 desc_archmage_transmutation:0 "Total comprehension of elemental alchemy allows for the instantaneous restructuring of any physical substance."
 archmage_illusion:0 "Limit Break: Illusion"
 desc_archmage_illusion:0 "Mastery over sensory perception and collective consciousness renders the distinction between truth and figment irrelevant."