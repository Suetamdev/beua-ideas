l_english:
 # Elven Supremacy Ideas
 beua_elven_supremacy_ideas:0 "Elven Supremacy Ideas"
 beua_elven_supremacy_ideas_bonus:0 "Full Elven Supremacy"
 beua_elven_supremacy_idea_1:0 "Remember the Forebears"
 beua_elven_supremacy_idea_1_desc:0 "Our people have a long and complex history, stretching back to the days when elves dominated the ancient world."
 beua_elven_supremacy_idea_2:0 "Reclaiming Our Birthright"
 beua_elven_supremacy_idea_2_desc:0 "But why should the past remain in the past? We should focus our efforts on restoring the old values of elvenkind, and make sure that all our peoples follow the one true order."
 beua_elven_supremacy_idea_3:0 "Lessons From Jaher"
 beua_elven_supremacy_idea_3_desc:0 "The New Sun Cult spreaded like wildfire, as Jaher the Sun Elf was proclaimed to be the reincarnation of the Bulwari sun god Surakel. By using local cults and religions the same way, we too can better spread our faith."
 beua_elven_supremacy_idea_4:0 "Seniority Rule"
 beua_elven_supremacy_idea_4_desc:0 "The elves are known by all to be longest-lived race in Halann. With lives as long as ours, our rulers have all the time in the world to consolidate their rule and perfect their duties."
 beua_elven_supremacy_idea_5:0 "Police State"
 beua_elven_supremacy_idea_5_desc:0 "It is a constant fight to keep minorities in line, task forces will be set up to specifically deal with these undesireables."
 beua_elven_supremacy_idea_6:0 "Manifest Destiny"
 beua_elven_supremacy_idea_6_desc:0 "By supporting a resettlement program, we can offset elves' low fertility rates and accelerate the integration of newly conquered realms."
 beua_elven_supremacy_idea_7:0 "Conscript Cannon Fodder"
 beua_elven_supremacy_idea_7_desc:0 "We must strive for victory, and we must purge the undesireables from our land. Why not kill two birds with one stone, and force our lessers to serve as frontline soldiers? Our officers may complain of their lack of discipline, but they won't complain when they need fresh bodies."

 # Jurisprudence Ideas
 beua_jurisprudence_ideas:0 "Jurisprudence Ideas"
 beua_jurisprudence_ideas_bonus:0 "Full Jurisprudence"
 beua_jurisprudence_idea_1:0 "Codified Jurisprudence"
 beua_jurisprudence_idea_1_desc:0 "A state cannot rely on arbitrary whims. By compiling a comprehensive collection of constitutional laws, we provide a secure legal foothold for our citizens and reinforce the institutional legitimacy of our government."
 beua_jurisprudence_idea_2:0 "Ministry of Justice"
 beua_jurisprudence_idea_2_desc:0 "By establishing a centralized ministry dedicated to overseeing magistrates, auditing local courts, and updating ancient statutes, we close the legal loopholes that allow corrupt officials to siphon wealth from the state."
 beua_jurisprudence_idea_3:0 "Legal Intellectualism"
 beua_jurisprudence_idea_3_desc:0 "Fostering a robust tradition of constitutional lawyers and scholars allows our administration to formulate new governing theories and societal doctrines with unprecedented speed and clarity."
 beua_jurisprudence_idea_4:0 "Commercial Law Code"
 beua_jurisprudence_idea_4_desc:0 "Unregulated markets breed chaos. By establishing strict, predictable legal frameworks for contracts, property, and disputes, domestic and foreign merchants can conduct business with absolute confidence."
 beua_jurisprudence_idea_5:0 "Anti-Usury Statutes"
 beua_jurisprudence_idea_5_desc:0 "Predatory lending and runaway interest rates cripple public and private investment. Imposing a strict legal ceiling on lending practices protects the treasury and ensures stable access to credit."
 beua_jurisprudence_idea_6:0 "Statutes of Integration"
 beua_jurisprudence_idea_6_desc:0 "Whether expanding by the sword or through peaceful diplomacy, creating standardized legal processes for territorial integration allows us to formalize our sovereign claims with minimal bureaucratic friction."
 beua_jurisprudence_idea_7:0 "Edicts of Universal Protection"
 beua_jurisprudence_idea_7_desc:0 "True jurisprudence extends its shield to all subjects. Enshrining the legal protections of minority populations eliminates internal unrest while signaling to foreign aggressors that our borders will fiercely resist subversion."
 
 # Health Ideas
 beua_health_ideas:0 "Health Ideas"
 beua_health_ideas_bonus:0 "Full Health"
 beua_health_idea_1:0 "Healthy Workforce"
 beua_health_idea_1_desc:0 "A healthy laborer is a productive one. By reducing sick days and keeping workspaces clean, our workshops and manufactories can run at maximum capacity without constant disruptions."
 beua_health_idea_2:0 "Epidemic Prevention Protocols"
 beua_health_idea_2_desc:0 "Few things can destabilize a fortified position like a sudden plague. Implementing strict quarantine and hygiene standards ensures our garrisons can hold out indefinitely."
 beua_health_idea_3:0 "Improved Life Expectancy"
 beua_health_idea_3_desc:0 "By improving the baseline health and lifespan of our people, our population grows steadily, ensuring a deep and rapidly recovering pool of recruits for our armies."
 beua_health_idea_4:0 "Physical Sturdiness"
 beua_health_idea_4_desc:0 "Soldiers hardened by rigorous physical training and proper nutrition can better endure extreme climates and grueling siege operations."
 beua_health_idea_5:0 "Field Medicine & Sanitation"
 beua_health_idea_5_desc:0 "More men are lost to infection, bad water, and scurvy than to enemy blades. Improving sanitation on the march and aboard our ships keeps our forces intact during long deployments."
 beua_health_idea_6:0 "Medical Academies"
 beua_health_idea_6_desc:0 "Investing in medical science and academic research fosters an environment of intellectual growth, allowing our administration to adapt to new societal concepts much faster."
 beua_health_idea_7:0 "Public Infrastructure"
 beua_health_idea_7_desc:0 "Establishing state-funded public medical houses shows the common people that the government cares for their well-being, creating a stable, loyal, and easily taxable populace."

 # State Administration Ideas
 beua_state_administration_ideas:0 "State Administration Ideas"
 beua_state_administration_ideas_bonus:0 "Full State Administration"
 beua_state_administration_idea_1:0 "Provincial Common Law"
 beua_state_administration_idea_1_desc:0 "By modernizing our central archives and streamlining administrative roles, we expand our capacity to govern vast territories while simultaneously lowering the overhead costs of managing individual states."
 beua_state_administration_idea_2:0 "Inland Trade Infrastructure"
 beua_state_administration_idea_2_desc:0 "We must secure and support inland trade networks by building a robust road system and protecting merchants moving across the heartlands."
 beua_state_administration_idea_3:0 "Domestic Conciliation"
 beua_state_administration_idea_3_desc:0 "By opening institutional channels of communication and addressing grievances proactively, we maintain a stable, cooperative equilibrium among all estates of the realm."
 beua_state_administration_idea_4:0 "Administrative Codes"
 beua_state_administration_idea_4_desc:0 "Clear administrative regulations lower local maintenance costs and make the ongoing process of state centralization far more efficient."
 beua_state_administration_idea_5:0 "Administrative Centers"
 beua_state_administration_idea_5_desc:0 "By organizing local administration into regional centers, we can better manage our realm. \n\n§GGain one random point of development§! in every province in a state upon centralization.\n"
 beua_state_administration_idea_6:0 "Anti-Graft Audits"
 beua_state_administration_idea_6_desc:0 "Rigorous oversight and regular financial inspections prevent state officials from abusing their positions, slowly rooting out systemic corruption across the bureaucracy."
 beua_state_administration_idea_7:0 "Enforcement of Direct Authority"
 beua_state_administration_idea_7_desc:0 "Local elites and isolated populaces are often reluctant to yield power back to the capital. We must systematically dismantle provincial privileges to secure absolute crown authority."

 # Centralism Ideas
 beua_centralism_ideas:0 "Centralism Ideas"
 beua_centralism_ideas_bonus:0 "Full Centralism"
 beua_centralism_idea_1:0 "The Sovereign's Decree"
 beua_centralism_idea_1_desc:0 "Local lords and regional assemblies have held onto their historic privileges for too long. By breaking their legal immunities, the central state can actively claw back administrative control over every province."
 beua_centralism_idea_2:0 "Central Tax Administration"
 beua_centralism_idea_2_desc:0 "By standardizing weights, measures, and currency across the realm, our royal treasurers can maximize our tax revenues and ensure every coin owed flows directly to the capital."
 beua_centralism_idea_3:0 "Home Field Advantage"
 beua_centralism_idea_3_desc:0 "Our focus on our core lands has taught us how to best fight in them." 
 beua_centralism_idea_4:0 "Central Planning"
 beua_centralism_idea_4_desc:0 "By focusing our internal developments in key locations, we can accelerate overall growth.\n\nExpanding Infrastructure grants Goods Produced: §G+5%§! and Manpower: §G+10%§! §RThis bonus is halved for Dwarven holds!§!\n"
 beua_centralism_idea_5:0 "Enforced Integration"
 beua_centralism_idea_5_desc:0 "To build a truly unified nation, we must curtail the autonomy of our subjects and aggressively absorb them into our core bureaucracy without disrupting regional stability."
 beua_centralism_idea_6:0 "Metropolis Development"
 beua_centralism_idea_6_desc:0 "Our expertise in developing cities has led to new architectural developments and quality of living."
 beua_centralism_idea_7:0 "Expanded State Bureaucracy"
 beua_centralism_idea_7_desc:0 "A truly centralized state requires an extensive administrative apparatus to direct national policy. While this massive executive network allows us to enact sweeping state reforms effortlessly, expanding its infrastructure demands massive capital investment."

 # Decentralism Ideas
 beua_decentralism_ideas:0 "Decentralism Ideas"
 beua_decentralism_ideas_bonus:0 "Full Decentralism"
 beua_decentralism_idea_1:0 "Local Governors"
 beua_decentralism_idea_1_desc:0 "By divesting administrative power from the central authority to regional rulers, we ensure their long-term loyalty to the crown."
 beua_decentralism_idea_2:0 "Decentralized Administration"
 beua_decentralism_idea_2_desc:0 "Governing an expansive territory requires us to look past rigid central authority, allowing regional assemblies to manage their own affairs efficiently."
 beua_decentralism_idea_3:0 "Empowered Autonomy"
 beua_decentralism_idea_3_desc:0 "By recognizing the sovereignty and military strengths of local authorities, we can better leverage their manpower and navies to our strategic advantage."
 beua_decentralism_idea_4:0 "Regional Cultural Centers"
 beua_decentralism_idea_4_desc:0 "We will refuse to pour all our wealth into a single, suffocating capital city. Instead, fostering multiple regional hubs allows academic ideas and new institutions to flourish naturally."
 beua_decentralism_idea_5:0 "Imperial Expansion"
 beua_decentralism_idea_5_desc:0 "Our sprawling state tradition has perfected the logistics of integrating immense swaths of land, allowing us to demand vast territories at the negotiating table."
 beua_decentralism_idea_6:0 "Pluralistic Governance"
 beua_decentralism_idea_6_desc:0 "An empire of our size is home to many peoples. By establishing broad regional assemblies and legally recognizing the traditions of our diverse cultural groups, we alleviate administrative strain and expand our capacity to rule."
 beua_decentralism_idea_7:0 "Co-Prosperity"
 beua_decentralism_idea_7_desc:0 "By establishing the economic prosperity of our subjects, we secure our own wealth through their tributes.\n\n§TEnables converting §YVassals§! and §YClient States§! into §YDominions§!§!.\n\n"

 # Industrial Ideas
 beua_industrial_ideas:0 "Industrial Ideas"
 beua_industrial_ideas_bonus:0 "Full Industrialization"
 beua_industrial_idea_1:0 "Factory Towns"
 beua_industrial_idea_1_desc:0 "The increased incentives to work in the factories has led to a wave of urbanization centered around our production centers."
 beua_industrial_idea_2:0 "Military-Industrial Foundries"
 beua_industrial_idea_2_desc:0 "By standardizing iron casting methods and mechanizing our national armories, we can mass-produce heavy siege artillery at unprecedented speeds and with lethal structural precision."
 beua_industrial_idea_3:0 "Sending Stone Proliferation"
 beua_industrial_idea_3_desc:0 "New innovations have led us to a cheaper and faster way of acquiring new sending stones, in turn expanding the potential of our diplomatic corps and spy networks."
 beua_industrial_idea_4:0 "Deficit Spending"
 beua_industrial_idea_4_desc:0 "By the gods, who would have known industrialization is so expensive! Fret not, for this has also been a transformative experience for our banks and lenders, and now we can better manage a negative budget."
 beua_industrial_idea_5:0 "Labor Exploitation"
 beua_industrial_idea_5_desc:0 "It is a common fact that the closer a job is to an administration, the easier it is to control and regulate. And now, with peasants flooding into our cities and into our industries, we have lots of jobs to... regulate. Of course, our policies might make it harder to move a man from the factory into the barracks, but that's a problem for the future."
 beua_industrial_idea_6:0 "Mechanized Logistics"
 beua_industrial_idea_6_desc:0 "The rumbling of engines is ever present wherever our armies march. With horseless carriages now carrying men and supplies at revolutionary speeds, our armies can utilize the new philosophy of \"thunder warfare\" to overwhelm our foes."
 beua_industrial_idea_7:0 "Integrated Supply Chains"
 beua_industrial_idea_7_desc:0 "By streamlining the flow of raw materials to manufacturing hubs, we maximize the output of every workshop.\n\nDeveloping a province provides increasing bonuses:\nAt §Y15 Development§!: Grants §GSimple Production§! (+2.5% Production Efficiency).\nAt §Y30 Development§!: Upgrades to §GComplex Production§! (+5% Production Efficiency and §G+1§! Artificer Capacity).\n\n"