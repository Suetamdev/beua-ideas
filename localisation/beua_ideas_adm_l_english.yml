 # Elven Supremacy Ideas
 beua_elven_supremacy_ideas:0 "Elven Supremacy Ideas"
 beua_elven_supremacy_idea_1:0 "Remember the Forebears"
 beua_elven_supremacy_idea_1_desc:0 "Our people have a long and complex history, stretching back to the days when elves dominated the ancient world."
 beua_elven_supremacy_idea_2:0 "Reclaiming Our Birthright"
 beua_elven_supremacy_idea_2_desc:0 "But why should the past remain in the past? We should focus our efforts on restoring the old values of elvenkind, and make sure that all our peoples follow the one true order."
 beua_elven_supremacy_idea_3:0 "Lessons From Jaher"
 beua_elven_supremacy_idea_3_desc:0 "The New Sun Cult spreaded like wildfire, as Jaher the Sun Elf was proclaimed to be the reincarnation of the Bulwari sun god Surakel. By using local cults and religions the same way, we too can better spread our faith."
 beua_elven_supremacy_idea_4:0 "Seniority Rule"
 beua_elven_supremacy_idea_4_desc:0 "The elves are known by all to be longest-lived race in Halann. With lives as long as ours, our rulers have all the time in the world to consolidate their rule and perfect their duties."
 beua_elven_supremacy_idea_5:0 "Police State"
 beua_elven_supremacy_idea_5_desc:0 "It is a constant fight to keep minorities in line, task forces will be set up to specifically deal with these undesireables."
 beua_elven_supremacy_idea_6:0 "Manifest Destiny"
 beua_elven_supremacy_idea_6_desc:0 "By supporting a resettlement program, we can offset elves' low fertility rates and accelerate the integration of newly conquered realms."
 beua_elven_supremacy_idea_7:0 "Conscript Cannon Fodder"
 beua_elven_supremacy_idea_7_desc:0 "We must strive for victory, and we must purge the undesireables from our land. Why not kill two birds with one stone, and force our lessers to serve as frontline soldiers? Our officers may complain of their lack of discipline, but they won't complain when they need fresh bodies."

 # Jurisprudence Ideas
 beua_jurisprudence_ideas:0 "Jurisprudence Ideas"
 beua_jurisprudence_idea_1:0 "Collection of Laws"
 beua_jurisprudence_idea_1_desc:0 "Laws give people security and foothold."
 beua_jurisprudence_idea_2:0 "Ministry of Justice"
 beua_jurisprudence_idea_2_desc:0 "The ministry of justice is occupied creating new laws and update old ones."
 beua_jurisprudence_idea_3:0 "Lawyer Tradition"
 beua_jurisprudence_idea_3_desc:0 "Our lawyers keep the land running."
 beua_jurisprudence_idea_4:0 "Business Law"
 beua_jurisprudence_idea_4_desc:0 "Business law is important to lay down some rules with the interaction with other countries."
 beua_jurisprudence_idea_5:0 "Anti Usury Laws"
 beua_jurisprudence_idea_5_desc:0 "Usury paralyzes the economy. We shall fight it."
 beua_jurisprudence_idea_6:0 "Public International Law"
 beua_jurisprudence_idea_6_desc:0 "Public international law determines some basic rules in the interactions of states."
 beua_jurisprudence_idea_7:0 "Minority Rights"
 beua_jurisprudence_idea_7_desc:0 "Minority rights stabilize our realm and reduce uprisings."

 # Health Ideas
 beua_health_ideas:0 "Health Ideas"
 beua_health_idea_1:0 "Longer Working Hours"
 beua_health_idea_1_desc:0 "Someone who works longer, generates more money."
 beua_health_idea_2:0 "Decreased Danger of Epidemic"
 beua_health_idea_2_desc:0 "There is little that can do more damage to the economy than epidemics. Good practices will prevent them."
 beua_health_idea_3:0 "Improved Lifespan"
 beua_health_idea_3_desc:0 "Through improving the lifespan of our people, we can build our population."
 beua_health_idea_4:0 "Sturdiness"
 beua_health_idea_4_desc:0 "Someone with a sturdy body can better endure extreme situations."
 beua_health_idea_5:0 "Decreased Infant Death"
 beua_health_idea_5_desc:0 "If fewer infants die, our supplies of workers and soldiers will grow greatly."
 beua_health_idea_6:0 "Medicine Technology"
 beua_health_idea_6_desc:0 "Improving medical technology will help us advancing in science."
 beua_health_idea_7:0 "Public Hospitals"
 beua_health_idea_7_desc:0 "Public hospitals will please the common people."

 # State Administration Ideas
 beua_state_administration_ideas:0 "State Administration Ideas"
 beua_state_administration_idea_1:0 "Community Law"
 beua_state_administration_idea_1_desc:0 "Community law will ensure that we keep control over distant provinces and thus increase our capabilities to maintain many states."
 beua_state_administration_idea_2:0 "Inland Trade"
 beua_state_administration_idea_2_desc:0 "We need to support inland trade by building a road system."
 beua_state_administration_idea_3:0 "Administrative Espionage"
 beua_state_administration_idea_3_desc:0 "Our eyes and ears need to be everywhere or we might miss an important detail."
 beua_state_administration_idea_4:0 "Administrative Law"
 beua_state_administration_idea_4_desc:0 "Administrative law keeps the administration transparent and incorrupt."
 beua_state_administration_idea_5:0 "Administrative Centers"
 beua_state_administration_idea_5_desc:0 "By organizing local administration into regional centers, we can better manage our realm. \n\n§GGain one random point of development§! in every province in a state upon centralization."
 beua_state_administration_idea_6:0 "Steering Trade"
 beua_state_administration_idea_6_desc:0 "We need to steer trade to the direction where it is most profitable for us."
 beua_state_administration_idea_7:0 "Enforcement of Progress"
 beua_state_administration_idea_7_desc:0 "Sometimes the peasant population and the unprogressive might be reluctant to accept technical advancements. We need to convince them that advancement is best for them."

 # Centralism Ideas
 beua_centralism_ideas:0 "Centralism Ideas"
 beua_centralism_idea_1:0 "Meritocratic Rule"
 beua_centralism_idea_1_desc:0 "A system of meritocracy will increase the efficiency of our state's governance."
 beua_centralism_idea_2:0 "Central Tax Administration"
 beua_centralism_idea_2_desc:0 "The founding of a centralized taxation system will make our tax collection less vulnerable to corruption and fraud."
 beua_centralism_idea_3:0 "Home Field Advantage"
 beua_centralism_idea_3_desc:0 "Our focus on our core lands has taught us how to best fight in them."
 beua_centralism_idea_4:0 "Central Planning"
 beua_centralism_idea_4_desc:0 "By focusing our internal developments in key locations, we can accelerate overall growth.\n\nExpanding Infrastructure grants Goods Produced: §G+5%§! and Manpower: §G+10%§! §RThis bonus is halved for Dwarven holds!§!"
 beua_centralism_idea_5:0 "Increased Integration"
 beua_centralism_idea_5_desc:0 "To build a successful nation, we must curtail the autonomy of our subjects."
 beua_centralism_idea_6:0 "Metropolis Development"
 beua_centralism_idea_6_desc:0 "Our expertise in developing cities has led to new architectural developments and quality of living."
 beua_centralism_idea_7:0 "Meritocratic Rule"
 beua_centralism_idea_7_desc:0 "A system of meritocracy will increase the efficiency of our state's governance."

 # Decentralism Ideas
 beua_decentralism_ideas:0 "Decentralism Ideas"
 beua_decentralism_idea_1: "Local Governors"
 beua_decentralism_idea_1_desc: "By divesting power from the central authority to local governors, we can insure their loyalty."
 beua_decentralism_idea_2: "Decentralized Administration"
 beua_decentralism_idea_2_desc: "Because of our big territory, we have to work in a decentralized way to govern."
 beua_decentralism_idea_3: "Empowered Autonomy"
 beua_decentralism_idea_3_desc: "We should recognize the strength of local authorities, and leverage them to our advantage."
 beua_decentralism_idea_4: "Cultural Centers"
 beua_decentralism_idea_4_desc: "We won't focus on one cultural center alone, but on many."
 beua_decentralism_idea_5: "Great State"
 beua_decentralism_idea_5_desc: "Our state's tradition of 'blobbing' has made us more efficient in acquiring further land."
 beua_decentralism_idea_6: "Local Trade"
 beua_decentralism_idea_6_desc: "Sometimes local trade in a province can be very profitable in itself. We will remember that."
 beua_decentralism_idea_7: "Co-Prosperity"
 beua_decentralism_idea_7_desc: "By establishing the properity of our subjects, we may in turn enrich ourselves.\n\n§TEnables converting §YVassals§! and §YClient States§! into §YDominions§!§!. §RYou need to have idea:§! §YSphere of Influence(Imperialism Ideas)§! or §YPostal Service(Influence Ideas)§!"

 # Industrial Ideas
 beua_industrial_ideas:0 "Industrial Ideas"
 beua_industrial_idea_1:0 "Factory Towns"
 beua_industrial_idea_1_desc:0 "The increased incentives to work in the factories has led to a wave of urbanization centered around our production centers."
 beua_industrial_idea_2:0 "Railway Expansion"
 beua_industrial_idea_2_desc:0 "Investing in railways will improve our transportation infrastructure."
 beua_industrial_idea_3:0 "Sending Stone Proliferation"
 beua_industrial_idea_3_desc:0 "New innovations has led us to a cheaper and faster way of acquiring new sending stones, in turn expanding the potential of our diplomatic corps and spy networks."
 beua_industrial_idea_4:0 "Deficit Spending"
 beua_industrial_idea_4_desc:0 "By the gods, who would have known industrialization is so expensive! Fret not, for this has also been a transformative experience for our banks and lenders, and now we can better manage a negative budget."
 beua_industrial_idea_5:0 "Labor Exploitation"
 beua_industrial_idea_5_desc:0 "It is a common fact that the closer a job is to an administration, the easier it is to control and regulate. And now, with peasants flooding into our cities and into our industries, we have lots of jobs to... regulate. Of course, our policies might make it harder to move a man from the factory into the barracks, but that's a problem for the future."
 beua_industrial_idea_6:0 "Mechanized Logistics"
 beua_industrial_idea_6_desc:0 "The rumbling of engines is ever present wherever our armies march. With horseless carriages now carrying men and supplies at revolutionary speeds, our armies can utilize the new philosophy of "thunder warfare" to overwhelm our foes."
 beua_industrial_idea_7:0 "Integrated Supply Chains"
 beua_industrial_idea_7_desc:0 "By streamlining the flow of raw materials to manufacturing hubs, we maximize the output of every workshop.\n\nDeveloping a province with §GDiplomatic Power§! provides increasing bonuses:\nAt §Y25 Development§!: Grants §GSimple Production§! (+2.5% Production Efficiency).\nAt §Y50 Development§!: Upgrades to §GComplex Production§! (+5% Production Efficiency and §G+1§! Artificer Capacity)."