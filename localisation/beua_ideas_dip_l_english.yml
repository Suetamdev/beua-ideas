l_english:0
 # Assimilation Ideas
 assimilation_ideas:0 "Assimilation Ideas"
 assimilation_ideas_desc: "The state is doing what it can to assimilate other cultures."
 assimilation_idea_1: "Settlement Program"
 assimilation_idea_1_desc: "Most peoples would rather stay in their local community, and remain divided. To ensure our cultural and racial diversity, we should encourage new families to migrate internally within our country."
 assimilation_idea_2: "Fast Integration"
 assimilation_idea_2_desc: "Vassals shall be integrated as quickly as possible into the motherland."
 assimilation_idea_3: "No Enemies, Brothers"
 assimilation_idea_3_desc: "The first day after we conquer our enemy's lands, we shall call enemy brother.\n\n§TRacial Menu§W §YFocus Policy§! does not cost monarch points\nYou can enact §Y3§! more §YFocus Policy§! §Gwithout costing a diplomat§!\n\n"
 assimilation_idea_4: "Appeasement of Nationalists"
 assimilation_idea_4_desc: "It can be helpful to appease nationalists with small concessions."
 assimilation_idea_5:0 "Swift Replacements"
 assimilation_idea_5_desc:0 "The various peoples of our land are keen to defend it, and will gladly flock to our standards."
 assimilation_idea_6:0 "Positive Pamphlet"
 assimilation_idea_6_desc:0 "Our own philosophers will praise our culture and our work."
 assimilation_idea_7:0 "Cultural Integration Acts"
 assimilation_idea_7_desc:0 "By formalizing the process of inclusion, we remove the bureaucratic hurdles that once slowed the recognition of new peoples. Promoting a culture is no longer a chore of the state, but a natural step in our expansion."

 # Nationalism Ideas
 nationalism_ideas:0 "Nationalism Ideas"
 nationalism_ideas_desc:0 "The state is encouraging the nationalism of the people."
 nationalism_idea_1:0 "Aimed Propaganda"
 nationalism_idea_1_desc:0 "No true sons of our nation will turn down the call to arms."
 nationalism_idea_2:0 "Acquisition of Living Space"
 nationalism_idea_2_desc:0 "Our borders end only where our blood stops flowing. We do not conquer; we reclaim. By consolidating our kin and removing the obstacles to our national unity, we forge a state that is as pure as it is powerful. The fatherland demands total devotion, and we shall provide it through the absolute integration of our rightful lands.\n\n§TRacial Menu§W §YFocus Policy§! does not cost monarch points\nYou can enact §Y2§! more §YFocus Policy§! and §YPurge or Expulsion Policy§! §Gwithout costing a diplomat§!\n\n"
 nationalism_idea_3: "Partisan Attacks"
 nationalism_idea_3_desc: "If the enemy invades our lands, the common people will organise themselves in partisan units."
 nationalism_idea_4: "Rigid Land"
 nationalism_idea_4_desc: "Unbound, Unbent, Unbroken!"
 nationalism_idea_5: "For the Fatherland!"
 nationalism_idea_5_desc: "Our people are inspired to give their everything for our land."
 nationalism_idea_6: "Confidence in the State"
 nationalism_idea_6_desc: "Through our nationalism, our people have unconditional trust towards our rule."
 nationalism_idea_7:0 "Strong Solidarity"
 nationalism_idea_7_desc:0 "If someone tries to conquer our lands, our people will stay loyal."

 # Society Ideas
 society_ideas:0 "Society Ideas"
 society_ideas_desc:0 "The state is eager to build a civil society."
 society_idea_1:0 "War Bonds"
 society_idea_1_desc:0 "War bonds will help us to pay our soldiers."
 society_idea_2:0 "Exchange Program"
 society_idea_2_desc:0 "Exchange programs further understanding between peoples and improve our relations with other countries."
 society_idea_3:0 "Efficient Lawmakers"
 society_idea_3_desc:0 "By reading the fine print and making sure things go right the first time, our lawmakers cut down on the expenses of running a state."
 society_idea_4:0 "Chances of Advancement"
 society_idea_4_desc:0 "Chances of advancement motivate people without a great family to work hard for their success."
 society_idea_5:0 "Alert Population"
 society_idea_5_desc:0 "Our people are alert to every threat."
 society_idea_6:0 "Content People"
 society_idea_6_desc:0 "Content people are less likely to rise in rebellion."
 society_idea_7:0 "Universal Adaptability"
 society_idea_7_desc:0 "An adaptable society is a thriving one."

 # Imperialist Ambition Ideas
 imperialist_ambition_ideas:0 "Imperialist Ambition Ideas"
 imperialist_ambition_ideas_desc:0 "Our country strives to become an empire."
 imperialist_ambition_idea_1:0 "Harvest Festival"
 imperialist_ambition_idea_1_desc:0 "At our yearly harvest festival we can show our people our gratitude and kindness. We will feed the poor and show how gracious we are. \n§GDecision§W to get prestige by investing monarch points."
 imperialist_ambition_idea_2:0 "Centre of Power"
 imperialist_ambition_idea_2_desc:0 "The capital needs to be the most attractive city in the realm, not only because the government resides there but because the capital will reflect the wealth of our nation."
 imperialist_ambition_idea_3:0 "Royal Decree"
 imperialist_ambition_idea_3_desc:0 "By enacting royal decrees we can ensure that the realm will have as much innovativeness as we like it to have. The people, loyal to the crown, will follow us in our ways."
 imperialist_ambition_idea_4:0 "Royal Navy"
 imperialist_ambition_idea_4_desc:0 "The navy of our nation needs to be representative of our greatness and glory."
 imperialist_ambition_idea_5:0 "Crown Lands"
 imperialist_ambition_idea_5_desc:0 "The crown lands are very important to our rule. We need to ensure that the lands we control directly are as prosperous as possible and can maintain a force that will keep our vassals in check."
 imperialist_ambition_idea_6:0 "Royal Armoury"
 imperialist_ambition_idea_6_desc:0 "The royal armoury is so big that we can reinforce our troops with weapons from it whenever necessary."
 imperialist_ambition_idea_7:0 "Acquiring More Vassals"
 imperialist_ambition_idea_7_desc:0 "By our rank as king we are fit to rule over duchies that are below us by god's will. \n§GCasus Belli§W to vassalize your neighbours below 150 development"

 # Imperialism Ideas
 imperialism_ideas:0 "Imperialism Ideas"
 imperialism_ideas_desc:0 "The state thinks of himself as an empire."
 imperialism_idea_1:0 "Glorious Past"
 imperialism_idea_1_desc:0 "Our glorious past helps us always keep the shine of glory."
 imperialism_idea_2:0 "Under Our Wings"
 imperialism_idea_2_desc:0 "The poor fools surrounding us would be better off in our empire - they just don't know it yet.\n\n§GCasus Belli§W to vassalize neighbours with less than 150 development"
 imperialism_idea_3:0 "Sphere of Influence"
 imperialism_idea_3_desc:0 "True power is not merely measured by the land we hold, but by the shadow we cast. \n\n§TEnables converting §YVassals§! and §YClient States§! into §YDominions§!§!. §RYou need to have idea:§! §YCo-Prosperity(Decentralism Ideas)§! or §YPostal Service(Influence Ideas)§!"
 imperialism_idea_4:0 "Imperial Fleet"
 imperialism_idea_4_desc:0 "The fleet of an empire needs to be big."
 imperialism_idea_5:0 "The Law of the Jungle"
 imperialism_idea_5_desc:0 "We have the right to conquer enemy land because we can."
 imperialism_idea_6:0 "Imperial Army"
 imperialism_idea_6_desc:0 "The army of an empire needs to be big."
 imperialism_idea_7:0 "Imperial Tithe"
 imperialism_idea_7_desc:0 "Any citizen of our empire should know that their freedoms are a privilege, that must be repaid in kind."

 # Amphibious Ideas
 amphibious_ideas:0 "Amphibious Ideas"
 amphibious_ideas_desc:0 "We have narrowed our naval ambitions to the coastline."
 amphibious_idea_1:0 "Mariner Academies"
 amphibious_idea_1_desc:0 "By founding state-funded schools for prospecting sailors, we can nurture a growing pool of available seamen and ship industries."
 amphibious_idea_2:0 "Orcish Rowmen"
 amphibious_idea_2_desc:0 "The Orcish slave trade was not exclusively for the sake of plantation owners. By employing orcish slaves on our galleys, we can utilize their exceptional muscle strength and propel our ships faster than ever - and at no cost to our professional sailors."
 amphibious_idea_3:0 "Marine Propaganda"
 amphibious_idea_3_desc:0 "Through rigorous training and state-sponsored tales of heroism, we have convinced our soldiers that the sea is their true home and their victory is inevitable."
 amphibious_idea_4:0 "Invasion Capability"
 amphibious_idea_4_desc:0 ""Your seas are unprotected, friend. All too easy to raid." \n\n§GEnables the Coastal Invasion Casus Belli§W"
 amphibious_idea_5:0 "Extortion of Merchants"
 amphibious_idea_5_desc:0 "Many traders utilise landmarks along the coast to guide their trade routes. Our presence along these coasts has increased our involvements in protecting these merchants, who now owe us their safety."
 amphibious_idea_6:0 "Boarding Parties"
 amphibious_idea_6_desc:0 "Why try facing down a warship's guns, when you can fight on top of it? By training specialized boarding parties, we can treat naval combat like any land invasion and secure extra boats in the process."
 amphibious_idea_7:0 "Coastal Battleplans"
 amphibious_idea_7_desc:0 "The shallow waters of the coastline contains dangerous rocks and other obstacles. By teaching our captains of these waters, our ships can better navigate outside of danger, and escape a pursuing enemy."

 # Colonial Empire Ideas
 colonial_empire_ideas:0 "Colonial Empire Ideas"
 colonial_empire_ideas_desc:0 "Our country is doing everything to build a mighty colonial empire."
 colonial_empire_idea_1:0 "Autonomous Adventurers"
 colonial_empire_idea_1_desc:0 "We don't need to pay people discovering the land. Independent adventurers will do that for us."
 colonial_empire_idea_2:0 "Colonial Oversight"
 colonial_empire_idea_2_desc:0 "Managing a global empire requires more than just ships; it requires a vast network of governors and administrators. By expanding our diplomatic reach, we can maintain control over a wider array of colonial charters and overseas territories."
 colonial_empire_idea_3:0 "More Tariffs"
 colonial_empire_idea_3_desc:0 "Through specific laws we can maximize the profit from the colonies."
 colonial_empire_idea_4:0 "Colonial Conscription"
 colonial_empire_idea_4_desc:0 "In exchange for our help and money, the colonies will provide us with men in times of war."
 colonial_empire_idea_5:0 "Commanding Fleet"
 colonial_empire_idea_5_desc:0 "To defend our colonies we need a big fleet."
 colonial_empire_idea_6:0 "Faster Infrastructure Development"
 colonial_empire_idea_6_desc:0 "As we grow and increase our range of operation, we need to be able to dramatically improve our infrastructure."
 colonial_empire_idea_7:0 "Smooth Troop Transport"
 colonial_empire_idea_7_desc:0 "To fight our colonial rivals or put down uprisings, we need to transport troops as quickly as possible. That way we can keep everyone in check."

 # Magocratic Ideas
 magocratic_ideas:0 "Magocratic Ideas"
 magocratic_ideas_desc:0 "The power to command the arcane is the ultimate mandate to rule. We have restructured our society so that the mastery of magic and the administration of the realm are one and the same."
 magocratic_idea_1:0 "Ancient Tradition"
 magocratic_idea_1_desc:0 "Mages have always held a position of power in society, this has resulted in an increased stability in ours."
 magocratic_idea_2:0 "Private Studies"
 magocratic_idea_2_desc:0 "Education is the foremost concern of any well-to-do mage, and our mages have the entire resources of the country to use in their own pursuit of knowledge."
 magocratic_idea_3:0 "The Magic Tax"
 magocratic_idea_3_desc:0 "We do not patronize the magical elite without expecting something in return. Though they may complain, the mages of our realm will happily pay a small fee for the privilege of working here."
 magocratic_idea_4:0 "Magisterium Ties"
 magocratic_idea_4_desc:0 "We have always respected and supported the role of the magisters in our country, and this reflects on our international standing. Please understand that if The Magisterium has taken this idea, they've gone senile."
 magocratic_idea_5:0 "Arcane Siegecraft"
 magocratic_idea_5_desc:0 "Through the study of structural weaknesses and the application of concentrated destructive magic, our mages can guide our siege engines and spells to dismantle even the most formidable fortresses."
 magocratic_idea_6:0 "Cloak and Wand"
 magocratic_idea_6_desc:0 "Magic is not simply defined by throwing balls of fire or erecting magical fortresses. Magic also has a softer touch, twisting a man's perception or bringing him under a mage's seduction. By integrating magic into our spy networks, they will work more efficiently than others."
 magocratic_idea_7:0 "Pushing the Limits"
 magocratic_idea_7_desc:0 "The relentless pursuit of knowledge bears fruit for those willing to put in effort.\n\n§YLegendary§! skill in magic confers unique bonuses"

 # Monstrous Ideas
 monstrous_ideas:0 "Monstrous Ideas"
 monstrous_ideas_desc:0 "To the 'civilized' world, we are a plague. To us, we are the future. By embracing our primal strength and rejecting the stifling norms of humanity, we forge a nation that survives through sheer ferocity and will."
 monstrous_idea_1:0 "War Economy"
 monstrous_idea_1_desc:0 "It surprises nobody to hear that our nation relies on the trade of slaves and loot. Indeed, we are quite good at what we do."
 monstrous_idea_2:0 "Conquered Bureaucrats"
 monstrous_idea_2_desc:0 "We'd be lying if we said our bureaucrats are efficient. In fact, it seems as if having our own race of people installed as administrators only makes our conquered people despise us even more. Employing loyal members of their race instead will make governance easier."
 monstrous_idea_3:0 "Intimidation Techniques"
 monstrous_idea_3_desc:0 "Part of the perception of strength is not being afraid to throw a few insults at powerful nations."
 monstrous_idea_4:0 "Black Market"
 monstrous_idea_4_desc:0 "Despite turning to the more savage way of running an economy we aren't under any illusions that allowing our population to return home with spoils of war won't cause long term damage. High value items are seized by the state and sold in secret."
 monstrous_idea_5:0 "Brain Drain"
 monstrous_idea_5_desc:0 "We aren't a society of thinkers, but we're smart enough to know that some of our subjects are smarter than us. If left alone, these intellectuals could incite rebellion and unrest. But if we relocate them, then our subjects will be less capable of defying us."
 monstrous_idea_6:0 "Slave Trade"
 monstrous_idea_6_desc:0 "Our economy is in some way fueled by slaves, taken in raids and as prisoners of war."
 monstrous_idea_7:0 "Cult of Personality"
 monstrous_idea_7_desc:0 "Our monstrous society has necessitated the cultivation of great leaders. The weak are beaten, killed and forgotten. The strong survive, they demand the respect of their peers, and their subjects beg for their iron fist. That is what it means to rule."

 # Imperial Ideas (It was necessary to add the beua prefix because Anbennar already had a imperial_ideas defined)
 beua_imperial_ideas:0 "Imperial Ideas"
 beua_imperial_ideas_desc:0 "To be a member of the Empire is to be part of a grand tradition of law and shared destiny. By mastering the intricate dance of imperial diplomacy and internal reform, we secure our place as a pillar of the realm."
 imperial_idea_1:0 "A Velvet Glove"
 imperial_idea_1_desc:0 "Fellow nations find us simply charming, can you imagine anyone accusing us of fabricating frivelous claims on their land? Preposterous."
 imperial_idea_2:0 "Citadel Rennovation"
 imperial_idea_2_desc:0 "The old citadels built by Castanorian engineers dot the borderlands of Anbennar, casting an imposing shadow on any would-be invaders. By studying and rennovating these castles, we can extend their design philosophy to our own fortifications."
 imperial_idea_3:0 "Dameshead Trade"
 imperial_idea_3_desc:0 "Named for its appearance on a map, the Dameshead harbors ships carrying goods from all over Cannor and beyond, and is often called the wealthiest lands in all of Halann. Tapping into this lucrative trade network would benefit us greatly."
 imperial_idea_4:0 "Racial Representation"
 imperial_idea_4_desc:0 "Anbennar does not take for granted its name's meaning. Every racial minority within the empire has a state representing it, who promote their equality and ensures legal representattion."
 imperial_idea_5:0 "Boat Party Attendees"
 imperial_idea_5_desc:0 "The Riverlords of Esmaria are known for hosting lavish parties atop barges that sail down the Esmar River. By sending representatives, we can better rub shoulders with foreign elites and trade information with contacts."
 imperial_idea_6:0 "Urban Industry"
 imperial_idea_6_desc:0 "The Empire's strength lies in its sprawling metropolises. By focusing on industrial densification, every urban center or Dwarven Hold that reaches §Y25 Development§! will significantly increase its industrial output."
 imperial_idea_7:0 "Unification of Anbennar"
 imperial_idea_7_desc:0 "For centuries, the Empire of Anbennar has remained a decentralied state, but that has only led to internal strife and religious divisions. What is Anbennar without its unity? In order to bring Anbennar from the brink of destruction, we must centralize our administration and unify the squabbling princes of the empire."