 # Archmage - Pushing the Limits Bonus
 beua_archmage_necromancy:0 "Limit Break: Necromancy"
 beua_desc_archmage_necromancy:0 "Comprehensive insight into the soul-tether allows us to halt the decay of consciousness and command the cycle of life."
 beua_archmage_evocation:0 "Limit Break: Evocation"
 beua_desc_archmage_evocation:0 "Mastery over the fundamental forces of the ether enables the channeling of raw energy without the need for physical catalysts."
 beua_archmage_divination:0 "Limit Break: Divination"
 beua_desc_archmage_divination:0 "The collapse of temporal barriers grants us total clarity of the past, present, and the infinite web of future possibilities."
 beua_archmage_abjuration:0 "Limit Break: Abjuration"
 beua_desc_archmage_abjuration:0 "Deep understanding of metaphysical resonance allows for the creation of barriers that are absolute and impenetrable."
 beua_archmage_conjuration:0 "Limit Break: Conjuration"
 beua_desc_archmage_conjuration:0 "Knowledge of planar coordinates and spatial folding permits the instantaneous manifestation of matter from the void."
 beua_archmage_enchantment:0 "Limit Break: Enchantment"
 beua_desc_archmage_enchantment:0 "Expert grasp of the psyche's frequency enables the seamless alignment of external wills with our own design."
 beua_archmage_transmutation:0 "Limit Break: Transmutation"
 beua_desc_archmage_transmutation:0 "Total comprehension of elemental alchemy allows for the instantaneous restructuring of any physical substance."
 beua_archmage_illusion:0 "Limit Break: Illusion"
 beua_desc_archmage_illusion:0 "Mastery over sensory perception and collective consciousness renders the distinction between truth and figment irrelevant."