 beua_amphibious_boarding_gear:0 "Amphibious Boarding Gear"
 desc_beua_amphibious_boarding_gear:0 "Specialized equipment designed for marines to board enemy ships more effectively, including grappling hooks, boarding planks, and reinforced armor."

 # Artificer Regiments
 beua_artificer_bionic_implants:0 "Bionic Implants"
 desc_beua_artificer_bionic_implants:0 "Implants ranging from giving a harpy extra wings, to replacing a dwarf's liver, to even attuning someone to magic all result in an increased army quality."
 beua_artificer_emergency_exit:0 "Emergency Exit"
 desc_beua_artificer_emergency_exit:0 "The exact method of dispersal varies wildly. One could get away on a wheeled platform, burrow into a crawlspace, strap a rocket onto themselves or even teleport away. Success rates vary."
 beua_artificer_smart_armor:0 "Mithrilhide"
 desc_beua_artificer_smart_armor:0 "Mithrilhide, son. It hardens in response to physical trauma."\n§RCaution§W: Side effects may include headaches, nausea, muscle pains, restricted bowel movements, heart murmurs, and temporary loss of magic potential. Do not take Mithrilhide (patent pending) more than once within 24 hours. Ask your doctor if Mithrilhide is right for you."
 beua_artificer_evocation_drones:0 "Evocation Drones"
 desc_beua_artificer_evocation_drones:0 "Mages standing far away from a battle can cast war magic into a transmutation device and have it come out of the turret of a wheeled drone. This drone runs on an engine and can be controlled through a scrying crystal."