l_english:
 # Force Government Change
 beua_force_government_change:0 "Force Government Change"
 beua_force_government_change_title:0 "Force Government Change"
 beua_force_government_change_tooltip:0 "Forcefully replace the subject's current ruling dynasty, primary culture, state religion, or government form to match our own, securing total political and cultural alignment."
 beua_force_government_change_desc:0 "Directly intervene in our subject's internal affairs to enforce absolute systemic alignment.\n\n§RThis action will trigger an international backlash, giving us '-0.5 Diplomatic Reputation' for 25 years.§!\n§WThis action can only be used once every §Y25 years§!.§!\n\n§YIf they are not a Monarchy:§!\n- Government changes to §YMonarchy§!.\n- We lose §R-250§! Military Power.\n- Subject gains §R+25%§! Liberty Desire and a negative opinion modifier.\n\n§YIf they have a different Culture Group:§!\n- Primary and Capital culture changes to §Your Culture§!.\n- We lose §R-250§! Diplomatic Power.\n- Subject gains §R+25%§! Liberty Desire and a negative opinion modifier.\n\n§YIf they practice a different Religion:§!\n- State and Capital religion changes to §Your Religion§!.\n- We lose §R-250§! Administrative Power.\n- Subject gains §R+25%§! Liberty Desire and a negative opinion modifier.\n\n§YIf they do not share our Dynasty:§!\n- New Ruler and Heir of §Your Dynasty, Culture, and Religion§!.\n- We lose §R-75§! ADM, DIP, and MIL Power.\n- Subject gains §R+25%§! Liberty Desire and a negative opinion modifier."
 beua_force_government_change_is_rebellious:0 "§R- §Y[From.GetName]§! has over §Y50%§! Liberty Desire.§!"
 beua_force_government_change_cooldown:0 "Our diplomatic apparatus has overseen a massive systemic restructuring too recently. We must wait 25 years before forcing alignment again another country."

 # Appanage Create
 beua_appanage_create:0 "Land an Appanage"
 beua_appanage_create_title:0 "Land an Appanage"
 beua_appanage_create_desc:0 "Are you sure you want to land an Appanage in §Y[From.GetName]§!?\n\n§YReformed Appanages§! represent a modernized feudal contract where the crown provides for its cadet branches in exchange for unwavering military service. \n\nUnlike standard vassals, these 'Brother Kingdoms' are exceptionally loyal to their kin, gaining §G-30.0%§! Liberty Desire if ruled by the same dynasty. They are designed to be powerful march-like states that contribute significantly to our power.\n\n§YBenefits for the Overlord:§!\nEach Appanage increases §GAll Estate Loyalty Equilibrium§! by §G+2.5%§!.\n\n§YMilitary Service:§!\nAppanages maintain their own sovereign interests and §Rdo not join our wars by default§!. Calling them to arms requires the expenditure of §Y5 Favors§!.\n\n§YBenefits for the Subject:§!\n§G+0.5§! Yearly Legitimacy\n§G+10.0%§! Land Forcelimit Modifier\n§G+10.0%§! Naval Forcelimit Modifier\n\n§YAdministrative Burdens:§!\nDue to their high autonomy and sovereign privileges, they suffer:\n§R-6.0§! Global Tax Income\n§R+15.0%§! Development Cost"
 beua_appanage_create_tooltip:0 "We will formally grant the title of §YAppanage§! to the current ruler, establishing them as a recognized §YCadet Branch§! of our house. As kin, they will be significantly more loyal, provided our dynasty remains on their throne."
 beua_appanage_create_too_much_liberty_desire:0 "§R- Liberty Desire of §Y[From.GetName]§! is above §Y25§!.§!"
 beua_appanage_create_from_is_not_monarchy:0 "§R- §Y[From.GetName]§! is NOT a §YMonarchy§!.§!"
 beua_appanage_create_from_is_not_vassal_of_root:0 "§R- §Y[From.GetName]§! is not a §YVassal§! of §Y[Root.GetName]§!.§!"
 beua_appanage_create_not_same_dynasty:0 "§R- The ruler of §Y[From.GetName]§! is not of our Dynasty. Only our own kin can be granted a Appanage.§!"

 # Appanage Release
 beua_appanage_release:0 "Dissolve the Appanage"
 beua_appanage_release_title:0 "Dissolve the Appanage"
 beua_appanage_release_desc:0 "Do you wish to dissolve the Appanage of §Y[From.GetName]§!?\nThis will cost us §R25.00§! Prestige as we cast our own kin aside.\nWe will also lose any cores and claims we have on their provinces."
 beua_appanage_release_tooltip:0 "Dissolve the special status of this Appanage. This will sever the formal dynastic ties and release §Y[From.GetName]§! from all feudal obligations to the Crown."

 # Appanage Promote Heir
 beua_appanage_promote_heir:0 "Appoint Crown Prince"
 beua_appanage_promote_heir_title:0 "Appoint Crown Prince"
 beua_appanage_promote_heir_desc:0 "Do you wish to appoint §Y[From.Heir.GetName]§!, heir to our appanage of §Y[From.GetName]§!, to the [From.GetCrownPrincePrincess] of the §Y[Root.GetAdjective]§! throne?"
 beua_appanage_promote_heir_tooltip:0 "Appoint an heir from our appanage subject and turn them into an heir to our throne."
 beua_appanage_promote_heir_from_is_rebellious:0 "§R- §Y[From.GetName]§! has over §Y50%§! Liberty Desire.§!"
 beua_appanage_promote_heir_root_has_heir:0 "§R- §Y[Root.GetName]§! has already an heir.§!"
 beua_appanage_promote_heir_from_has_no_heir:0 "§R- §Y[From.GetName]§! has no heir.§!"

 # Appanage Grant War Rights
 beua_appanage_grant_war_rights:0 "Grant War Rights"
 beua_appanage_grant_war_rights_title:0 "Grant War Rights"
 beua_appanage_grant_war_rights_desc:0 "Do you wish to grant war rights to §Y[From.GetName]§!, allowing them to declare their own wars?"
 beua_appanage_grant_war_rights_tooltip:0 "Grant our subject the right to wage wars against foreign powers on their own."

 # Appanage Revoke War Rights
 beua_appanage_revoke_war_rights:0 "Revoke War Rights"
 beua_appanage_revoke_war_rights_title:0 "Revoke War Rights"
 beua_appanage_revoke_war_rights_desc:0 "Do you wish to revoke war rights to §Y[From.GetName]§!, forbiding them to declare their own wars other than wars for independence?\nThis action will increase §Y[From.GetName]§!'s liberty desire by §R20.0%§! and worsen their opinion of §Y[Root.GetName]§! by §R-50§!."
 beua_appanage_revoke_war_rights_tooltip:0 "Revoke our subject's right to wage wars against foreign powers on their own."

 # Establish Brother Kingdom
 beua_establish_brother_kingdom:0 "Establish Brother Kingdom"
 beua_establish_brother_kingdom_title:0 "Establish Brother Kingdom"
 beua_establish_brother_kingdom_desc:0 "Do you want to offer §Y[From.GetName]§! to become our Brother Kingdom? \n\nA Brother Kingdom must have the same dynasty as its overlord and can be converted into a personal union after §Y25 years§!. It joins its overlord's wars, but is barely restricted in its diplomacy. It gains a bonus to future ruler skill in all categories and grants its overlord a bonus to legitimacy, heir chance and manpower recovery speed. A Brother Kingdom can declare its independence diplomatically, which the overlord can decline, leading to an independence war. It can only be established by independent nations in other independent nations or vassals with the same dynasty."
 beua_establish_brother_kingdom_tooltip:0 "Make §Y[From.GetName]§! a [Root.GetAdjective] §YBrother Kingdom§!.\n\nA Brother Kingdom must have the same dynasty as its overlord and can be converted into a personal union after §Y25 years§!. It joins its overlord's wars, but is barely restricted in its diplomacy. It gains a bonus to future ruler skill in all categories and grants its overlord a bonus to legitimacy, heir chance and manpower recovery speed. A Brother Kingdom can declare its independence diplomatically, which the overlord can decline, leading to an independence war. It can only be established by independent nations in other independent nations or vassals with the same dynasty."
 beua_establish_brother_kingdom_alert_tooltip:0 "Establish Brother Kingdom"
 beua_establish_brother_kingdom_dialog:0 "§Y[This.GetName]§! offers us that we become their §YBrother Kingdom§!. \n\nA Brother Kingdom must have the same dynasty as its overlord and can be converted into a personal union after §Y25 years§!. It joins its overlord's wars, but is barely restricted in its diplomacy. It gains a bonus to future ruler skill in all categories and grants its overlord a bonus to legitimacy, heir chance and manpower recovery speed. A Brother Kingdom can declare its independence diplomatically, which the overlord can decline, leading to an independence war. It can only be established by independent nations in other independent nations or vassals with the same dynasty. \n\nDo you want to accept?"

 # Make Brother Kingdom To Personal Union
 beua_make_brother_kingdom_to_personal_union: "Convert to Personal Union"
 beua_make_brother_kingdom_to_personal_union_title: "Convert to Personal Union"
 beua_make_brother_kingdom_to_personal_union_desc: "Do you want to demand from §Y[From.GetName]§! to become our Personal Union? \n[personal_union_desc]"
 beua_make_brother_kingdom_to_personal_union_tooltip: "Make your Brother Kingdom §Y[From.GetName]§! to a §YPersonal Union§!.\n"
 beua_make_brother_kingdom_to_personal_union_alert_tooltip: "Convert to Personal Union"
 beua_make_brother_kingdom_to_personal_union_dialog: "§Y[This.GetName]§! demands that we become their §YPersonal Union§!. \n[personal_union_desc] \nDo you want to accept?"
 beua_make_brother_kingdom_to_personal_union_at_least_subject_for_25_years: "Is a subject under §Y[Root.GetName]§! for at least §Y25 years§! (currently §Y[From.GetYearsUnderCurrentOverlord]§!)"

 # Make Personal Union To Brother Kingdom
 beua_make_personal_union_to_brother_kingdom:0 "Convert to Brother Kingdom"
 beua_make_personal_union_to_brother_kingdom_title:0 "Convert to Brother Kingdom"
 beua_make_personal_union_to_brother_kingdom_desc:0 "Do you want to make your heir §Y[Root.Heir.GetName]§! (£adm£ §G[Root.GetHeirAdm]§! / £dip£ §G[Root.GetHeirDip]§! / £mil£ §G[Root.GetHeirMil]§!) the ruler of §Y[From.GetName]§!? \n\nThis will change their liberty desire by §G-10%§!. [Root.Heir.GetSheHeCap] will be removed as your heir, and §Y[From.GetName]§! will be integrated as a §YBrother Kingdom§!.\n\n§YBrother Kingdom Status:§!\nA Brother Kingdom must have the same dynasty as its overlord and can be converted into a personal union after §Y25 years§!. It joins its overlord's wars, but is barely restricted in its diplomacy. It gains a bonus to future ruler skill in all categories and grants its overlord a bonus to legitimacy, heir chance, and manpower recovery speed. A Brother Kingdom can declare its independence diplomatically, which the overlord can decline, leading to an independence war. It can only be established by independent nations in other independent nations or vassals with the same dynasty."
 beua_make_personal_union_to_brother_kingdom_tooltip:0 "Make your Personal Union §Y[From.GetName]§! a §YBrother Kingdom§!.\n\n§YBrother Kingdom Status:§!\nA Brother Kingdom must have the same dynasty as its overlord and can be converted into a personal union after §Y25 years§!. It joins its overlord's wars, but is barely restricted in its diplomacy. It gains a bonus to future ruler skill in all categories and grants its overlord a bonus to legitimacy, heir chance, and manpower recovery speed. A Brother Kingdom can declare its independence diplomatically, which the overlord can decline, leading to an independence war. It can only be established by independent nations in other independent nations or vassals with the same dynasty."

 # Join Brother Kingdom Wars
 beua_join_brother_kingdom_wars:0 "Join Brother Kingdom Wars"
 beua_join_brother_kingdom_wars_title:0 "Join Brother Kingdom Wars"
 beua_join_brother_kingdom_wars_desc:0 "Our forces are mobilized to support the ongoing offensive campaigns of our §YBrother Kingdom§!, §Y[From.GetName]§!."
 beua_join_brother_kingdom_wars_tooltip:0 "Commit our forces to join the offensive wars of our §YBrother Kingdom§!.\n"
 beua_join_brother_kingdom_alert_tooltip:0 "Join Brother Kingdom Wars"

 # Cancel Brother Kingdom
 beua_cancel_brother_kingdom: "Release Brother Kingdom"
 beua_cancel_brother_kingdom_title: "Release Brother Kingdom"
 beua_cancel_brother_kingdom_desc: "Cancel the dependency of §Y[From.GetName]§! of us. This will decrease their opinion about us by §R-200§!, if their liberty desire is below §Y50%§!. We will also lose §R25§! prestige and gain a truce with them for §Y5 years§!."
 beua_cancel_brother_kingdom_tooltip: "Cancel the vassalisation of §Y[From.GetName]§! and grant them independence.\n"
 
 # Create Dominion From Vassal
 beua_dominion_create:0 "Establish Dominion"
 beua_dominion_create_title:0 "Establish Dominion"
 beua_dominion_create_tooltip:0 "We can make §Y[From.GetName]§! a dominion, guarenteeing their autonomy but also increasing their loyalty and unlocking new interactions."
 beua_dominion_create_desc:0 "This action will make §Y[From.GetName]§! a dominion, guarenteeing their autonomy but also increasing their loyalty and unlocking new interactions."
 beua_dominion_create_too_much_liberty_desire:0 "§R- Liberty Desire of §Y[From.GetName]§! is above §Y25§!.§!"

 # Rescind Dominion Status
 beua_dominion_rescind:0 "Rescind Dominion Status"
 beua_dominion_rescind_title:0 "Rescind Dominion Status"
 beua_dominion_rescind_tooltip:0 "We can turn §Y[From.GetName]§! back into a regular vassal, §Rincreasing their liberty desire by 25 and reducing our stability by 1.§!"
 beua_dominion_rescind_desc:0 "This action will turn §Y[From.GetName]§! back into a regular vassal, §Rincreasing their liberty desire by 25 and reducing our stability by 1.§!"