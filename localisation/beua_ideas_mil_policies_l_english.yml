l_english:
 beua_policy_mil_1:0 "The Military Zeal Act"
 desc_beua_policy_mil_1:0 "Increasing the number of priests within the ranks of our military will help convince our soldiers that God is on our side in war and that they are doing God's work."

 beua_policy_mil_2:0 "Field Priests and Soldier's Prayer Books"
 desc_beua_policy_mil_2:0 "We must strive to instill zeal in our soldiers and make them willing to sacrifice themselves for our holy cause. At any time we must ensure that there is a great number of priests to care for the spiritual health of our men in the field, to lead them in worship and to take care of them when their lives end. We must also ensure that they are never without prayer books or any other religious material they might desire during our campaigns."
 
 beua_policy_mil_3:0 "Standardized Mercenary Contracts"
 desc_beua_policy_mil_3:0 "By centralizing our hiring processes and standardizing the terms of service, we have ensured that our mercenary companies are bound by rigid legal codes. This uniformity of discipline, enforced through strict administrative oversight, allows us to extract maximum efficiency from our hired blades."

 beua_policy_mil_4:0 "Technocratic Warfare"
 desc_beua_policy_mil_4:0 "We have replaced the chaos of the front line with the cold logic of the factory. Our administrative records dictate our manufacturing, and our manufacturing dictates the rhythm of battle; our fire output is now the ultimate expression of state-wide technical efficiency."

 beua_policy_mil_5:0 "Institutional Discipline"
 desc_beua_policy_mil_5:0 "Our military excellence is the result of refined logistics and superior equipment. With modern infrastructure supporting our barracks and training fields, and high-quality weaponry in every soldier's hand, our army has evolved into a highly disciplined, professional force."

 beua_policy_mil_6:0 "Centralized Training Hubs"
 desc_beua_policy_mil_6:0 "We have consolidated our military education into a network of national training hubs. With expert command staff guiding the curriculum and modern infrastructure providing the space to drill, our forces gain proficiency at an unprecedented rate."

 beua_policy_mil_7:0 "Vitality Doctrine"
 desc_beua_policy_mil_7:0 "A healthy soldier is a confident soldier. By applying modern sanitation and medical oversight to our offensive maneuver training, we have eliminated the lethargy that plagues lesser armies. Our forces march further and fight harder, knowing their bodies are as resilient as their resolve."

 beua_policy_mil_8:0 "Sanitized Seafaring"
 desc_beua_policy_mil_8:0 "Naval power is as much about logistics as it is about cannon fire. By optimizing life at sea through strict health protocols, we reduce attrition and ensure that our fighting force remains at peak strength, ready to engage at a moment's notice."

 beua_policy_mil_9:0 "Inclusive Mobilization"
 desc_beua_policy_mil_9:0 "We have successfully dismantled the barriers that once limited our recruitment to select groups. By extending the honor of military service to all newly integrated populations, we have tapped into a vast, previously ignored reservoir of potential manpower."

 beua_policy_mil_10:0 "Unified Vanguard"
 desc_beua_policy_mil_10:0 "By integrating the martial traditions of our newest citizens with our own rigorous training standards, we have forged an infantry force of unmatched capability. Every regiment is now a distillation of the best fighting techniques from across our diverse realm."

 beua_policy_mil_11:0 "Social Mobilization Acts"
 desc_beua_policy_mil_11:0 "We have reshaped the relationship between the state and its subjects. By ingraining martial service as a pillar of our social identity, we ensure that every citizen contributes to a culture of discipline, hardening our military from the ground up."

 beua_policy_mil_12:0 "Martial Meritocracy"
 desc_beua_policy_mil_12:0 "In our society, status is earned through the mastery of the finest weaponry. By fostering a culture that celebrates technical proficiency and combat readiness, we ensure that our soldiers approach every engagement with a disciplined focus that is simply unmatched."

 beua_policy_mil_13:0 "Integrated Naval Command"
 desc_beua_policy_mil_13:0 "Naval warfare is a calculated extension of our strategic planning. By subjecting our admirals to the rigorous analytical standards of the general staff, we have optimized our fleet leadership for maximum impact, ensuring every broadside and boarding maneuver is executed with absolute precision."

 beua_policy_mil_14:0 "General Staff: Navy Focus Act"
 desc_beua_policy_mil_14:0 "The general staff was told to concentrate on educating new admirals."

 beua_policy_mil_15:0 "Nationalized Staff Oversight"
 desc_beua_policy_mil_15:0 "We have synthesized the raw energy of our nationalist movement with the analytical rigor of our command staff. Our leaders are now trained to exploit this national fervor, transforming our infantry into a precise, high-impact instrument capable of delivering devastating shock strikes."

 beua_policy_mil_16:0 "War Enthusiasm"
 desc_beua_policy_mil_16:0 "The war enthusiasm is unbroken."

 beua_policy_mil_17:0 "Work for the War Act"
 desc_beua_policy_mil_17:0 "Everyone works to win the war."

 beua_policy_mil_18:0 "Imperial Mercenaries Act"
 desc_beua_policy_mil_18:0 "With an empire this big we need to be able to raise more mercenaries."

 beua_policy_mil_19:0 "Protocol of the Grand Staff"
 desc_beua_policy_mil_19:0 "The intersection of high politics and grand strategy has resulted in a new, stringent code of military discipline. Under this protocol, the court’s influence reinforces the General Staff’s authority, ensuring our forces remain orderly, professional, and entirely focused on the preservation of our national glory."

 beua_policy_mil_20:0 "Standardized Combat Efficiency"
 desc_beua_policy_mil_20:0 "Our military performance is the direct output of our national organization. By optimizing the link between our societal structure and our General Staff’s tactical protocols, we have maximized the lethality of our combined arms, ensuring superior performance across all branches of service."

 beua_policy_mil_21:0 "Bureau of Military Excellence"
 desc_beua_policy_mil_21:0 "By institutionalizing the cooperation between our administrative apparatus and our General Staff, we have streamlined the delivery of resources, equipment, and intelligence to the front lines. This administrative precision translates directly into superior combat efficiency for all branches of our army."

 beua_policy_mil_22:0 "Military-Industrial Optimization"
 desc_beua_policy_mil_22:0 "By aligning the strategic requirements of the General Staff with the productive power of our economy, we have achieved a new level of fiscal efficiency. Our military now operates with reduced overhead, while our industrial base benefits from the organizational discipline of our top command."

 beua_policy_mil_23:0 "Comprehensive Weaponry Mastery Act"
 desc_beua_policy_mil_23:0 "To ensure our standing army remains the finest in the world, we have instituted a comprehensive training program. Soldiers are now required to demonstrate technical proficiency in a wide array of weaponry, ensuring that our forces possess the versatility and discipline needed to dominate any engagement."

 beua_policy_mil_24:0 "Sovereign Combat Standards"
 desc_beua_policy_mil_24:0 "Professionalism without passion is a machine without an engine. By cultivating a deep sense of national purpose within our standing army, we have elevated our troops' morale to unprecedented levels, ensuring that our soldiers remain steadfast and lethal in the face of any threat."

 beua_policy_mil_25:0 "Homeland Defense Integration Act"
 desc_beua_policy_mil_25:0 "By institutionalizing the defense of our sovereign soil as the core mission of our standing forces, we have galvanized our troops' resolve. Every soldier now serves with the clear understanding that they are the primary defenders of our people, our properties, and our prosperity."

 beua_policy_mil_26:0 "Management of Workers Act"
 desc_beua_policy_mil_26:0 "Through specific management of our workers we can muster more men for the army."

 beua_policy_mil_27:0 "State-Sponsored Arms Program"
 desc_beua_policy_mil_27:0 "By aligning our national treasury with our most advanced manufacturing research, we have effectively bridged the gap between economy and lethality. Every soldier is now equipped with the finest weapons our industry can provide, ensuring absolute superiority on the battlefield."

 beua_policy_mil_28:0 "Elite Trade-Armament Protocol"
 desc_beua_policy_mil_28:0 "This protocol mandates the direct investment of trade profits into military research and material acquisition. The result is a standardized level of weapon quality that is unrivaled, ensuring that our troops go into battle with the absolute best equipment, reinforcing their unwavering morale."

 beua_policy_mil_29:0 "Fortress Doctrine"
 desc_beua_policy_mil_29:0 "Our experience with fortresses help us managing them very efficiently."

 beua_policy_mil_30:0 "Sovereign Bastion Doctrine"
 desc_beua_policy_mil_30:0 "Our nation is secured behind a calculated grid of state-of-the-art fortifications. With our borders rendered impassable, our diplomatic corps is free to project our national interests across the world, while the constant state of readiness of our garrisons keeps our army tradition at its peak."

 beua_policy_mil_31:0 "Strategic Colonial Garrisoning"
 desc_beua_policy_mil_31:0 "We have institutionalized the defense of our colonial territories, treating every new settlement as a strategic asset. Our defensive military posture has significantly mitigated the threat of native uprisings, providing the stability necessary for our population centers to flourish."

 beua_policy_mil_32:0 "Integrated Imperial Ordnance Act"
 desc_beua_policy_mil_32:0 "This act mandates the total integration of our colonial resource chains into our national war production system. By streamlining the supply of critical materials, we have optimized the lethality of our military assets, ensuring our forces are the best-equipped fighting force in the world."

 beua_policy_mil_33:0 "Religious Diplomacy"
 desc_beua_policy_mil_33:0 "The policy of religious diplomacy will bring us great support in all of our society."

 beua_policy_mil_34:0 "Maritime Bastion Initiative"
 desc_beua_policy_mil_34:0 "To ensure the security of our maritime borders, the state has mandated a rigorous integration of defensive training and amphibious maneuvering. Our troops are now trained to minimize exposure and maintain operational discipline under fire, rendering our coastlines a death trap for any would-be invader."

 beua_policy_mil_35:0 "Expeditionary Ordnance Standards"
 desc_beua_policy_mil_35:0 "To ensure operational success during complex amphibious landings, we have mandated a strict standardization of ordnance quality. This focus on technological excellence provides our troops with the reliable hardware necessary to maintain absolute discipline in the chaos of a beachhead assault."

 beua_policy_mil_36:0 "Expeditionary Support Doctrine"
 desc_beua_policy_mil_36:0 "We have institutionalized the support of our expeditionary forces, ensuring that every amphibious landing is backed by the full weight of our industrial war machine. This commitment to front-line excellence has significantly enhanced the morale and lethal output of our ground troops in all landing operations."

 beua_policy_mil_37:0 "Best Army of the World"
 desc_beua_policy_mil_37:0 "We are convinced that our army is the best in the world."

 beua_policy_mil_38:0 "State Industrial Promotion Act"
 desc_beua_policy_mil_38:0 "By leveraging the influence of the Court to incentivize our labor force, we have aligned societal aspirations with our industrial output goals. This unified focus on production has fundamentally increased the efficiency and scale of our manufacturing base, turning every factory into a source of national prestige."

 beua_policy_mil_39:0 "National Offensive Coordination"
 desc_beua_policy_mil_39:0 "By aligning our military's offensive maneuvers with the collective fervor of our populace, we have achieved a new level of operational synchronization. Our forces now operate with an inherent advantage in morale, allowing them to maintain the initiative and drive forward with unwavering intensity."

 beua_policy_mil_40:0 "State Meritocratic Doctrine"
 desc_beua_policy_mil_40:0 "We have replaced outdated traditions with a disciplined, meritocratic hierarchy. By trusting in the proven technical standards of our administration and the strategic expertise of our General Staff, our soldiers operate with a level of professional cohesion and discipline that is unrivaled."

 beua_policy_mil_41:0 "Doctrine of National Lethality"
 desc_beua_policy_mil_41:0 "We have institutionalized the synthesis between our national fervor and our technological superiority. By arming our most dedicated citizens with state-of-the-art weaponry, we have forged a military force whose morale is as unyielding as the quality of the arms they carry."

 beua_policy_mil_42:0 "Elite Vanguard Doctrine"
 desc_beua_policy_mil_42:0 "Our societal reforms have prioritized the cultivation of elite combat roles. By aligning our administrative resources with our highest quality standards, we ensure that our cavalry and artillery regiments possess the technical excellence and professional dedication required to dominate the field."

 beua_policy_mil_43:0 "Production Patriotism"
 desc_beua_policy_mil_43:0 "Our people love working for our state."

 beua_policy_mil_44:0 "Auxiliary Integration Doctrine"
 desc_beua_policy_mil_44:0 "We have institutionalized the professional assimilation of our auxiliary forces. By treating our mercenary contracts with the same rigor as our national levies, we have fostered a unified military culture that guarantees consistent discipline across all active regiments."

 beua_policy_mil_45:0 "Consolidated Defensive Identity"
 desc_beua_policy_mil_45:0 "We have synchronized our defensive posture with our assimilation policies to build a truly unified realm. This dual-focus approach ensures that our military, drawn from diverse territories, operates with a single, high-morale objective: the total security of the state."

 beua_policy_mil_46:0 "Foreign Generals"
 desc_beua_policy_mil_46:0 "We will hire foreign, promising generals."

 beua_policy_mil_47:0 "Foreign Tactics"
 desc_beua_policy_mil_47:0 "We have institutionalized the systematic analysis and integration of diverse military doctrines found across our realm. By converting these foreign tactical paradigms into standardized training modules for our standing army, we have achieved a significant enhancement in our cavalry’s operational efficiency and maneuverability."

 beua_policy_mil_48:0 "Integration of Mercenaries"
 desc_beua_policy_mil_48:0 "We have standardized the assimilation of mercenary cohorts into our national manpower reserves while concurrently implementing a new administrative framework for client states. By applying our systematic integration protocols to both personnel and territory, we have expanded our capacity for both military mobilization and regional governance."

 beua_policy_mil_49:0 "Imperial Guard"
 desc_beua_policy_mil_49:0 "Our guard is one of the best trained guards in the world."

 beua_policy_mil_50:0 "Doctrine of Decisive Firepower"
 desc_beua_policy_mil_50:0 "Our imperial ambitions demand a military capable of crushing resistance with professional precision. By prioritizing quality in our artillery and infantry arms, we have developed a doctrine of decisive firepower, ensuring that our forces remain the dominant authority in any encounter."

 beua_policy_mil_51:0 "Registration Act"
 desc_beua_policy_mil_51:0 "We will register all men that can fight for our country in times of war."

 beua_policy_mil_52:0 "Imperial Quality Management"
 desc_beua_policy_mil_52:0 "Our imperial officials will ensure the quality of our produced weapons."

 beua_policy_mil_53:0 "Sovereign Supply Supremacy"
 desc_beua_policy_mil_53:0 "The state mandates the absolute prioritization of military manufacturing to support our imperial reach. Through this policy, our armories and workshops are bound to the service of the empire, providing our soldiers with the equipment superiority needed to enforce our sovereignty across the world."
 
 beua_policy_mil_54:0 "Strategic Integration Protocols"
 desc_beua_policy_mil_54:0 "By aligning our diplomatic channels with the analytical capabilities of our General Staff, we have created a seamless process for territorial assimilation. These standardized protocols reduce the administrative and bureaucratic burden of integrating new domains, allowing for more efficient expansion."

 beua_policy_mil_55:0 "Strategic Siege Standardization"
 desc_beua_policy_mil_55:0 "We have standardized our siege engineering and logistical support, ensuring that our artillery and vanguard units operate with maximum efficacy. By integrating intelligence from our diplomatic network with our superior war production, we can dismantle any defensive position with systematic, predictable speed."

 beua_policy_mil_56:0 "Strategic Reconnaissance Framework"
 desc_beua_policy_mil_56:0 "Our military excellence is built upon a foundation of absolute information superiority. This framework ensures that our General Staff is continuously supported by our covert agencies, providing the tactical edge necessary to maintain high morale and execute rapid, calculated sieges against even the most hardened targets."

 beua_policy_mil_57:0 "Advanced Fortification Subversion"
 desc_beua_policy_mil_57:0 "Our military doctrine recognizes that the most effective way to breach a fortress is to know its weaknesses from within. We have professionalized the subversion of enemy defenses, providing our artillery units with precise intelligence that dramatically increases their effectiveness on the field."

 beua_policy_mil_58:0 "Industrial Espionage"
 desc_beua_policy_mil_58:0 "Our industrial espionage might gain us interesting knowledge that we could put to use in our land."

 beua_policy_mil_59:0 "Inspirational Journeys"
 desc_beua_policy_mil_59:0 "We have institutionalized global field-research expeditions for our high-ranking command staff. By systematically documenting foreign terrain, naval currents, and logistics networks, our officers are equipped with the analytical data necessary to optimize troop and fleet movement across any environment, ensuring unparalleled operational agility."

 beua_policy_mil_60:0 "Frontier Industrial Standardization"
 desc_beua_policy_mil_60:0 "We have synchronized our remote-outpost supply chains with our core industrial production protocols. By standardizing infantry equipment for use in both colonial and domestic theaters, we have achieved a significant reduction in unit costs and a marked increase in the morale of our expeditionary forces."

 beua_policy_mil_61:0 "Strategic Cavalry Integration"
 desc_beua_policy_mil_61:0 "Our military expansion relies on the versatility of our mobile regiments. By integrating high-quality manufacturing standards with our colonial and exploratory agendas, we have optimized our cavalry’s performance and composition, ensuring our mobile vanguard remains the definitive force in any new landscape."

 beua_policy_mil_62:0 "Sovereign Mobilization Authority"
 desc_beua_policy_mil_62:0 "The state now exercises total authority over the mobilization of our demographic assets. By integrating our subject states into our national draft framework, we have secured a vast reserve of manpower, ensuring our capacity to project force is never limited by domestic shortages."

 beua_policy_mil_63:0 "Capital Ship Doctrine"
 desc_beua_policy_mil_63:0 "Our maritime dominance is sustained by the professional coordination of our heavy naval assets. Through the oversight of the General Staff, we have synchronized our fleet’s combat readiness and technological capabilities, ensuring our heavy ships remain the unrivaled arbiters of naval superiority."

 beua_policy_mil_64:0 "Mercantile Military Foundation"
 desc_beua_policy_mil_64:0 "We have synchronized our national trade revenues with the operational requirements of our standing army. This fiscal alignment ensures that our soldiers are consistently well-supplied and remunerated, fostering a culture of professional discipline and high morale throughout our military ranks."

 beua_policy_mil_65:0 "Jurisprudential Garrison Standards"
 desc_beua_policy_mil_65:0 "Our defensive posture is reinforced by a rigorous adherence to imperial law. By applying jurisdictional standards to the garrisoned units, we have cultivated a culture of professional discipline that transforms every fortress into a bastion of unwavering imperial order."

 beua_policy_mil_66:0 "Institutionalized Border Security"
 desc_beua_policy_mil_66:0 "By aligning our defensive strategy with the analytical rigor of our state administration, we have created a seamless system for border maintenance and garrison support. This institutional commitment ensures that our frontline forces are always well-equipped and confident in the logistical backing of the state."

 beua_policy_mil_67:0 "Innovative Training Act"
 desc_beua_policy_mil_67:0 "Through innovative training we can boost the quality of our troops."

 beua_policy_mil_68:0 "Professionalized Expeditionary Care"
 desc_beua_policy_mil_68:0 "Our reliance on auxiliary forces requires a rigorous approach to their maintenance and well-being. By extending our imperial health standards to our mercenary contractors, we have fostered a more reliable and disciplined force, ensuring our hired battalions perform at a standard consistent with our professional infantry."

 beua_policy_mil_69:0 "Mandatory Service Standard"
 desc_beua_policy_mil_69:0 "Our military expansion relies on the professional coordination between the state administration and our societal leaders. This policy standardizes mandatory service across the board, ensuring our traditional social foundations serve as a robust, reliable, and constantly replenished pool of manpower for the imperial army."

 beua_policy_mil_70:0 "Humanist Army"
 desc_beua_policy_mil_70:0 "An army fighting for ideals is a strong army."

 beua_policy_mil_71:0 "Innovative Training Act"
 desc_beua_policy_mil_71:0 "Through innovative training we can boost the quality of our troops."

 beua_policy_mil_72:0 "Mercantile Mobilization Doctrine"
 desc_beua_policy_mil_72:0 "Our military might is directly proportional to our economic prosperity. This doctrine leverages plutocratic wealth to refine our conscription and training programs, ensuring that every soldier and horseman in our service benefits from world-class equipment and elite combat instruction."

 beua_policy_mil_73:0 "Blessing Cannons Act"
 desc_beua_policy_mil_73:0 "The state mandates the sanctification of all artillery batteries to align our military capacity with our religious institutions. This act ensures that our gunners operate with the supreme confidence that they are the instruments of imperial will, guaranteeing precision and unrelenting fire superiority."

 beua_policy_mil_74:0 "Institutionalized Martial Superiority"
 desc_beua_policy_mil_74:0 "We have standardized the deployment of advanced metallurgical and weapon systems for our high-ranking commanders. By ensuring our leaders are equipped with state-of-the-art armaments, we provide them the tactical advantage necessary to deliver devastating shock strikes that break enemy lines with mathematical precision."

 beua_policy_mil_75:0 "Mercantile Professionalism Directive"
 desc_beua_policy_mil_75:0 "Our military excellence is the product of sustained investment in high-quality weaponry and professional training. This directive aligns our commercial strength with our military quality standards, fostering a culture of rigorous discipline and unwavering operational readiness across our entire army."

 beua_policy_mil_76:0 "Frontier Fortification"
 desc_beua_policy_mil_76:0 "We have standardized the rapid construction of defenses in new territories, ensuring our troops are shielded from enemy shock attacks."

 beua_policy_mil_77:0 "Humanist Garrison Doctrine"
 desc_beua_policy_mil_77:0 "Our defensive superiority is founded on the harmony between our population and our fortifications. By maintaining an enlightened environment within our garrisons, we have fostered a resilient defensive network that is highly resistant to the pressures of modern bombardment."

 beua_policy_mil_78:0 "Advanced Defensive Engineering"
 desc_beua_policy_mil_78:0 "Our engineers are at the forefront of military science, developing revolutionary designs for our fortifications. This constant innovation ensures our garrisons are always protected by the most advanced technology, instilling unwavering morale in our soldiers who know they serve behind the world's most capable defenses."

 beua_policy_mil_79:0 "Jurisprudential Defensive Doctrine"
 desc_beua_policy_mil_79:0 "Our defensive capability is anchored in the professional application of imperial law to our fortifications. This doctrine ensures that our garrisons are treated with the full protection and resources required by law, fostering a resilient defensive culture that excels at endurance and rapid recovery."

 beua_policy_mil_80:0 "Tax Incentive Act"
 desc_beua_policy_mil_80:0 "We will give burghers tax incentives to boost their productivity."

 beua_policy_mil_81:0 "Industrial Firepower Initiative"
 desc_beua_policy_mil_81:0 "We have synchronized our manufacturing output with our national transport hubs, providing our infantry with a constant, high-quality stream of ammunition."

 beua_policy_mil_82:0 "Floating Fortresses"
 desc_beua_policy_mil_82:0 "Our heavy ships are floating fortresses and almost indestructible."

 beua_policy_mil_83:0 "Career Military Mandate"
 desc_beua_policy_mil_83:0 "We have standardized the length of military service to ensure a consistent, highly trained force. By retaining veterans for longer periods, we guarantee the continued combat excellence of the imperial ranks."

 beua_policy_mil_84:0 "Unified Force Standardization"
 desc_beua_policy_mil_84:0 "By aligning our national economic capacity with our militaristic ambitions, we have implemented a comprehensive standardization program. This ensures that every infantryman, cavalryman, and artillery battery is equipped to peak combat standards, maximizing the lethal potential of our entire armed forces."

 beua_policy_mil_85:0 "Conqueror Tradition"
 desc_beua_policy_mil_85:0 "We are conquerors - our army will reflect that tradition."

 beua_policy_mil_86:0 "Rational Combat Doctrine"
 desc_beua_policy_mil_86:0 "Our military efficiency is built upon a foundation of enlightened discipline. By integrating humanistic education into our martial training, we produce soldiers who fight with superior clarity and analytical precision, maximizing the lethal impact of every engagement."

 beua_policy_mil_87:0 "Codified Martial Discipline"
 desc_beua_policy_mil_87:0 "By integrating our militaristic traditions with our comprehensive legal code, we have established a rigid administrative framework for soldier conduct. This codification ensures that discipline is not merely a cultural trait, but a legally mandated standard maintained across all ranks."

 beua_policy_mil_88:0 "Elite Sovereign Doctrine"
 desc_beua_policy_mil_88:0 "The strength of our armed forces is a reflection of our state’s own authority. This doctrine formalizes the commitment of our ruling class to the martial arts, ensuring that our armies are motivated by the highest ideals and capable of delivering devastating shock strikes on the battlefield."

 beua_policy_mil_89:0 "Logistical Readiness Doctrine"
 desc_beua_policy_mil_89:0 "Our military superiority relies on the swift and efficient replenishment of our forces. Through superior state administration, we minimize downtime during campaigns and uphold our long-standing martial traditions, ensuring our army remains a constant, professional force."

 beua_policy_mil_90:0 "Imperial Foreign Projection Act"
 desc_beua_policy_mil_90:0 "The state mandates that our military and diplomatic services operate in perfect synergy. This act enforces a standard of iron-clad discipline across our ranks, ensuring our soldiers remain the most capable, controlled, and effective instruments of our imperial authority."

 beua_policy_mil_91:0 "Rhythmic Assault Protocol"
 desc_beua_policy_mil_91:0 "By integrating synchronized war chants into our standard assault maneuvers, we harness the collective psyche of our soldiers. This ritualistic discipline induces a controlled bloodlust that elevates the impact of our initial shock charges against enemy lines."

 beua_policy_mil_92:0 "Imperial Munitions Act"
 desc_beua_policy_mil_92:0 "The state mandates that no battery shall ever face a shortage of ordnance. By integrating our trade routes into our military supply grid, we guarantee that our artillery maintains a lethal, continuous fire superiority over any adversary."

 beua_policy_mil_93:0 "Colonial Regiments"
 desc_beua_policy_mil_93:0 "Our colonies have grown so big that we can exploit them for men, even full regiments."

 beua_policy_mil_94:0 "Coordinated Defensive Positioning"
 desc_beua_policy_mil_94:0 "By integrating our strategic military doctrine with centralized administrative oversight, we have optimized the defensive posture of our frontline units. Our forces are now adept at maneuvering and entrenching with such efficiency that they effectively mitigate the lethality of incoming enemy fire."

 beua_policy_mil_95:0 "Iron Will"
 desc_beua_policy_mil_95:0 "Our men are standing strong and won't be shattered easily."

 beua_policy_mil_96:0 "Heavens Will It"
 desc_beua_policy_mil_96:0 "The gods are surely on our side, especialy when we are storming towards the enemy."

 beua_policy_mil_97:0 "Standardized Field Engineering"
 desc_beua_policy_mil_97:0 "Our engineering divisions have developed modular designs for field fortifications. By implementing these standardized defensive structures at the onset of any engagement, our units significantly mitigate the impact of enemy bombardment."

 beua_policy_mil_98:0 "Institutional Martial Excellence"
 desc_beua_policy_mil_98:0 "By aligning our foundational government structure with our elite military traditions, we have fostered an environment where infantry excellence is the primary metric of state power. This synergy ensures our shock regiments represent the absolute peak of our martial capability."

 beua_policy_mil_99:0 "Fire Drills"
 desc_beua_policy_mil_99:0 "Our regiments are perfectly trained. They know when to fire, that way we can maximize enemy casualties and minimize our own."

 beua_policy_mil_100:0 "Subversive Shock Doctrine"
 desc_beua_policy_mil_100:0 "Our tactical lethality is enhanced by a deep intelligence framework. By pinpointing and exploiting enemy vulnerabilities before the engagement begins, our forces ensure that every shock maneuver is delivered with precise, destabilizing impact."

 beua_policy_mil_101:0 "Imperial Global Standing Act"
 desc_beua_policy_mil_101:0 "The state mandates the total synchronization of our diplomatic status with our military ethos. This act formalizes our status as a dominant global power, imbuing our troops with the conviction that their service is the foundation of our international supremacy."

 beua_policy_mil_102:0 "Counterattack"
 desc_beua_policy_mil_102:0 "By doing quick counterattacks we can nullify the enemy charges."

 beua_policy_mil_103:0 "Field Scouts"
 desc_beua_policy_mil_103:0 "We will always know on what terrain we fight. And we will use that terrain to our best advantage."

 beua_policy_mil_104:0 "Global Recruitment Doctrine"
 desc_beua_policy_mil_104:0 "The strength of our empire lies in our ability to mobilize resources on a global scale. This doctrine formalizes the process of recruiting and training troops across our colonial borders, ensuring that our armies remain replenished by a steady influx of standardized, elite-trained personnel."

 beua_policy_mil_105:0 "Outstanding Captains"
 desc_beua_policy_mil_105:0 "Our captains are well trained and most of them are very skilled. You won't find many incapable."

 beua_policy_mil_106:0 "Production Propaganda"
 desc_beua_policy_mil_106:0 "We will tell our people what we have to tell them to push our production to the limit."

 beua_policy_mil_107:0 "Sanctification Protocol"
 desc_beua_policy_mil_107:0 "By formalizing the spiritual or cultural heritage of our troops, we have reinforced the cohesion of our vanguard formations. This protocol ensures that our soldiers maintain their resolve and defensive integrity when faced with the most intense shock engagements."

 beua_policy_mil_108:0 "Elite Institutional Strike Doctrine"
 desc_beua_policy_mil_108:0 "The lethality of our shock troops is a testament to the commitment of our ruling institutions. This doctrine mandates that our infantry be equipped and trained to prioritize overwhelming aggression, ensuring our forces can shatter enemy lines with unparalleled precision and force."

 beua_policy_mil_109:0 "Strategic Capitulation Doctrine"
 desc_beua_policy_mil_109:0 "The ultimate goal of our military campaigns is the decisive resolution of hostilities. This doctrine empowers our commanders to utilize both shock-force superiority and diplomatic influence to compel enemy garrisons to yield, effectively reducing the time and resources wasted in protracted sieges."

 beua_policy_mil_110:0 "Influence the people"
