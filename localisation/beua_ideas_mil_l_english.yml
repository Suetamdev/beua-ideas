 # Strategic Ideas
 beua_strategic_ideas:0 "Strategic Ideas"
 beua_strategic_idea_1:0 "Marching Drills"
 beua_strategic_idea_1_desc:0 "Ideal fighting conditions are often made by outspeeding and outpositioning an enemy army. By regularly training our armies for faster travel, we can better obtain the high ground."
 beua_strategic_idea_2:0 "Silver Lining"
 beua_strategic_idea_2_desc:0 "There are those who say nothing good can come out of a loss. By reminding them of what a defeat can bring us, both bad and good, we can bolster our war enthusiasm."
 beua_strategic_idea_3:0 "Unified Tactical Doctrine"
 beua_strategic_idea_3_desc:0 "A masterful strategist see the army as one entity. By standardizing training and communication between all the army, we ensure that every strike is perfectly timed for maximum effect."
 beua_strategic_idea_4:0 "Persistence"
 beua_strategic_idea_4_desc:0 "A defeat at the hands of the enemy is not the end of a war. One is only defeated when they refuse to continue fighting."
 beua_strategic_idea_5:0 "Army Doctors"
 beua_strategic_idea_5_desc:0 "Our army doctors will not only help us reducing our casualties in battle but assure that most of our men arrive healthy on the battlefield."
 beua_strategic_idea_6:0 "Objective Warfare"
 beua_strategic_idea_6_desc:0 "We must be aware that every war has an objective, and winning the objective wins us the war."
 beua_strategic_idea_7:0 "Alternative Means"
 beua_strategic_idea_7_desc:0 "In these changing times, the notion of war being a matter of honor and showing prowess had made way for a more practical mindset, that it is an extension of politics and business. Our neighbors would do well to remember this before they reject our propositions."

 # Serpentspine Ideas
 beua_serpentspine_ideas:0 "Serpentspine Ideas"
 beua_serpentspine_idea_1:0 "Dwarven Citadels"
 beua_serpentspine_idea_1_desc:0 "Built upon generations of dwarven engineering, the fortresses and defenses dotting the Serpentspine are renowned for their defensibility. \n\n§YProvinces developed with at least 15 Development and a Fort receive:§!\nFort Level: §G+1§W\nLocal Garrison Size: §G+15.0%§W\n"
 beua_serpentspine_idea_2:0 "Hostile Ground"
 beua_serpentspine_idea_2_desc:0 "Even within your own territory, the Serpentspine Mountains are a treacherous place with no easy access to supplies. Ingenius residents of the Serpentspine Mountains are able to forage for mushrooms and other plantlife, avoiding poisonous flora as they go."
 beua_serpentspine_idea_3:0 "Under Fire"
 beua_serpentspine_idea_3_desc:0 "Modern rifles saw usage within the Serpentspine Mountains much earlier than in other areas of the world. This in turn led to more innovations in armour, while also being magic resistant, Mithril is particularly strong against bullets."
 beua_serpentspine_idea_4:0 "Bastion of the Deeps"
 beua_serpentspine_idea_4_desc:0 "Our holds are more than just homes; they are masterpieces of subterranean engineering. By reinforcing the structural integrity of our tunnel-gates and training our garrisons to strike from the shadows of the vents, we ensure that any foe who enters our halls finds only a slow, bloody death."
 beua_serpentspine_idea_5:0 "Your Last Stand"
 beua_serpentspine_idea_5_desc:0 "Dwarven History is full of tales of long sieges, a few hundred Dwarves holding out against the Greentide. One example was when Gurukk Siegebreaker overwhelmed the hold Khugdihr in 1424. Their bravery is an example to us all."
 beua_serpentspine_idea_6:0 "Make Your Bullets Count"
 beua_serpentspine_idea_6_desc:0 "As the battle within the mountains raged on it was clear that rifles alone weren't going to be enough, one bullet can only hit one target after all. Larger bullets were needed which led to the invention of artillery."
 beua_serpentspine_idea_7:0 "Inheritors of the Spine"
 beua_serpentspine_idea_7_desc:0 "The ruins littering these tunnels are more than just rubble; they are the blueprints of an empire. By mastering the ancient records and routes found within the deeps, we have asserted ourselves as the true successors to the mountain's power. Any who stand in the way of our expansion are merely obstacles to the inevitable reunification of the Spine. \n\n§GEnables the Serpentspine Reclamation Casus Belli inside the regions of Serpentspines§W\n"

 # Legionary Ideas
 beua_legionary_ideas:0 "Legionary Ideas"
 beua_legionary_idea_1:0 "Phlanx Formation"
 beua_legionary_idea_1_desc:0 "Before the age of black powder infantry stood at the core of the army, a particularly effective tactic was the phlanx formation designed to stop cavalry or large monster charges."
 beua_legionary_idea_2:0 "Legionnaire System"
 beua_legionary_idea_2_desc:0 "Soldiers were recruited from provinces as a group the serve together lessening the need to worry about dialects. Formation training was often conducted in silence so that each soldier could react to the movement of others with just their vision alone."
 beua_legionary_idea_3:0 "Always On Campaign"
 beua_legionary_idea_3_desc:0 "Life in the original Phoenix Legions were hard, travelling from one side of the Empire to the other to put down similar revolts. Training on the move, learning on the job."
 beua_legionary_idea_4:0 "Religious Wars"
 beua_legionary_idea_4_desc:0 "Bulwar's recent history has been of religious struggle, where every able-bodied man is expected to fight for their salvation. \n\n§GGain £icon_manpower£ whenever you convert a province to your religion (300 £icon_manpower£ per point of development)§!\n"
 beua_legionary_idea_5:0 "Centralised Power Base"
 beua_legionary_idea_5_desc:0 "In the Bulwar region it is commonplace to have vassals or tributaries known as Akalates. This is a model we can use to our advantage."
 beua_legionary_idea_6:0 "Sun Elf Battlemages"
 beua_legionary_idea_6_desc:0 "When the sun elves made landfall in 1001 AA, their ranks of highly skills mages dwarfed any other's, and were instrumental in the liberation of humanity from gnolls. We must always remember the importance of magic on the battlefield."
 beua_legionary_idea_7:0 "Administering The Fringes"
 beua_legionary_idea_7_desc:0 "Far reaching parts of any empire are hard to control, one solution is to trust trade companies who can administer the region in return of a steady stream of gold."

 # General Staff Ideas
 beua_general_staff_ideas:0 "General Staff Ideas"
 beua_general_staff_1:0 "Theory of Shock Combat"
 beua_general_staff_1_desc:0 "By studying age -old tactics and cavalry maneuvers, our generals become masters at surprising and stunning the enemy."
 beua_general_staff_2:0 "Theory of Ranged Combat"
 beua_general_staff_2_desc:0 "As time goes by and armies around the world abandon bows and arquebus in order to adapt to the musket and the rifle, we will excel at using them in order to trample and overpower our enemies."
 beua_general_staff_3:0 "Naval Maneuver Manual"
 beua_general_staff_3_desc:0 "By employing our admirals to train the next generation, their knowledge will remain and better those to come. The famous Naval Maneuver Manual is considered a cornerstone of any successful and renowned admiral's education."
 beua_general_staff_4:0 "Theory of Siege Combat"
 beua_general_staff_4_desc:0 "After the introduction of cannons, generals do not have to rely on pure luck to best the defenders of the fort. By training our best troops and leadership on the use of cannons, we effectively speed up the cycle of any siege."
 beua_general_staff_5:0 "Theory of Naval Combat"
 beua_general_staff_5_desc:0 "Fire! Reload! Stay in formation! Legendary admirals often inspire their men to go beyond their own limitations. According to acclaimed admirals that have served us, having a legendary presence amongst your men can increase a ship's fire rate as well as shock speed."
 beua_general_staff_6:0 "Constant Drills"
 beua_general_staff_6_desc:0 "The life of a soldier in our ranks is very simple; the soldier's main duty is to stay in the best of shape. To drill constantly will turn every soldier over time into what the State wants him to be; a lean mean killing machine."
 beua_general_staff_7:0 "Expanded Officer Corps"
 beua_general_staff_7_desc:0 "A proper military requires many capable leaders filling many roles. By encouraging its expansion, we can rapidly improve our army. \n\nArmy Tradition from recruiting generals: §G+2§W \n\nNaval Tradition from recruiting admirals: §G+3§W\n"

 # Standing Army Ideas
 beua_standing_army:0 "Standing Army Ideas"
 beua_standing_army_1:0 "Specialized Infantry Training"
 beua_standing_army_1_desc:0 "Various new implementations and techniques vastly improve the effectiveness of the frontline in a battle, thus making our infantrymen excel in the midst of the fight."
 beua_standing_army_2:0 "Cavalry Round Tactics"
 beua_standing_army_2_desc:0 "By employing hit and run as well as surprise attacks, we make excellent use of our cavalry's fierce charge and power, a force to be reckoned with."
 beua_standing_army_3:0 "Command the Barrage"
 beua_standing_army_3_desc:0 "Raining fire upon the enemy, these cannoneers' skills are honed to perfection in order to deliver the most disciplined and brutal barrage."
 beua_standing_army_4:0 "Military Booklet"
 beua_standing_army_4_desc:0 "Advances in the military have led to our staff writing booklets on how to train new recruits and hone their skills to perfection, thus speeding up the time it takes to drill them."
 beua_standing_army_5:0 "Artificery Integration"
 beua_standing_army_5_desc:0 "By honing our forces with rigorous training, we can expand our corps of elite soldiers that field cutting-edge artificery, and fight like no other army can."
 beua_standing_army_6:0 "Fire on my Command!"
 beua_standing_army_6_desc:0 "By training our soldiers to think and act as one, we achieve the state of absolute discipline. No soldier breaks the line, no soldier faulters in front of the enemy, there is just a target and an order to fire."
 beua_standing_army_7:0 "Fire on my Command!"
 beua_standing_army_7_desc:0 "By training our soldiers to think and act as one, we achieve the state of absolute discipline. No soldier breaks the line, no soldier faulters in front of the enemy, there is just a target and an order to fire."

 # Conscription Ideas
 beua_conscription_ideas:0 "Conscription Ideas"
 beua_conscription_idea_1:0 "Quick Mobilisation"
 beua_conscription_idea_1_desc:0 "We can rally our troops very quickly because of our great preparation."
 beua_conscription_idea_2:0 "Not One Step Back!"
 beua_conscription_idea_2_desc:0 "Our rigorous punishments for deserting and refusing orders has made our men more committed to their armies."
 beua_conscription_idea_3:0 "Huge Number of Recruits"
 beua_conscription_idea_3_desc:0 "Because we muster so many men, we can choose the best men for the bests jobs."
 beua_conscription_idea_4:0 "Conscripted Labor"
 beua_conscription_idea_4_desc:0 "A soldiers duty does not end when the marching stops. By utilizing our vast surplus of manpower for structural engineering and routine upkeep, we transform idle recruits into a dedicated workforce."
 beua_conscription_idea_5:0 "Lessons of the Past"
 beua_conscription_idea_5_desc:0 "We must recognize why we conscript and rely on mass assaults."
 beua_conscription_idea_6:0 "Evolution of Doctrine"
 beua_conscription_idea_6_desc:0 "Our methods of training and our tactics keep up with the times."
 beua_conscription_idea_7:0 "Drill Segments"
 beua_conscription_idea_7_desc:0 "We have standardised our training methods for all new recruits."

 # Weapon Quality Ideas
 beua_weapon_quality_ideas:0 "Weapon Quality Ideas"
 beua_weapon_quality_idea_1:0 "Weapon Production"
 beua_weapon_quality_idea_1_desc:0 "A coordinated production of weapons is crucial to equipping a big army."
 beua_weapon_quality_idea_2:0 "Quality Infantry Weapons"
 beua_weapon_quality_idea_2_desc:0 "The weapons of our infantry have to be of the highest quality."
 beua_weapon_quality_idea_3:0 "Quality Cavalry Weapons"
 beua_weapon_quality_idea_3_desc:0 "The weapons of our cavalry have to be of the highest quality."
 beua_weapon_quality_idea_4:0 "Weapons Merchant"
 beua_weapon_quality_idea_4_desc:0 "There are many weapons on the markets and many people who sell weapons."
 beua_weapon_quality_idea_5:0 "Exotic Weapons"
 beua_weapon_quality_idea_5_desc:0 "Our encouragement of fine weaponsmithing has resulted in our country producing unique and highly valuable weapons, often popular with foreign nobility."
 beua_weapon_quality_idea_6:0 "Quality Training"
 beua_weapon_quality_idea_6_desc:0 "High-quality weapons are only as useful as the people wielding them. We should promote weapons training among our forces, so that we may always fight at our strongest."
 beua_weapon_quality_idea_7:0 "Shining Steel"
 beua_weapon_quality_idea_7_desc:0 "Our weapons are of the highest caliber, striking fear into the hearts of our enemies."
 
 # Fortress Ideas
 beua_fortress_ideas:0 "Fortress Ideas"
 beua_fortress_idea_1:0 "Defensive Artillery"
 beua_fortress_idea_1_desc:0 "Keep the enemy in check with defensive artillery fire."
 beua_fortress_idea_2:0 "Better Fort Administration"
 beua_fortress_idea_2_desc:0 "We govern our forts in a more effective way which decreases our maintenance."
 beua_fortress_idea_3:0 "Armored Wagons"
 beua_fortress_idea_3_desc:0 "Pitched battles need not be fought out in the open, we should turn our wagon trains into portable fortifications."
 beua_fortress_idea_4:0 "Reinforced Casemates"
 beua_fortress_idea_4_desc:0 "By integrating heavy stonework and sunken bunker designs into our blueprints, we provide our defenders with superior cover. These positions allow our garrisons to weather the most intense enemy barrages and musket fire with minimal casualties."
 beua_fortress_idea_5:0 "Kobold Warfare"
 beua_fortress_idea_5_desc:0 "Named after the pioneers on asymmetric warfare, Kobold Warfare stresses the importance of the 'little war' over set-piece battles."
 beua_fortress_idea_6:0 "Fortress Cannons"
 beua_fortress_idea_6_desc:0 "Our fortresses are well equipped with cannons. In case of a huge battle we can use them to reinforce our regular army."
 beua_fortress_idea_7:0 "Advanced Fortifications"
 beua_fortress_idea_7_desc:0 "The castles and fortresses of old are not enough in these times. We must innovate and create the strongest fortifications in the world!"

 # Militarism Ideas
 beua_militarism_ideas:0 "Militarism Ideas"
 beua_militarism_idea_1:0 "To Arms!"
 beua_militarism_idea_1_desc:0 "Before we can enact further military reforms, we must rally them to our cause."
 beua_militarism_idea_2:0 "Officer Career"
 beua_militarism_idea_2_desc:0 "Our young ones all dream of a career as an officer."
 beua_militarism_idea_3:0 "Recruitment Centers"
 beua_militarism_idea_3_desc:0 "Our military recruitment campaigns have been disorganized and decentralized - until now."
 beua_militarism_idea_4:0 "Into the Fray"
 beua_militarism_idea_4_desc:0 "The abundance of arms and men supplied by our country has made our generals more daring in battle."
 beua_militarism_idea_5:0 "Volunteers for Defence"
 beua_militarism_idea_5_desc:0 "Being under siege? There will be many people ready to defend their homes."
 beua_militarism_idea_6:0 "Weapon Depots"
 beua_militarism_idea_6_desc:0 "With our infrastructure, we can supply and equip larger armies than ever before."
 beua_militarism_idea_7:0 "Militarized Mages"
 beua_militarism_idea_7_desc:0 "While we have bolstered the ranks of our regular soldiers, the untapped potential of the mages within our borders remains vast. By conscripting these practitioners into our military structure, we can weave arcane power into our tactical doctrines to devastating effect.\n\nEach §YMage Tower§W built grants §G+1.5%§W Shock Damage.\n\n§YNote: This effect may take up to one year to update once a tower is completed.§W\n\nThis effect caps at §G+15.0%§W.\n"

 # Artificery Ideas
 beua_artificery_ideas:0 "Artificery Ideas"
 beua_artificery_idea_1:0 "Treatise on Evocation Magic"
 beua_artificery_idea_1_desc:0 "The Magic Missile knows where it is at all times. It knows this because it knows where it isn't."
 beua_artificery_idea_2:0 "Bionic Implants"
 beua_artificery_idea_2_desc:0 "Our War Artificers have been tinkering with bioengineering lately, and have begun altering themselves and their brothers-in-arms. With cutting-edge bionic implants, they make for terrifyingly strong soldiers. Unfortunately, not all artificers have a medical license, and the process has a high mortality rate.\nDiscipline for Artificer Regiments:§G+5%§W\n"
 beua_artificery_idea_3:0 "Emergency Exit"
 beua_artificery_idea_3_desc:0 "No artificer is satisfied dying on a battlefield, and as such have devised many ways to evacuate a deteriorating situation to treat their wounds. These acts of preservation will it make easier to retrain and reorganize our forces.\n\nArmy Drill Decay for Artificer Regiments: §G-10%§W\nLand Attrition for Artificer Regiments: §G-15%§W\n"
 beua_artificery_idea_4:0 "Mithrilhide"
 beua_artificery_idea_4_desc:0 "With a simple swig of an experimental and highly expensive drug, a soldier can infuse themselves with an abjuration spell. So long as it lasts, the spell can concentrate its protective effects wherever the user wishes, or reflexively react to any injuries to prevent further damage. \n\nShock Damage and Fire Damage received for Artificer Regiments: §G-5%§W\n"
 beua_artificery_idea_5:0 "Expanded Doctrines"
 beua_artificery_idea_5_desc:0 "One thing the establishment forgot about when introducing intellectuals into the army, everyone wants to write their own book about the doctrines of war. We're completely inundated with manuals claiming indestructable moving buildings and flying cannons are the future of warfare."
 beua_artificery_idea_6:0 "Evocation Drones"
 beua_artificery_idea_6_desc:0 "By implementing advanced artificery, a spell can be cast in one location and come out the end of a machine in another. With dedicated crews feeding cables and maintaining these devices, our finest mages can see battle without ever risking their lives.\n\nInfantry Shock for Artificer Regiments:§G+0.15§W\n"
 beua_artificery_idea_7:0 "Synchronized Laboratories"
 beua_artificery_idea_7_desc:0 "Our artificers no longer work in isolation. By establishing a centralized network of scrying mirrors and mana-tethered communication, our researchers can share findings in real-time. This synchronization allows us to maintain multiple complex projects simultaneously without losing focus, while shared data pools drastically shorten the time required to bring new prototypes to the field."

 # War Production Ideas
 beua_war_production_ideas:0 "War Production Ideas"
 beua_war_production_idea_1:0 "Infantry Weapon Manufactory Production"
 beua_war_production_idea_1_desc:0 "Producing infantry weapons in manufactories is much cheaper than producing them independently."
 beua_war_production_idea_2:0 "Expanded Support Companies"
 beua_war_production_idea_2_desc:0 "An army is only as good as the the support it runs on. With faster production in support equipment, we can field more specialized forces."
 beua_war_production_idea_3:0 "Militarized Industry"
 beua_war_production_idea_3_desc:0 "To sustain a long-term conflict, the state must treat the construction of forts, foundries, and monuments as an extension of the battlefield. By standardizing architectural blueprints and streamlining the supply chain for raw materials, we can erect vital infrastructure in record time and at a significantly reduced cost to the treasury."
 beua_war_production_idea_4:0 "Effective Base Construction"
 beua_war_production_idea_4_desc:0 "We need to effectively build storerooms for our troops so that we can supply them at all times."
 beua_war_production_idea_5:0 "Musket Production"
 beua_war_production_idea_5_desc:0 "The production of muskets is crucial for our military capabilities."
 beua_war_production_idea_6:0 "Overclocked Production"
 beua_war_production_idea_6_desc:0 "Our production lines are becoming increasingly efficient, and our techniques are bleeding into commercial industries as well."
 beua_war_production_idea_7:0 "Military Depots"
 beua_war_production_idea_7_desc:0 "Military depots make it easier for us to equip our armies in times of war."

 # Shock Ideas
 beua_shock_ideas:0 "Shock Tactics"
 beua_shock_idea_1:0 "Sudden Assault"
 beua_shock_idea_1_desc:0 "If our enemies rely on the pounding of artillery and fire, we must move fast and quickly overwhelm them to minimize our losses."
 beua_shock_idea_2:0 "Overlapping Attack"
 beua_shock_idea_2_desc:0 "When we charge the enemy, our cavalry can assault the whole frontline or just focus down a single unit. We can also react to opportunities to charge the enemy with great surprise."
 beua_shock_idea_3:0 "Noble Enthusiasm"
 beua_shock_idea_3_desc:0 "Our warrior elite are eager to take to the battlefield, and are willing to pay for their own equipment."
 beua_shock_idea_4:0 "Tales of Heroism"
 beua_shock_idea_4_desc:0 ""I'm a hussar, I'm a Caehn, I'm a wretched Wexonard, routing Silmuna at the Damesear. I'm a Jaddari in the sun, I'm an Escanni on the run, I'm a horse soldier, timeless through and through.""
 beua_shock_idea_5:0 "Relentless Momentum"
 beua_shock_idea_5_desc:0 "A shock charge is only as effective as its second wave. By organizing our reserves to move immediately into the gaps left by the fallen, we ensure that the pressure on the enemy never wavers. Our lines are replenished almost as quickly as they are thinned, keeping the terror of our assault constant"
 beua_shock_idea_6:0 "Dragoon Cavalry"
 beua_shock_idea_6_desc:0 "By focusing on light skirmishes, our cavalry can inflict casualties while never straying too far into danger."
 beua_shock_idea_7:0 "Shock Generals"
 beua_shock_idea_7_desc:0 "Our priority in educating generals is the teachings of close combat."

 # Fire Ideas
 beua_fire_ideas:0 "Fire Ideas"
 beua_fire_idea_1:0 "Concentrated Volleys"
 beua_fire_idea_1_desc:0 "The wrath of a charging foe can be subdued with suppressing fire."
 beua_fire_idea_2:0 "Siege Cannons"
 beua_fire_idea_2_desc:0 "Our cannons are versatile when it comes to sieges or battles."
 beua_fire_idea_3:0 "Quick Reloading"
 beua_fire_idea_3_desc:0 "Training, training, training. Our gun crews will be better than our rivals."
 beua_fire_idea_4:0 "Wait 'til the last second"
 beua_fire_idea_4_desc:0 "Our men will hold their fire until the very last moment to inflict maximum damage to the enemy."
 beua_fire_idea_5:0 "Defensive Fire"
 beua_fire_idea_5_desc:0 "Our fortresses are well equipped for a lasting defensive fire."
 beua_fire_idea_6:0 "Concentrated Fire Support"
 beua_fire_idea_6_desc:0 "Through concentrated fire support we will be able to support our front regiments even better."
 beua_fire_idea_7:0 "Long Range Generals"
 beua_fire_idea_7_desc:0 "Our generals' education will be focused on long range combat."