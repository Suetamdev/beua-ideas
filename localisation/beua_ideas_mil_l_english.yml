l_english:
 # Strategic Ideas
 beua_strategic_ideas:0 "Strategic Ideas"
 beua_strategic_ideas_bonus:0 "Full Strategic"
 beua_strategic_idea_1:0 "Marching Drills"
 beua_strategic_idea_1_desc:0 "Ideal fighting conditions are often made by outspeeding and outpositioning an enemy army. By regularly training our armies for faster travel, we can better obtain the high ground."
 beua_strategic_idea_2:0 "Silver Lining"
 beua_strategic_idea_2_desc:0 "There are those who say nothing good can come out of a loss. By reminding them of what a defeat can bring us, both bad and good, we can bolster our war enthusiasm."
 beua_strategic_idea_3:0 "Unified Tactical Doctrine"
 beua_strategic_idea_3_desc:0 "A masterful strategist see the army as one entity. By standardizing training and communication between all the army, we ensure that every strike is perfectly timed for maximum effect."
 beua_strategic_idea_4:0 "Persistence"
 beua_strategic_idea_4_desc:0 "A defeat at the hands of the enemy is not the end of a war. One is only defeated when they refuse to continue fighting."
 beua_strategic_idea_5:0 "Army Doctors"
 beua_strategic_idea_5_desc:0 "Our army doctors will not only help us reducing our casualties in battle but assure that most of our men arrive healthy on the battlefield."
 beua_strategic_idea_6:0 "Keypoint Defense"
 beua_strategic_idea_6_desc:0 "We must be aware that every war has a strategic objective. By fortifying and holding our key positions, we deny the enemy their goal and secure our own ultimate victory."
 beua_strategic_idea_7:0 "Alternative Means"
 beua_strategic_idea_7_desc:0 "In these changing times, the notion of war being a matter of honor and showing prowess had made way for a more practical mindset, that it is an extension of politics and business. Our neighbors would do well to remember this before they reject our propositions."

 # Serpentspine Ideas
 beua_serpentspine_ideas:0 "Serpentspine Ideas"
 beua_serpentspine_ideas_bonus:0 "Full Serpentspine"
 beua_serpentspine_idea_1:0 "Dwarven Citadels"
 beua_serpentspine_idea_1_desc:0 "Built upon generations of dwarven engineering, our fortresses are legendary. \n\n§YProvinces with at least 15 Development located in the Serpentspine region receive:§!Fort Level: §G+1§W, Local Garrison Size: §G+15.0%§W, and Local Fort Maintenance: §R+15.0%§W\n\n"
 beua_serpentspine_idea_2:0 "Architectural Mastery"
 beua_serpentspine_idea_2_desc:0 "The deeps require constant maintenance and grand construction projects to remain habitable. Our mastery over stone allows us to restore ancient wonders and expand our holds with unprecedented speed."
 beua_serpentspine_idea_3:0 "Mithril Plating"
 beua_serpentspine_idea_3_desc:0 "Through ancient techniques and metallurgy, we have refined Mithril-infused armor that is both lightweight and nearly impervious to early rifle fire, granting our infantry a decisive edge in close-quarters combat."
 beua_serpentspine_idea_4:0 "Bastion of the Deeps"
 beua_serpentspine_idea_4_desc:0 "Our holds are more than just homes; they are masterpieces of subterranean engineering. By reinforcing the structural integrity of our tunnel-gates and training our garrisons to strike from the shadows of the vents, we ensure that any foe who enters our halls finds only a slow, bloody death."
 beua_serpentspine_idea_5:0 "Your Last Stand"
 beua_serpentspine_idea_5_desc:0 "Dwarven History is full of tales of long sieges, a few hundred Dwarves holding out against the Greentide. One example was when Gurukk Siegebreaker overwhelmed the hold Khugdihr in 1424. Their bravery is an example to us all."
 beua_serpentspine_idea_6:0 "Make Your Bullets Count"
 beua_serpentspine_idea_6_desc:0 "As the battle within the mountains raged on it was clear that rifles alone weren't going to be enough, one bullet can only hit one target after all. Larger bullets were needed which led to the invention of artillery."
 beua_serpentspine_idea_7:0 "Inheritors of the Spine"
 beua_serpentspine_idea_7_desc:0 "The ruins littering these tunnels are more than just rubble; they are the blueprints of an empire. By mastering the ancient records and routes found within the deeps, we have asserted ourselves as the true successors to the mountain's power. Any who stand in the way of our expansion are merely obstacles to the inevitable reunification of the Spine. \n\n§GEnables the Serpentspine Reclamation Casus Belli inside the regions of Serpentspines§W\n"

 # Legionary Ideas
 beua_legionary_ideas:0 "Legionary Ideas"
 beua_legionary_ideas_bonus:0 "Full Legionary Doctrine"
 beua_legionary_idea_1:0 "Phalanx Formation"
 beua_legionary_idea_1_desc:0 "Before the age of black powder, infantry stood at the core of the army. The phalanx formation was a particularly effective tactic, specifically designed to withstand cavalry charges and the onslaught of large monsters."
 beua_legionary_idea_2:0 "Legionnaire System"
 beua_legionary_idea_2_desc:0 "Soldiers are recruited from provinces as cohesive groups to serve together, bridging dialect barriers. Silent formation training ensures each soldier can react to the movements of their peers through sight alone."
 beua_legionary_idea_3:0 "Crusading Doctrine"
 beua_legionary_idea_3_desc:0 "To rule the Empire, one must be everywhere at once. Our troops have learned to maintain their martial edge through constant deployment, ensuring that the sword of the state is always near enough to support our missionaries in their noble work of conversion."
 beua_legionary_idea_4:0 "Religious Wars"
 beua_legionary_idea_4_desc:0 "Bulwar's history is one of religious struggle, where every able-bodied man is expected to fight for their salvation. \n\n§GGain 300 Manpower per point of development whenever you convert a province to your religion.§!"
 beua_legionary_idea_5:0 "Centralised Power Base"
 beua_legionary_idea_5_desc:0 "In Bulwar, it is commonplace to rely on vassals or tributaries known as Akalates. By integrating this model into our own military structure, we empower our core infantry with the support of our subjects."
 beua_legionary_idea_6:0 "Sun Elf Battlemages"
 beua_legionary_idea_6_desc:0 "When the Sun Elves made landfall in 1001 AA, their ranks of highly skilled battlemages dwarfed all others. We must ensure the integration of magical support remains central to our offensive battlefield tactics."
 beua_legionary_idea_7:0 "Administering The Fringes"
 beua_legionary_idea_7_desc:0 "The distant corners of our empire are difficult to manage. By granting local autonomy in exchange for unwavering loyalty and military support, we keep our subjects compliant and ensure our administration remains stable."

 # General Staff Ideas
 beua_general_staff_ideas:0 "General Staff Ideas"
 beua_general_staff_ideas_bonus:0 "Full General Staff"
 beua_general_staff_1:0 "Elite Officer Selection"
 beua_general_staff_1_desc:0 "We have refined our methods for identifying and promoting the most promising talents in the army, ensuring that our leadership is composed only of the finest tacticians."
 beua_general_staff_2:0 "Advanced Combat Theory"
 beua_general_staff_2_desc:0 "By studying the evolution of modern ballistics and close-quarters maneuvers, our command staff has redefined the standards of martial excellence for our generals."
 beua_general_staff_3:0 "Strategic Maneuver Doctrine"
 beua_general_staff_3_desc:0 "Our General Staff emphasizes the mastery of positioning, recognizing that a battle is often won before the first shot is fired. Whether maneuvering armies across complex terrain or navigating fleets through treacherous waters, our commanders are trained to anticipate movement and strike where the enemy is most vulnerable."
 beua_general_staff_4:0 "Naval Gunnery Standards"
 beua_general_staff_4_desc:0 "Standardizing the caliber and loading procedures of our naval guns has allowed our admirals to maximize the devastating potential of every broadside fired."
 beua_general_staff_5:0 "Professional Military Ethos"
 beua_general_staff_5_desc:0 "A military that constantly evaluates its performance never grows stale. By fostering a culture of perpetual review, we ensure our hard-earned traditions of victory are never forgotten."
 beua_general_staff_6:0 "Corps of Engineers"
 beua_general_staff_6_desc:0 "Siege warfare is a science of geometry and patience. Our dedicated engineering staff is trained to dismantle fortresses through precision calculations and masterful command."
 beua_general_staff_7:0 "Expanded Officer Corps"
 beua_general_staff_7_desc:0 "The demands of our empire require more talent than tradition alone can provide. By opening the officer ranks to all capable citizens, regardless of gender, we have unlocked a vast new pool of military brilliance.\nArmy Tradition from recruiting generals: §G+2§W\nNaval Tradition from recruiting admirals: §G+3§W\n"

 # Standing Army Ideas
 beua_standing_army_ideas:0 "Standing Army Ideas"
 beua_standing_army_ideas_bonus:0 "Full Standing Army"
 beua_standing_army_1:0 "Regimental Drill Standards"
 beua_standing_army_1_desc:0 "To maintain a standing army, constant practice is mandatory. Our new training regimens allow our soldiers to reach peak readiness in record time, though the intensity of this service strains our manpower reserves."
 beua_standing_army_2:0 "Line Infantry Doctrine"
 beua_standing_army_2_desc:0 "Our infantry is trained to function as a unified machine. By mastering the coordination of fire and shock maneuvers, our soldiers can overwhelm any foe they face in the open field."
 beua_standing_army_3:0 "Shock Cavalry Doctrines"
 beua_standing_army_3_desc:0 "Our cavalry is a force to be reckoned with. By focusing on aggressive charge tactics and breakthrough maneuvers, we ensure that our horsemen deliver a devastating blow that shatters enemy lines."
 beua_standing_army_4:0 "Command the Barrage"
 beua_standing_army_4_desc:0 "Raining fire upon the enemy, our cannoneers' skills are honed to perfection. We provide the disciplined and brutal firepower necessary to break the enemy's will from a distance."
 beua_standing_army_5:0 "Artificery Integration"
 beua_standing_army_5_desc:0 "By integrating cutting-edge artificery into our elite units, we have created a fighting force that possesses technological superiority. Their specialized training ensures our equipment is used to its full potential."
 beua_standing_army_6:0 "Systematic Sieges"
 beua_standing_army_6_desc:0 "Victory in war is often decided by the walls we can topple. Our standing army uses established, methodical protocols to isolate and reduce enemy fortifications with ruthless efficiency."
 beua_standing_army_7:0 "The Professional Code"
 beua_standing_army_7_desc:0 "Every soldier in our ranks knows their duty. By fostering a culture of long-term service and professional excellence, we transform a collection of recruits into a permanent, elite military institution."

 # Conscription Ideas
 beua_conscription_ideas:0 "Conscription Ideas"
 beua_conscription_ideas_bonus:0 "Full Conscription"
 beua_conscription_idea_1:0 "Quick Mobilisation"
 beua_conscription_idea_1_desc:0 "Our streamlined mobilization process allows us to replenish depleted ranks rapidly while keeping our soldiers well-supplied on the march."
 beua_conscription_idea_2:0 "Not One Step Back!"
 beua_conscription_idea_2_desc:0 "Strict discipline and severe penalties for desertion ensure that our reserves remain plentiful and ready to return to the front lines."
 beua_conscription_idea_3:0 "Total Mobilisation"
 beua_conscription_idea_3_desc:0 "By extending the draft to every corner of the realm, we ensure a vast pool of recruits to draw from for our armies and navies."
 beua_conscription_idea_4:0 "Conscripted Labor"
 beua_conscription_idea_4_desc:0 "A soldier's duty extends beyond the battlefield. We utilize our vast surplus of manpower for fortification upkeep and state construction projects."
 beua_conscription_idea_5:0 "Ideological Conditioning"
 beua_conscription_idea_5_desc:0 "Through rigorous indoctrination and repetitive training, we maintain our troops' morale and ensure their combat readiness never falters."
 beua_conscription_idea_6:0 "Stoic Doctrine"
 beua_conscription_idea_6_desc:0 "Our soldiers have been trained to withstand the psychological horrors of war, reducing the impact of enemy morale shocks."
 beua_conscription_idea_7:0 "Standardised Training"
 beua_conscription_idea_7_desc:0 "By standardising our enlistment and training procedures, we can support significantly larger forces and integrate new recruits into existing units with unmatched speed."

 # Weapon Quality Ideas
 beua_weapon_quality_ideas:0 "Weapon Quality Ideas"
 beua_weapon_quality_ideas_bonus:0 "Full Weapon Quality"
 beua_weapon_quality_idea_1:0 "Specialized Production"
 beua_weapon_quality_idea_1_desc:0 "Our focus on high-precision weaponry reduces production costs for military advancements, though the complexity of these arms slows down the reinforcement of our frontline troops."
 beua_weapon_quality_idea_2:0 "Logistical Readiness"
 beua_weapon_quality_idea_2_desc:0 "By keeping reserve caches organized and ready, we ensure our troops are prepared to hold the line at a moment's notice."
 beua_weapon_quality_idea_3:0 "Professional Ordnance Corps"
 beua_weapon_quality_idea_3_desc:0 "A dedicated corps focused on weapon maintenance and handling significantly raises the professional standards of our army."
 beua_weapon_quality_idea_4:0 "Improved Infantry Musketry"
 beua_weapon_quality_idea_4_desc:0 "Equipping our infantry with standardized, high-quality firearms ensures they remain superior on the battlefield."
 beua_weapon_quality_idea_5:0 "Superior Cavalry Sabers"
 beua_weapon_quality_idea_5_desc:0 "Providing our mounted units with refined steel ensures they maintain a lethal edge in close-quarters combat."
 beua_weapon_quality_idea_6:0 "Advanced Artillery Metallurgy"
 beua_weapon_quality_idea_6_desc:0 "By improving the quality and design of our barrels, our artillery can sustain more effective fire from the back ranks."
 beua_weapon_quality_idea_7:0 "Shining Steel"
 beua_weapon_quality_idea_7_desc:0 "Our weapons are of the highest caliber, inflicting demoralizing wounds that shatter the enemy's will to fight."
 
 # Fortress Ideas
 beua_fortress_ideas:0 "Fortress Ideas"
 beua_fortress_ideas_bonus:0 "Full Fortress"
 beua_fortress_idea_1:0 "Defensive Bastions"
 beua_fortress_idea_1_desc:0 "Modernized bastions and improved garrisons ensure our fortresses can hold out longer against sieges."
 beua_fortress_idea_2:0 "Efficient Garrison Logistics"
 beua_fortress_idea_2_desc:0 "Streamlined bureaucracy and supply chains allow us to maintain our fortress network at a fraction of the cost."
 beua_fortress_idea_3:0 "Field Entrenchment"
 beua_fortress_idea_3_desc:0 "By teaching our soldiers to quickly dig in and fortify their positions, we significantly reduce the shock damage taken in open battle."
 beua_fortress_idea_4:0 "Reinforced Casemates"
 beua_fortress_idea_4_desc:0 "Specialized bunker designs and heavy masonry shield our troops from enemy fire, reducing casualties during intense bombardments."
 beua_fortress_idea_5:0 "Scorched Earth Strategy"
 beua_fortress_idea_5_desc:0 "We make the land itself our ally, forcing enemy armies to wither away from attrition as they navigate our defensive lines."
 beua_fortress_idea_6:0 "Siege Engineering Corps"
 beua_fortress_idea_6_desc:0 "Our mastery of fortress artillery translates perfectly to the field; our engineers now produce superior siege guns at a lower cost."
 beua_fortress_idea_7:0 "Impenetrable Strongholds"
 beua_fortress_idea_7_desc:0 "With state-of-the-art defensive architecture and deadly flanking fire, our fortresses become nearly impossible to take."
 
 # Militarism Ideas
 beua_militarism_ideas:0 "Militarism Ideas"
 beua_militarism_ideas_bonus:0 "Full Militarism"
 beua_militarism_idea_1:0 "Patriotic Fervor"
 beua_militarism_idea_1_desc:0 "A deeply instilled sense of duty and national pride bolsters the morale of our troops on the field."
 beua_militarism_idea_2:0 "Professional Officer Corps"
 beua_militarism_idea_2_desc:0 "Creating a prestigious career path for officers allows us to retain talent and maintain our army's traditions."
 beua_militarism_idea_3:0 "Systematic Conscription"
 beua_militarism_idea_3_desc:0 "Centralized recruitment efforts allow us to tap into our nation's manpower reserves with greater speed and efficiency."
 beua_militarism_idea_4:0 "Aggressive Doctrine"
 beua_militarism_idea_4_desc:0 "Our generals are encouraged to pursue bold, decisive engagements, allowing them to gain invaluable experience in the heat of battle."
 beua_militarism_idea_5:0 "Citizen Militia"
 beua_militarism_idea_5_desc:0 "In times of crisis, the local populace is trained and ready to bolster the defense of our strongholds."
 beua_militarism_idea_6:0 "Expanded Logistics"
 beua_militarism_idea_6_desc:0 "Our infrastructure supports a larger standing army, while specialized artillery training enhances our shock capabilities."
 beua_militarism_idea_7:0 "Militarized Mages"
 beua_militarism_idea_7_desc:0 "While we have bolstered the ranks of our regular soldiers, the untapped potential of the mages within our borders remains vast. By conscripting these practitioners into our military structure, we can weave arcane power into our tactical doctrines to devastating effect.\n\nEach §YMage Tower§W built grants §G+1.5%§W Shock Damage.\n\n§YNote: This effect may take up to one year to update once a tower is completed.§W\n\nThis effect caps at §G+15.0%§W.\n"

 # Artificery Ideas
 beua_artificery_ideas:0 "Artificery Ideas"
 beua_artificery_ideas_bonus:0 "Full Artificery"
 beua_artificery_idea_1:0 "Theory of Arcane Ballistics"
 beua_artificery_idea_1_desc:0 "The Magic Missile knows where it is at all times. It knows this because it knows where it isn't. By formalizing the geometry of spell-trajectory, we have ushered in a new era of scientific precision and fostered a culture of rapid innovation."
 beua_artificery_idea_2:0 "Biomechanical Augmentation"
 beua_artificery_idea_2_desc:0 "Our workshops have pioneered the integration of clockwork and mana-conductive alloys into the human frame. While these augmentations grant our soldiers unmatched efficiency, the biological rejection and lack of surgical standardisation remain a significant drain on our reserves."
 beua_artificery_idea_3:0 "Automated Triage Arrays"
 beua_artificery_idea_3_desc:0 "Death is a failure of engineering. By equipping our specialists with autonomous arcane extraction beacons, we ensure that even the most battered veteran is pulled from the front lines before the light fades, allowing us to maintain the readiness of our forces."
 beua_artificery_idea_4:0 "Reactive Abjuration Fields"
 beua_artificery_idea_4_desc:0 "We have replaced heavy plate armor with lightweight conduits that generate a protective ward upon impact. This 'smart armor' effectively turns the chaos of the battlefield into a feedback loop of arcane defense, neutralizing enemy strikes before they find purchase."
 beua_artificery_idea_5:0 "Standardized Artificer Doctrine"
 beua_artificery_idea_5_desc:0 "The surge of academic interest in military science has allowed us to integrate more artificers into our national infrastructure. We have moved past artisanal tinkering toward a unified, industrial-scale approach to managing our most complex and volatile technologies."
 beua_artificery_idea_6:0 "Automated Evocation Drones"
 beua_artificery_idea_6_desc:0 "Direct combat is an inefficient use of our specialized technicians. By deploying swarms of automated evocation drones, we can project force across the battlefield remotely. With dedicated crews monitoring telemetry and maintaining these mechanical conduits, our offensive firepower is sustained by cold, calculating machines rather than fragile infantry."
 beua_artificery_idea_7:0 "Integrated Research Grid"
 beua_artificery_idea_7_desc:0 "By tethering our laboratories through a centralized scrying network, we have turned our entire state into an engine of innovation. Data flows as freely as mana, allowing us to accelerate our discoveries and optimize our heartlands with unprecedented efficiency."

 # War Production Ideas
 beua_war_production_ideas:0 "War Production Ideas"
 beua_war_production_ideas_bonus:0 "Full War Production"
 beua_war_production_idea_1:0 "Manufactory Standardization"
 beua_war_production_idea_1_desc:0 "By centralizing the manufacture of small arms, we have eliminated the waste of independent workshop production. Our infantry can now be equipped in mass, though the rapid churn of new recruits inevitably dilutes the martial experience of our veteran officer corps."
 beua_war_production_idea_2:0 "Logistical Support Integration"
 beua_war_production_idea_2_desc:0 "An army's reach is defined by its logistics. By streamlining the production lines for cavalry tack and artillery carriages, we have ensured that our support companies are always ready to deploy at a moment's notice."
 beua_war_production_idea_3:0 "Militarized Infrastructure"
 beua_war_production_idea_3_desc:0 "To sustain long-term conflict, the state treats construction as an extension of the battlefield. By standardizing blueprints and streamlining supply chains, we erect vital fortifications and foundries in record time at a fraction of the cost."
 beua_war_production_idea_4:0 "Strategic Supply Networks"
 beua_war_production_idea_4_desc:0 "We have constructed vast, interconnected supply depots across the realm. This allows our armies to maintain their momentum deep in enemy territory without being throttled by the realities of local supply limits or environmental attrition."
 beua_war_production_idea_5:0 "Advanced Ballistics Casting"
 beua_war_production_idea_5_desc:0 "Refined casting techniques have turned our musket output into a lethal science. These high-grade weapons are so sought after that our surplus is now a major commodity in international trade, opening new avenues for mercantile profit."
 beua_war_production_idea_6:0 "Industrial Overclocking"
 beua_war_production_idea_6_desc:0 "Our production lines operate at peak capacity, ignoring the usual limits of labor and wear. While this relentless pace puts a strain on the populace's morale during prolonged warfare, the sheer volume of goods produced is unmatched."
 beua_war_production_idea_7:0 "National Mobilization Centers"
 beua_war_production_idea_7_desc:0 "We have expanded our naval shipyards and inland recruitment hubs to act as permanent mobilization centers. With the infrastructure in place to rapidly commission new fleets and legions, our potential for expansion is limited only by our ambition."

 # Shock Ideas
 beua_shock_ideas:0 "Shock Ideas"
 beua_shock_ideas_bonus:0 "Full Shock"
 beua_shock_idea_1:0 "Sudden Assault"
 beua_shock_idea_1_desc:0 "To survive the modern obsession with gunpowder and artillery, our armies have learned to close the distance rapidly. By forcing the enemy into melee before they can unleash their full volley, we negate their primary tactical advantage."
 beua_shock_idea_2:0 "Overlapping Attack"
 beua_shock_idea_2_desc:0 "When we charge, we do not strike as a singular wall. Our formations are designed to crush enemy resolve, attacking the entire frontline with a ferocity that focuses down individual units and shatters their will to fight."
 beua_shock_idea_3:0 "Noble Enthusiasm"
 beua_shock_idea_3_desc:0 "Our warrior elite are eager to take to the battlefield. By taking responsibility for their own training and mounts, they ensure our cavalry forces remain both highly mobile and remarkably cost-effective."
 beua_shock_idea_4:0 "Tales of Heroism"
 beua_shock_idea_4_desc:0 "I'm a hussar, I'm a Caehn, I'm a wretched Wexonard, routing Silmuna at the Damesear. I'm a Jaddari in the sun, I'm an Escanni on the run, I'm a horse soldier, timeless through and through."
 beua_shock_idea_5:0 "Relentless Momentum"
 beua_shock_idea_5_desc:0 "A shock charge is only as effective as the weight behind it. By committing to pure cavalry dominance, we ensure that the pressure on the enemy line never wavers; our horsemen punch through even the most stubborn defensive positions."
 beua_shock_idea_6:0 "Dragoon Cavalry"
 beua_shock_idea_6_desc:0 "We have expanded our definition of the battlefield, emphasizing wide-reaching flanks and deep formations. By optimizing our cavalry-to-infantry ratios, we can encircle and dismantle the enemy before they even realize they are surrounded."
 beua_shock_idea_7:0 "Shock Generals"
 beua_shock_idea_7_desc:0 "Our military academies have shifted their focus entirely toward the decisive blow. We train our commanders to recognize the exact moment an enemy line turns to panic, ensuring our generals are masters of the crushing melee."

 # Fire Ideas
 beua_fire_ideas:0 "Fire Ideas"
 beua_fire_ideas_bonus:0 "Full Fire"
 beua_fire_idea_1:0 "Concentrated Suppressive Fire"
 beua_fire_idea_1_desc:0 "The frantic wrath of a charging foe is easily broken by a disciplined wall of lead. By perfecting our suppression techniques, we minimize the impact of enemy melee strikes before they can close the distance."
 beua_fire_idea_2:0 "Integrated Ordnance Doctrine"
 beua_fire_idea_2_desc:0 "Our artillery is no longer restricted to traditional bombardment. By integrating heavy ordnance directly into our standard formation maneuvers, we have hardened our regiments against the psychological shock of frontline combat."
 beua_fire_idea_3:0 "Drills of the Line"
 beua_fire_idea_3_desc:0 "Training, training, training. By drilling our troops in rapid-fire coordination and the construction of field fortifications, we have created an army that is both cheaper to equip and nearly impossible to displace."
 beua_fire_idea_4:0 "Fire Discipline"
 beua_fire_idea_4_desc:0 "Our men are trained to hold their volleys until the absolute last moment. This restraint ensures that when we finally unleash our fire, the resulting damage is catastrophic to the enemy’s formation."
 beua_fire_idea_5:0 "Bastion of Fire"
 beua_fire_idea_5_desc:0 "Our infantry lines are designed to act as mobile fortresses. By emphasizing coordinated defensive fire, our regiments are capable of holding ground against any force, regardless of their ferocity."
 beua_fire_idea_6:0 "Concentrated Fire Support"
 beua_fire_idea_6_desc:0 "Through the expert positioning of our back-row artillery, we provide a constant barrage of support that bolsters our frontline regiments, allowing our heavy cannons to pick apart the enemy from safety."
 beua_fire_idea_7:0 "Grand Battery Commanders"
 beua_fire_idea_7_desc:0 "Our general staff prioritizes the science of long-range warfare. By educating our leaders in the mastery of artillery and musket volleys, we ensure that every battle is dictated by our terms, not the enemy's."
