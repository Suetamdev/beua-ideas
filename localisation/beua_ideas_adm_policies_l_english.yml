 beua_policy_adm_85:0 "Defence Vindication"
 desc_beua_policy_adm_85:0 "Humanists are not keen to fight offensive wars, but when it comes to defending their homeland, they are more than willing to help."

 beua_policy_adm_86:0 "Army Augmentation Act"
 desc_beua_policy_adm_86:0 "It is our desire to augment the army."

 beua_policy_adm_87:0 "Army Missionaries"
 desc_beua_policy_adm_87:0 "We will maintain missionaries in our army."

 beua_policy_adm_88:0 "Auxiliary Police"
 desc_beua_policy_adm_88:0 "We are ready to field the army as an auxiliary police if needed."

 beua_policy_adm_89:0 "Construction Soldier"
 desc_beua_policy_adm_89:0 "The army might be able to help with building projects in times of peace."

 beua_policy_adm_90:0 "Army Administration"
 desc_beua_policy_adm_90:0 "Our army administration is working on improving the supply system all the time."

 beua_policy_adm_91:0 "Religious Independent Mercenaries"
 desc_beua_policy_adm_91:0 "The mercenaries won't care who they fight. And we won't care what religion those mercenaries have."

 beua_policy_adm_92:0 "Transparent Pay Systems"
 desc_beua_policy_adm_92:0 "We always know who is paid which amount of money. An effective way to fight corruption."

 beua_policy_adm_93:0 "Religious Army"
 desc_beua_policy_adm_93:0 "Our army is very religious."

 beua_policy_adm_94:0 "Recruitment Act"
 desc_beua_policy_adm_94:0 "We have to recruit a big army in a very short amount of time."

 beua_policy_adm_95:0 "Burgher Army"
 desc_beua_policy_adm_95:0 "Our army consists of all classes."

 beua_policy_adm_96:0 "Incorruptible Occupation"
 desc_beua_policy_adm_96:0 "We won't be corrupted."

 beua_policy_adm_97:0 "Human Penalty Scale"
 desc_beua_policy_adm_97:0 "Draconic penalties are banned by law."

 beua_policy_adm_98:0 "Barracks Infrastructure"
 desc_beua_policy_adm_98:0 "We have a vast net of barracks in our land."

 beua_policy_adm_99:0 "District Recruiting Offices"
 desc_beua_policy_adm_99:0 "A district recruiting office allows us to muster our young."

 beua_policy_adm_100:0 "Quality Management"
 desc_beua_policy_adm_100:0 "When reinforcing the army, quality management is still crucial."

 beua_policy_adm_101:0 "Humanist Motivation"
 desc_beua_policy_adm_101:0 "Our men are convinced by their humanist idealogy to fight on."

 beua_policy_adm_102:0 "Innovative Production Process"
 desc_beua_policy_adm_102:0 "Through innovative production processes we can augment our production of trade goods."

 beua_policy_adm_103:0 "Weapons Production Law"
 desc_beua_policy_adm_103:0 "We can improve our efficiency by passing a weapons production law."

 beua_policy_adm_104:0 "Healthy Production Conditions"
 desc_beua_policy_adm_104:0 "It is important that our people don't die in the manufactories."

 beua_policy_adm_105:0 "War Bonds"
 desc_beua_policy_adm_105:0 "Our people can now buy war bonds to support our army."

 beua_policy_adm_106:0 "Fortress Museum"
 desc_beua_policy_adm_106:0 "A fortress museum will help us remember important lessons."

 beua_policy_adm_107:0 "Improvement of Fortress Infrastructure Act"
 desc_beua_policy_adm_107:0 "Improving our infrastructure is important for effective fortress building."

 beua_policy_adm_108:0 "Local Governor"
 desc_beua_policy_adm_108:0 "Local governors ensure good state administration."

 beua_policy_adm_109:0 "Factory Acquisition Act"
 desc_beua_policy_adm_109:0 "When conquering foreign lands we will do everything to take over enemy fortresses instead of destroying them."

 beua_policy_adm_110:0 "Free Movement of Workers Act"
 desc_beua_policy_adm_110:0 "Workers are allowed to travel free in our land."

 beua_policy_adm_111:0 "Humanist Production"
 desc_beua_policy_adm_111:0 "Humanist elements are not to be ignored in production."

 beua_policy_adm_112:0 "Innovative War Production"
 desc_beua_policy_adm_112:0 "Innovative production will help us increasing our goods even more in times of war."

 beua_policy_adm_113:0 "Medicine Mass Production Act"
 desc_beua_policy_adm_113:0 "Producing medicine in great masses will help many people."

