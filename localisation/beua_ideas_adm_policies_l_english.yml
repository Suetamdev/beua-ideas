 desc_beua_policy_adm_114:0 "Every ship requires a doctor. That will boost their chances to survive at sea."

 beua_policy_adm_115:0 "Public Ship Building Program"
 desc_beua_policy_adm_115:0 "The state has a passed a public ship building program."

 beua_policy_adm_116:0 "Maritime Pomp"
 desc_beua_policy_adm_116:0 "Maritime pomp will boost the acceptance of our government."

 beua_policy_adm_117:0 "Modern Galley Shipyards"
 desc_beua_policy_adm_117:0 "Modern galley shipyards will reduce our costs for recruiting galleys."

 beua_policy_adm_118:0 "Planned Campaigns"
 desc_beua_policy_adm_118:0 "Our campaigns are planned in the smallest detail. Our men know that and are consequently confident."

 beua_policy_adm_119:0 "Fanatics"
 desc_beua_policy_adm_119:0 "Sometimes we have to instrumentise the fanatics in our ranks."

 beua_policy_adm_120:0 "Cost Report"
 desc_beua_policy_adm_120:0 "The development of our country allows us to make cost reports of our expanses and to cut what we don't need."

 beua_policy_adm_121:0 "Regular Medical Tests"
 desc_beua_policy_adm_121:0 "Our doctors have invented means to help keep our armies healthy."

 beua_policy_adm_122:0 "Defend the Republic"
 desc_beua_policy_adm_122:0 "Our people know that we are threatened by external enemies."

 beua_policy_adm_123:0 "Private War Bonds"
 desc_beua_policy_adm_123:0 "Men of private means will give us loans to fair conditions to fund our wars."

 beua_policy_adm_124:0 "National Pride"
 desc_beua_policy_adm_124:0 "The national pride of our nation is unmatched."

 beua_policy_adm_125:0 "Creative Reassignment"
 desc_beua_policy_adm_125:0 "We will reassign our wounded to creative positions retaining our fighting strength."

 beua_policy_adm_126:0 "Advancement Through Merchants"
 desc_beua_policy_adm_126:0 "We can exploit the knowledge of our merchants to ensure quick technological advance."

 beua_policy_adm_127:0 "Marching Songs"
 desc_beua_policy_adm_127:0 "We can greatly increase our march speed and fighting efficiency with march songs."

 beua_policy_adm_128:0 "The Law is on Our Side"
 desc_beua_policy_adm_128:0 "Our troops and officers fight considerably better since they don't have to fear being hanged for the smallest mistake."

 beua_policy_adm_129:0 "Healthy March"
 desc_beua_policy_adm_129:0 "We will not waste the fighting strength of our forces on a march. We will rather retain it."

 beua_policy_adm_130:0 "Republican Guard"
 desc_beua_policy_adm_130:0 "Some of our neighbours hate us just because we are a republic. The republican guard will defend our freedom."

 beua_policy_adm_131:0 "Tax Law"
 desc_beua_policy_adm_131:0 "Our tax law is as straightforward as our military."

 beua_policy_adm_132:0 "Loyalty of Burghers"
 desc_beua_policy_adm_132:0 "Our people will never destabilize the state for their own interests."

 beua_policy_adm_133:0 "Blitz Conquest"
 desc_beua_policy_adm_133:0 "We will integrate the newly aquired land as quickly as we took it."

 beua_policy_adm_134:0 "Public Takeover"
 desc_beua_policy_adm_134:0 "We will exploit every situation to our advantage."

 beua_policy_adm_135:0 "Forced Conversion"
 desc_beua_policy_adm_135:0 "We are quick to convert people, even against their will."

 beua_policy_adm_136:0 "Heave-Ho! Building"
 desc_beua_policy_adm_136:0 "Sometimes buildings need to be completed without further ado."

 beua_policy_adm_137:0 "Quick Building of Hospitals"
 desc_beua_policy_adm_137:0 "We will built hospitals in our newly conquered lands."

 beua_policy_adm_138:0 "Short Production Boom"
 desc_beua_policy_adm_138:0 "Through massive investments we can shortly boom our production."

 beua_policy_adm_139:0 "Divine Destiny"
 desc_beua_policy_adm_139:0 "A priest has seen that victory awaits us."

 beua_policy_adm_140:0 "Prize Lists"
 desc_beua_policy_adm_140:0 "The prizes of gunpowder and weapons are regulated."

 beua_policy_adm_141:0 "New Production Methods"
 desc_beua_policy_adm_141:0 "Innovative production methods will improve our weapon production."

