 desc_beua_policy_adm_142:0 "By finding the weaknesses of a fortress we will speed up sieges considerably."

 beua_policy_adm_143:0 "First Aid"
 desc_beua_policy_adm_143:0 "We will aid our wounded as quickly as possible."

 beua_policy_adm_144:0 "Imperial Cannon Foundry"
 desc_beua_policy_adm_144:0 "The imperial cannon foundry is known all over the world."

 beua_policy_adm_145:0 "Central Weapon Production"
 desc_beua_policy_adm_145:0 "By producing our weapons in one central area we can ensure quantity and quality."

 beua_policy_adm_146:0 "Central Surveillance Center"
 desc_beua_policy_adm_146:0 "Our spies are controlled by a central surveillance center."

 beua_policy_adm_147:0 "Central Defence"
 desc_beua_policy_adm_147:0 "We will organise the defence of certain provinces in the capital."

 beua_policy_adm_148:0 "Leading Culture"
 desc_beua_policy_adm_148:0 "Our culture will lead the way."

 beua_policy_adm_149:0 "States Propaganda"
 desc_beua_policy_adm_149:0 "Our propaganda will tell our people that certain states are ours by right."

 beua_policy_adm_150:0 "Fleet Base Expansion"
 desc_beua_policy_adm_150:0 "We will expand our fleet bases."

 beua_policy_adm_151:0 "Imperial Territory"
 desc_beua_policy_adm_151:0 "An empire needs a lot of territory."

 beua_policy_adm_152:0 "Heart of the Nation"
 beua_policy_adm_152_desc:0 "By fostering a deep, spiritual connection between the citizenry and the state, we transform mere subjects into devoted patriots. In these centers of national fervor, the population views taxation not as a burden to be avoided, but as a vital contribution toward the collective triumph and prosperity of the fatherland."

 beua_policy_adm_153:0 "Big Standing Army"
 desc_beua_policy_adm_153:0 "Its easier for a centralist state to maintain a big army."

 beua_policy_adm_154:0 "General Staff Organisation"
 desc_beua_policy_adm_154:0 "Our general staff has great influence in the maintenance of forts, army and fleet."

 beua_policy_adm_155:0 "Central Mercenary Focal Point"
 desc_beua_policy_adm_155:0 "Focal Points will raise our ability to find mercenaries for our army."

 beua_policy_adm_156:0 "Central Arsenals"
 desc_beua_policy_adm_156:0 "Central Arsenals will be beneficial in the times of war."

 beua_policy_adm_157:0 "Central Fortress Construction"
 desc_beua_policy_adm_157:0 "We will built the best fortresses."

 beua_policy_adm_158:0 "Poked Militarism"
 desc_beua_policy_adm_158:0 "We will poke militarism and thus our army will never loose their attractiveness."

 beua_policy_adm_159:0 "Diplomatic Investment"
 desc_beua_policy_adm_159:0 "We will keep in close touch with everyone."

 beua_policy_adm_160:0 "Diplomatic Diversity"
 desc_beua_policy_adm_160:0 "Our diplomacy will work everywhere."

 beua_policy_adm_161:0 "Advisor Offensive"
 desc_beua_policy_adm_161:0 "We will do everything to get competent advisors."

 beua_policy_adm_162:0 "Decentralized State Clubs"
 desc_beua_policy_adm_162:0 "State Clubs will report everyone who wants to undermine our rule."

 beua_policy_adm_163:0 "Decentralized Taxation"
 desc_beua_policy_adm_163:0 "By organising regional tax collectors we can increase our efficiency."

 beua_policy_adm_164:0 "Small nationalist groups"
 desc_beua_policy_adm_164:0 "By supporting small nationalist groups in our provinces our enemies might find it difficult to integrate those provinces."

