l_english:
 beua_policy_adm_1:0 "Edict of Expulsion"
 desc_beua_policy_adm_1:0 "The policy of removal of unwanted heretical elements from the realm will guarantee that the faith of our loyal subjects is not subverted in their social interactions with these elements. They are therefore ordered to depart and never return."

 beua_policy_adm_2:0 "Enforce Religious Law"
 desc_beua_policy_adm_2:0 "Let us look much more closely to our holy scriptures to distinguish crimes and penalties for our society. Only when a society is ruled in a truly pious way may its people achieve true greatness."

 beua_policy_adm_3:0 "Policy of Calculated Delay"
 desc_beua_policy_adm_3:0 "With promises and assurances of safety and toleration, we can convince the unbelievers within our realm to remain peaceful and disarmed. This should at least temporarily delay the threat of a religious civil war until we're better equipped to deal with their wickedness and return them to the true faith."

 beua_policy_adm_4:0 "The Anti-Heresy Act"
 desc_beua_policy_adm_4:0 "Everyone must always work against heresies. Heresies are punishable by death!"
 
 beua_policy_adm_5:0 "Integration-Directive"
 desc_beua_policy_adm_5:0 "The Integration-Directive enables us to integrate foreign land quicker into our realm."

 beua_policy_adm_6:0 "Department of Research"
 desc_beua_policy_adm_6:0 "The Department of Research is occupied with technical progress."

 beua_policy_adm_7:0 "Minority Rights"
 desc_beua_policy_adm_7:0 "Minority Rights bind different cultures together."

 beua_policy_adm_8:0 "Act of Mercantilism"
 desc_beua_policy_adm_8:0 "Mercantilism helps us to keep the cash flowing."

 beua_policy_adm_9:0 "War Conventions"
 desc_beua_policy_adm_9:0 "Through protection of the innocent in foreign lands the foreigners are less hostile towards us."

 beua_policy_adm_10:0 "Right to Education Act"
 desc_beua_policy_adm_10:0 "The Right to Education Act gurantees us an educated population which is more useful than a dumb one."

 beua_policy_adm_11:0 "War Production Law"
 desc_beua_policy_adm_11:0 "The War Production Law improves our ability to produce important goods."

 beua_policy_adm_12:0 "Imperial Construction Program"
 desc_beua_policy_adm_12:0 "The Imperial Construction Program wants to improve the prestige of the state by marvellous buildings."

 beua_policy_adm_13:0 "Act of Subsidies"
 desc_beua_policy_adm_13:0 "National subsidies can be very important to keep the economy going."

 beua_policy_adm_14:0 "Act of Medical Education"
 desc_beua_policy_adm_14:0 "The Act of Medical Education ensures we will always have enough doctors."

 beua_policy_adm_15:0 "Act of Company Doctors"
 desc_beua_policy_adm_15:0 "The Act of Company Doctors helps us improve the medical care in manufactories."

 beua_policy_adm_16:0 "Act of Plague Prevention"
 desc_beua_policy_adm_16:0 "The Act of Plague Prevention wants to fight all kinds of plague by improving health and tidiness of the people."

 beua_policy_adm_17:0 "Baggage Trains"
 desc_beua_policy_adm_17:0 "Baggage Trains that follow our army reduce our casualties."

 beua_policy_adm_18:0 "Colonial Powerbase Doctrine"
 desc_beua_policy_adm_18:0 "We have developed bases in and around our colonies."

 beua_policy_adm_19:0 "Act of Pacification of new Lands"
 desc_beua_policy_adm_19:0 "Through the maintenance of bases in recent conquered land we raise the acceptance of our rule."

 beua_policy_adm_20:0 "Culture Blurb Doctrine"
 desc_beua_policy_adm_20:0 "Our propaganda praises our culture all along."

 beua_policy_adm_21:0 "Humanist Assimilation Act"
 desc_beua_policy_adm_21:0 "We assimilate people in a humanist way."

 beua_policy_adm_22:0 "Pious Society"
 desc_beua_policy_adm_22:0 "Our society is very pious. The church will like that."

 beua_policy_adm_23:0 "Fleet Base Defence Doctrine"
 desc_beua_policy_adm_23:0 "We need to be able to defend our fleet bases from attacks via land."

 beua_policy_adm_24:0 "Republican Traditions"
 desc_beua_policy_adm_24:0 "A lively society raises our republican tradition."

 beua_policy_adm_25:0 "Fidelity for the State Act"
 desc_beua_policy_adm_25:0 "Our society is faithful to our state."

 beua_policy_adm_26:0 "Imperial Extension Act"
 desc_beua_policy_adm_26:0 "Our target to increase the realm continuously has made us experienced in integrating new land."

 beua_policy_adm_27:0 "Offensive School Act"
 desc_beua_policy_adm_27:0 "Our general staff is greatly influenced by the offensive school."

 beua_policy_adm_28:0 "Efficient Military Administration"
 desc_beua_policy_adm_28:0 "An efficient military administration will reduce our maintenance considerably."

 beua_policy_adm_29:0 "Strategic Goods Act"
 desc_beua_policy_adm_29:0 "Producing strategic goods is the most important thing and has priority."

 beua_policy_adm_30:0 "War Bonds Act"
 desc_beua_policy_adm_30:0 "Sometimes you need to go into debt at war. But our laws will reduce our interest then."

 beua_policy_adm_31:0 "Fortress Cannons"
 desc_beua_policy_adm_31:0 "We will equip our fortresses with cannons. This will improve their defensiveness greatly."

 beua_policy_adm_32:0 "Colonial Inclusion"
 desc_beua_policy_adm_32:0 "Through integration of colonial administration we can decrease our own administrative expanses."

 beua_policy_adm_33:0 "Anti Colonial Corruption Act"
 desc_beua_policy_adm_33:0 "We have established an administration system that is very resistant against corruption."

 beua_policy_adm_34:0 "Colonial Advisors"
 desc_beua_policy_adm_34:0 "There are people in the colonies that could be of use. We should let them advise us."

 beua_policy_adm_35:0 "Enclave Doctrine"
 desc_beua_policy_adm_35:0 "Our administration can maintain more core states."

 beua_policy_adm_36:0 "Innovative Administration Act"
 desc_beua_policy_adm_36:0 "Through innovative administration we will boost the quality of our administration altogether."

 beua_policy_adm_37:0 "Oversea State Visits"
 desc_beua_policy_adm_37:0 "State Visits are essential to maintain good relations and to show our people that the government is very important."

 beua_policy_adm_38:0 "Oversea Jurisdiction"
 desc_beua_policy_adm_38:0 "Our just jurisdiction will please the oversea lands."

 beua_policy_adm_39:0 "State Development through Bases Doctrine"
 desc_beua_policy_adm_39:0 "Our bases will become economic factors and will grow our influence in the area."

 beua_policy_adm_40:0 "State Propaganda Doctrine"
 desc_beua_policy_adm_40:0 "Our propaganda will tell the population how efficient and brilliant our administration is doing."

 beua_policy_adm_41:0 "Blessing of Cannons"
 desc_beua_policy_adm_41:0 "Our priests will bless our cannons, this giving them divine power."

 beua_policy_adm_42:0 "Doctrine of Administrative Infallibility"
 beua_policy_adm_42_desc:0 "By controlling the narrative within our courts and provinces, we can convince the populace that the state's reach is both divine and perfectly efficient. This atmosphere of 'perceived perfection' encourages the rapid adoption of new societal standards while significantly lowering the cost of maintaining local bureaucracies, as the people themselves become guardians of the state's image."

 beua_policy_adm_43:0 "Tax Motivation Act"
 desc_beua_policy_adm_43:0 "Our people love their land and are glad to pay their taxes."

 beua_policy_adm_44:0 "Targeted Killing Doctrine"
 desc_beua_policy_adm_44:0 "Through targeted killings we can suppress nationalism in conquered lands."
 
 beua_policy_adm_45:0 "National Academy of Excellence"
 desc_beua_policy_adm_45:0 "By establishing prestigious national institutions that marry patriotic fervor with scientific rigor, we ensure that our finest minds feel a duty to serve the state rather than seeking fortune abroad. When brilliance is rooted in shared heritage, our most capable advisors require less persuasion—and fewer stipends—to dedicate their lives to the advancement of the nation."

 beua_policy_adm_46:0 "National Pride"
 desc_beua_policy_adm_46:0 "Everyone is very proud of our country."

 beua_policy_adm_47:0 "Just Judges"
 desc_beua_policy_adm_47:0 "Our judges will always be just in their jurisdiction."

 beua_policy_adm_48:0 "Volunteer Helpers"
 desc_beua_policy_adm_48:0 "We can quickly build infrastructure and other buildings with our volunteer helpers."

 beua_policy_adm_49:0 "Reason of State: Health"
 desc_beua_policy_adm_49:0 "One of our biggest goals as a state is to improve the health of all of our people."

 beua_policy_adm_50:0 "Public Missionary Education"
 desc_beua_policy_adm_50:0 "We have chosen to educate missionaries."

 beua_policy_adm_51:0 "Social Penetration of the Administration"
 desc_beua_policy_adm_51:0 "All social classes are represented in our administration."

 beua_policy_adm_52:0 "Tax Motivation Act"
 desc_beua_policy_adm_52:0 "Our people love their land and are glad to pay their taxes."

 beua_policy_adm_53:0 "Association of Tax Payers"
 desc_beua_policy_adm_53:0 "An association of tax payers will tell us where we waste money and how we could improve our spendings."

 beua_policy_adm_54:0 "Social Integration"
 desc_beua_policy_adm_54:0 "Social integration will improve the unity of our society."

 beua_policy_adm_55:0 "Social Advancement"
 desc_beua_policy_adm_55:0 "Our society is interested in constant progress."

 beua_policy_adm_56:0 "War Bonds"
 desc_beua_policy_adm_56:0 "Our people can now buy war bonds to support our army."

 beua_policy_adm_57:0 "Intelligent Taxmen"
 desc_beua_policy_adm_57:0 "Our taxmen will not be fooled by anything."

 beua_policy_adm_58:0 "Careful Expansion"
 desc_beua_policy_adm_58:0 "We will expand carefully with great attention to the needs of different cultures and religions."

 beua_policy_adm_59:0 "Religious Attractiveness"
 desc_beua_policy_adm_59:0 "Our religion is very attractive to converts."

 beua_policy_adm_60:0 "Exchange of Production Techniques"
 desc_beua_policy_adm_60:0 "Through the exchange of production techniques we can improve our own techniques quite a bit."

 beua_policy_adm_61:0 "Imperial Administration"
 desc_beua_policy_adm_61:0 "Imperial administration will enable us to maintain a bigger state."

 beua_policy_adm_62:0 "Harimari Tax System"
 desc_beua_policy_adm_62:0 "Harimar the Great's tax system was very successful. We shall learn from that."

 beua_policy_adm_63:0 "Dip into the Past"
 desc_beua_policy_adm_63:0 "It is always good to learn from history."

 beua_policy_adm_64:0 "Anbennarian Tradition"
 desc_beua_policy_adm_64:0 "We are proud of our Dameshead ancestors and their achievements in jurisdiction."

 beua_policy_adm_65:0 "Widespread Health Act"
 desc_beua_policy_adm_65:0 "It is our desire to improve the health of our people."

 beua_policy_adm_66:0 "Imperial State Administration"
 desc_beua_policy_adm_66:0 "Through a central administration we can improve our efficiency and fight corruption efficiently."

 beua_policy_adm_67:0 "Bank Espionage"
 desc_beua_policy_adm_67:0 "We might find it very useful to control the banks."

 beua_policy_adm_68:0 "Detection of Conscientious Objectors"
 desc_beua_policy_adm_68:0 "The detection of conscientious objectors is essential to keep the war going, but also pretty unpopular."

 beua_policy_adm_69:0 "Colonial Deals"
 desc_beua_policy_adm_69:0 "Through colonial deals we can expand in certain areas without fear."

 beua_policy_adm_70:0 "Local Health Infrastructure"
 desc_beua_policy_adm_70:0 "Focusing on local problems will increase our influence in said areas considerably."

 beua_policy_adm_71:0 "Oversea Enclaves Act"
 desc_beua_policy_adm_71:0 "We shall expand overseas."

 beua_policy_adm_72:0 "Big Garrisons"
 desc_beua_policy_adm_72:0 "We will support big garrisons to defend our fortresses."

 beua_policy_adm_73:0 "Constant Jurisdiction"
 desc_beua_policy_adm_73:0 "Our jurisdiction is predictable, which results in great legal security."

 beua_policy_adm_74:0 "Perfect State Administration"
 desc_beua_policy_adm_74:0 "Our state administration seeks her kind."

 beua_policy_adm_75:0 "Religious Jurisdiction"
 desc_beua_policy_adm_75:0 "Religion has a certain significance in our jurisdiction."

 beua_policy_adm_76:0 "Widespread Heartland"
 desc_beua_policy_adm_76:0 "We are ready to invest a lot of money to expand our heartland."

 beua_policy_adm_77:0 "Expansion Organisation by General Staff"
 desc_beua_policy_adm_77:0 "Our general staff is working hard to ensure a good integration of new lands."

 beua_policy_adm_78:0 "Understanding Military Commanders"
 desc_beua_policy_adm_78:0 "Our military commanders will be open to the needs and pains of the common people."

 beua_policy_adm_79:0 "Government Influence of General Staff"
 desc_beua_policy_adm_79:0 "The general staff has great influence of our government."

 beua_policy_adm_80:0 "Religious Generals"
 desc_beua_policy_adm_80:0 "Our generals are pretty zealous."

 beua_policy_adm_81:0 "Law of War"
 desc_beua_policy_adm_81:0 "The law of war will make war a bit more human."

 beua_policy_adm_82:0 "Army-Health Act"
 desc_beua_policy_adm_82:0 "A good health care in war times will reduce our losses."

 beua_policy_adm_83:0 "Efficient Supply System"
 desc_beua_policy_adm_83:0 "The supply system to feed our troops is working flawless."

 beua_policy_adm_84:0 "Pass-Act"
