 desc_beua_policy_adm_165:0 "By barracking our troops in different locations we will find it easier to supply them."

 beua_policy_adm_166:0 "General Staff Recruitment"
 desc_beua_policy_adm_166:0 "The general staff will be heavily involved in recruiting new men."

