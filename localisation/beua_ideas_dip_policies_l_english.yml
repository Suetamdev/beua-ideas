l_english:
 beua_policy_dip_1:0 "National Harbor Directorate"
 desc_beua_policy_dip_1:0 "Establishing a dedicated state directorate for harbor maintenance ensures our maritime gateways operate at peak economic and military capacity. Our merchants enjoy streamlined, highly efficient shipping lanes, while our warships benefit from fully funded emergency repair networks across the realm."

 beua_policy_dip_2:0 "Supply Convoys"
 desc_beua_policy_dip_2:0 "Ensure that our overseas holdings have regular access to supplies from the homeland."

 beua_policy_dip_3:0 "Holy Chartered Concessions"
 desc_beua_policy_dip_3:0 "Our colonial enterprises must serve both the treasury and the heavens. By implementing rigorous trade restrictions that bar non-believers and heretics from operating in our overseas ports, we aggressively spread the state faith across our territories, reinforcing our continental religious unity while locking down lucrative tariff streams."

 beua_policy_dip_4:0 "Chartered Factory Presidencies"
 desc_beua_policy_dip_4:0 "Establishing commercial footholds in foreign markets is highly lucrative, but they face constant subversion from rival realms and local syndicates. By backing our merchant cartels with state-administered naval garrisons and permanent customs houses, we forcefully secure a massive share of foreign trade power and optimize our domestic trade efficiency."

 beua_policy_dip_5:0 "The Coordinated Port Act"
 desc_beua_policy_dip_5:0 "Encouraging strict cooperation between our naval commanders and garrisoned fortress engineers allows us to establish impenetrable maritime havens. With our ports completely safe from foreign raiding and blockades, our trade networks can function with unmatched security, guiding wealth deep into our inland trade routes."

 beua_policy_dip_6:0 "Total Naval Mobilization Act"
 desc_beua_policy_dip_6:0 "By adapting our wartime industrial infrastructure to mass-produce naval hulls and armaments, we can sustain an overwhelming presence at sea. This massive expansion of our force limit allows us to deploy dense lines of warships to completely seal off enemy coastlines, rendering our commercial embargoes utterly inescapable."

 beua_policy_dip_7:0 "The Nautical Education Act"
 desc_beua_policy_dip_7:0 "Ensure a high standard of education for our naval officers so that they will understand the vital principles of gunnery in battles."

 beua_policy_dip_8:0 "Admiralty of the Faithful"
 desc_beua_policy_dip_8:0 "Select our captains to be men of faith and fire who have no qualms about boarding enemy ships to get to grips with the heathen. Their fanatical aggression in close-quarters melee brings unmatched shock to enemy lines, ensuring our holy naval exploits are never forgotten."

 beua_policy_dip_9:0 "The Naval Inspection Act"
 desc_beua_policy_dip_9:0 "Create an inspection board to look after the well-being of the regular sailors in our navy."

 beua_policy_dip_10:0 "Department of the Navy"
 desc_beua_policy_dip_10:0 "The Department of the Navy is occupied with the affairs of the navy."

 beua_policy_dip_11:0 "Department of Colonies"
 desc_beua_policy_dip_11:0 "The Department of Colonies is occupied with colonial matters."

 beua_policy_dip_12:0 "Grand Admiralty Registry Act"
 desc_beua_policy_dip_12:0 "By deploying central state administrators to systematically catalog, tax, and upgrade every harbor and timber forest in the realm, we lift the logistical bottlenecks of naval expansion. This massive bureaucratic undertaking allows us to construct and maintain an immense armada far beyond our previous limits."

 beua_policy_dip_13:0 "Ministry of Colonial Affairs"
 desc_beua_policy_dip_13:0 "Expanding into untamed frontiers requires more than just wandering adventurers—it requires rigorous state organization. By establishing a dedicated Ministry of Colonial Affairs, we centralize our cartography, funding, and outward migration under a single office, guaranteeing a steady flow of brave settlers and resources to our overseas frontiers."

 beua_policy_dip_14:0 "Fighting Trade Ships"
 desc_beua_policy_dip_14:0 "Our merchants know how to defend themselves against pirates and other opponents."

 beua_policy_dip_15:0 "Imperial Jurisdiction Doctrine"
 desc_beua_policy_dip_15:0 "By formalizing a sophisticated legal framework that harmonizes the laws, privileges, and treaties between our realm and foreign states, we establish an unshakeable standard of international justice. This mastery of jurisprudence elevates our standing on the world stage, ensuring our diplomats speak with absolute, universally respected authority."

 beua_policy_dip_16:0 "Act of Medical Help"
 desc_beua_policy_dip_16:0 "Medical Help in newly conquered teritory helps us to get accepted."

 beua_policy_dip_17:0 "Act of Colonial Doctors"
 desc_beua_policy_dip_17:0 "Colonial doctors will fight diseases in colonies and can help integrate natives."

 beua_policy_dip_18:0 "Act of Colonial Trade"
 desc_beua_policy_dip_18:0 "We need more merchants to adjust to the new trade situation in the colonies."

 beua_policy_dip_19:0 "Act of Free Speech in Colonies"
 desc_beua_policy_dip_19:0 "There's free speech in the colonies."

 beua_policy_dip_20:0 "Colonial Exploitation"
 desc_beua_policy_dip_20:0 "We will try to make as much money as possible."

 beua_policy_dip_21:0 "Asymmetrical Colonial War Doctrine"
 desc_beua_policy_dip_21:0 "We will damage our colonial rivals by enlisting privateers."

 beua_policy_dip_22:0 "The Promised Land Act"
 desc_beua_policy_dip_22:0 "Our propaganda always tells how great the colonies are. They will surely attract people."

 beua_policy_dip_23:0 "The Colonial Expansion Act"
 desc_beua_policy_dip_23:0 "We want to expand. We will pay additional colonists."

 beua_policy_dip_24:0 "Prestige and Integration Doctrine"
 desc_beua_policy_dip_24:0 "Our societal model—perfected by our state structures—stands as a beacon of unmatched prestige across Haless and Cannor. By aggressively projecting this cultural excellence abroad, we disarm foreign suspicions, accelerate the natural assimilation of neighboring peoples, and ensure our diplomats are welcomed with open arms in every foreign court."

 beua_policy_dip_25:0 "War Propaganda"
 desc_beua_policy_dip_25:0 "Our society will support us in war times indefinitely."

 beua_policy_dip_26:0 "National Defence Propaganda"
 desc_beua_policy_dip_26:0 "Our men's will to defend the country is indefinite."

 beua_policy_dip_27:0 "Public Fleet Program"
 desc_beua_policy_dip_27:0 "The state has decided to adopt a fleet program."

 beua_policy_dip_28:0 "Naval Component Standardization Act"
 desc_beua_policy_dip_28:0 "True superiority at sea is won through a thousand minor engineering triumphs. By applying the strict principles of our weapon quality doctrines to our shipyards, we have introduced a wave of iterative upgrades—from reinforced cannon mountings to standardized block-and-tackle rigging. These cumulative adjustments significantly maximize the combat efficiency of every vessel in our fleet, from the smallest transport to the grandest flagship."

 beua_policy_dip_29:0 "Merchant Protection Act"
 desc_beua_policy_dip_29:0 "Chased merchants can find shelter in our bases."

 beua_policy_dip_30:0 "National Partisan Mandate"
 desc_beua_policy_dip_30:0 "An occupying army can only survive if it can live off our land. By instilling a fanatical nationalist resolve across our populace, our citizenry transforms into a permanent, phantom resistance. Destroying vital infrastructure and constant hit-and-run guerilla raids ensure that foreign invaders face catastrophic, relentless attrition for every single mile they dare to march."

 beua_policy_dip_31:0 "General Perseverance"
 desc_beua_policy_dip_31:0 "Our men will not surrender."

 beua_policy_dip_32:0 "Divine Devotion Act"
 desc_beua_policy_dip_32:0 "The divine devotion to fight for your land and king is inspiring our people."

 beua_policy_dip_33:0 "Imperial Logistics Mandate"
 desc_beua_policy_dip_33:0 "An empire's ambitions are only as grand as the armies it can afford to sustain. By streamlining military supply lines, standardizing iron rations, and leveraging imperial tribute to subsidize our garrisons, we can dramatically lower the upkeep of our forces. This administrative efficiency allows us to field a colossally massive land army without bankrupting the state treasury."

 beua_policy_dip_34:0 "Imperial Diplomacy Act"
 desc_beua_policy_dip_34:0 "As an empire we can do things other countries can't do and get away with it."

 beua_policy_dip_35:0 "Imperial Pax Act"
 desc_beua_policy_dip_35:0 "True empire is built not just by breaking walls, but by building a house large enough to hold all peoples. By guaranteeing absolute legal protection and religious tolerance for heathens and heretics within our expanding borders, we transform our conquests from bitter occupations into peaceful integrations. Our subjects embrace our rule willingly, drastically lowering the cost of fully annexing them into our domain."

 beua_policy_dip_36:0 "Professional Seamen"
 desc_beua_policy_dip_36:0 "We have many professional seamen."

 beua_policy_dip_37:0 "Casus Belli Act"
 desc_beua_policy_dip_37:0 "Our capabilites to make a war just are incredible through our army's tradition."

 beua_policy_dip_38:0 "Service at Naval Bases Act"
 desc_beua_policy_dip_38:0 "The service at naval bases is beneficial for the education of our seamen."

 beua_policy_dip_39:0 "Modern Fortresses Act"
 desc_beua_policy_dip_39:0 "Our fortresses are always up to date."

 beua_policy_dip_40:0 "Modern Siege Equipment Doctrine"
 desc_beua_policy_dip_40:0 "As the architecture of global fortifications evolves, our offensive capabilities must advance in kind. By deploying field scouts and clandestine agents to meticulously chart enemy bastion layouts, our weapons foundries can design specialized, state-of-the-art breaching engines and high-caliber ordnance tailored specifically to shatter their defenses."

 beua_policy_dip_41:0 "Quality Manufactories Act"
 desc_beua_policy_dip_41:0 "Our manufactories are universally recognized as the finest in the known world. By tightly regulating our trade lanes to feed our premium workshops the highest grade materials, our state artisans can produce matchless, military-grade firearms and pristine black powder. When our regiments take the field, their superior weaponry delivers unmatched, catastrophic fire phases against our enemies."

 beua_policy_dip_42:0 "Famishment Doctrine"
 desc_beua_policy_dip_42:0 "We will make sure the enemy will starve in our lands while we hold the supplies in our fortresses."

 beua_policy_dip_43:0 "Religious Freedom"
 desc_beua_policy_dip_43:0 "As we guarantee religious freedom in our colonies we get more attractive for anybody."

 beua_policy_dip_44:0 "Colonial Stimulus Plan"
 desc_beua_policy_dip_44:0 "Long term investments will pay off in our colonies."

 beua_policy_dip_45:0 "Colonial Fleet"
 desc_beua_policy_dip_45:0 "We need a big colonial fleet to protect our colonies."

 beua_policy_dip_46:0 "Registration Commission"
 desc_beua_policy_dip_46:0 "Through registration we can avoid famines in our colonies."

 beua_policy_dip_47:0 "Mass Colonisation Act"
 desc_beua_policy_dip_47:0 "We focus on gobbeling up as much land as possible."

 beua_policy_dip_48:0 "Colonial Infrastructure Mandate"
 desc_beua_policy_dip_48:0 "A truly enduring empire is built with brick, mortar, and iron rails. By exporting our advanced infrastructural master plans directly to our overseas territories, we turn chaotic frontier settlements into highly efficient, state-engineered hubs. Standardizing local roadways and harbor works heavily accelerates the flow of incoming settlers, while linking their local economies directly to the capital keeps their liberty desire firmly in check."

 beua_policy_dip_49:0 "Colonial Army"
 desc_beua_policy_dip_49:0 "We need a big enough army to defend both our motherland and our colonies."

 beua_policy_dip_50:0 "Chartered Protectorate Mandate"
 desc_beua_policy_dip_50:0 "True colonial mastery lies in delegation. This mandate authorizes our colonial administrators to form autonomous client states and hire local mercenary corporations to police our distant borders. By relying on native blades and professional sellswords who know the terrain, we ensure our global trade interests remain fiercely protected while freeing our main legions for continental conflicts."

 beua_policy_dip_51:0 "Weapons from Oversea"
 desc_beua_policy_dip_51:0 "Weapon supplies from overseas will enable us to compensate our losses faster than before."

 beua_policy_dip_52:0 "Fortress Necessity"
 desc_beua_policy_dip_52:0 "It will be essential to fortify our colonies."

 beua_policy_dip_53:0 "Cultural Cooperation Doctrine"
 desc_beua_policy_dip_53:0 "Through deliberate cultural cooperation, we can radically optimize the administration of our far-flung overseas lands. Granting equal legal status to the distinct societies along our trade routes eliminates provincial unrest and fosters mutual respect. This enlightened approach turns foreign ports into enthusiastic extensions of our home realm, ready to construct and supply our grand standing navies."

 beua_policy_dip_54:0 "Base Drydocks"
 desc_beua_policy_dip_54:0 "Damaged ships can be repaired in our oversea bases and don't need to be brought back home. That will save us a lot of money."

 beua_policy_dip_55:0 "Offensive Base Concept"
 desc_beua_policy_dip_55:0 "Our bases are an integral part of our offensive strategy."

 beua_policy_dip_56:0 "Amphibious Staging Program"
 desc_beua_policy_dip_56:0 "Projecting power across vast oceans requires specialized infrastructure at home and abroad. By expanding our coastal garrisons into massive, state-of-the-art staging grounds, we can comfortably supply and house immense numbers of troops right at the water's edge. These optimized naval barracks heavily extend our operational range and provide the perfect training environment to comfortably maintain dedicated divisions of elite marines."

 beua_policy_dip_57:0 "Naval Sanitation Standards"
 desc_beua_policy_dip_57:0 "The greatest enemy of an armada is not foreign steel, but disease and confinement. By enforcing strict dietary regulations, standardizing fresh water preservation, and assigning dedicated medical officers to our long-distance expeditions, we drastically reduce losses suffered by shipboard illness. Keeping our veteran crews healthy and active vastly extends our operational range and preserves our proud naval tradition."

 beua_policy_dip_58:0 "Constant Crews"
 desc_beua_policy_dip_58:0 "We always have some men guarding our bases. That will free up more men to fight in the regular army."

 beua_policy_dip_59:0 "Mercenary Collecting Point Act"
 desc_beua_policy_dip_59:0 "We will use our fleet bases to hire and concentrate the mercenaries we hired overseas."

 beua_policy_dip_60:0 "Just Land Doctrine"
 desc_beua_policy_dip_60:0 "Our judiciary is impartial and just. That will improve our reputation in foreign lands."

 beua_policy_dip_61:0 "State Welfare Codification Act"
 desc_beua_policy_dip_61:0 "When the royal court actively finances and oversees the physical well-being of its citizenry, the entire state benefits. Standardizing civic health standards across our provinces minimizes societal disruption and keeps our urban centers booming with activity. This administrative harmony creates a highly progressive environment where cutting-edge global innovations and philosophies are rapidly adopted across our territory."
 
 beua_policy_dip_62:0 "Best Weapons of the World"
 desc_beua_policy_dip_62:0 "Our propaganda proclaims proudly that our weapons are the greatest in the world."

 beua_policy_dip_63:0 "Educated Population"
 desc_beua_policy_dip_63:0 "Our population is relatively educated and will not drift to another state easily."

 beua_policy_dip_64:0 "War Enthusiasm"
 desc_beua_policy_dip_64:0 "We have no trouble finding new recruits."

 beua_policy_dip_65:0 "Mercenary Defence Act"
 desc_beua_policy_dip_65:0 "Applying this strategy, our enemy will find nothing but wasteland."

 beua_policy_dip_66:0 "Social Tolerance"
 desc_beua_policy_dip_66:0 "We are tolerant people, which makes it a lot easier to deal with other religions."

 beua_policy_dip_67:0 "Civic Solidarity Edict"
 desc_beua_policy_dip_67:0 "Internal peace and external security are two sides of the same coin. This edict builds deep institutional solidarity across our provinces, successfully driving down global unrest. Because our people feel profoundly invested in the survival of our collective state, our towns transform into stubborn points of resistance, radically delaying enemy siege progress through sheer civilian defiance."

 beua_policy_dip_68:0 "Patriotic Development Bonds"
 desc_beua_policy_dip_68:0 "To field an army capable of total victory, our technology must never fall behind. By issuing specialized state bonds backed by the patriotic pride of our unified society, we allow citizens to directly invest their personal wealth into the nation's future. This massive influx of public capital allows our administrators to rapidly modernize our infrastructure, cutting the cost of embracing new global institutions completely in half."

 beua_policy_dip_69:0 "Civic Planning Act"
 desc_beua_policy_dip_69:0 "Rapid urban growth often breeds chaos, but under a structured society, it breeds prosperity. By modernizing our zoning laws and streamlining public engineering pipelines, we can expand our cities' vital infrastructure at a fraction of the usual cost. Providing clean public spaces, organized housing, and efficient sanitation drastically improves daily quality of life, soothing civic anxieties and keeping global unrest firmly suppressed."

 beua_policy_dip_70:0 "Administrative Assimilation Directive"
 desc_beua_policy_dip_70:0 "By aligning the core machinery of our central government with a dedicated policy of cultural absorption, we eliminate the traditional bottlenecks of imperial growth. Indigenous peoples on our colonial frontiers are rapidly transitioned into productive taxpayers, while our diplomatic corps utilizes these shared administrative structures to smoothly dissolve and integrate our dependencies at a minimal expense to the crown."

 beua_policy_dip_71:0 "Innovative Trade Contracts"
 desc_beua_policy_dip_71:0 "Through innovative trade contracts we can increase our influcence in foreign states greatly."

 beua_policy_dip_72:0 "Offensive Assimilation"
 desc_beua_policy_dip_72:0 "We will offensively push our culture in conquered lands."

 beua_policy_dip_73:0 "Uniform Levies Act"
 desc_beua_policy_dip_73:0 "To sustain an army capable of policing our massive territories, we must look to the populations we absorb. By smoothing over regional friction and integrating newly assimilated cultures into our national fabric, we turn yesterday's subjects into today's fierce patriots. Standardizing their training and language under our logistical machine allows us to effortlessly tap into vast provincial manpower reserves, rapidly replenishing our frontline regiments."

 beua_policy_dip_74:0 "Frontier Logistical Mandate"
 desc_beua_policy_dip_74:0 "True territorial expansion relies on the speed of our supply lines. This mandate bridges our infrastructural genius with our assimilation programs, driving continuous roads and supply hubs straight into uncharted territories. Linking new settlements directly to the imperial core ensures a massive, uninterrupted flow of incoming families and materials, rapidly cementing our permanent presence on the frontier."
 
 beua_policy_dip_75:0 "Technical Exchange"
 desc_beua_policy_dip_75:0 "We will profit from technical exchange with other people."

 beua_policy_dip_76:0 "Border Security Act"
 desc_beua_policy_dip_76:0 "Our borders need to be secure at all costs."

 beua_policy_dip_77:0 "Grand General Staff Mobilization"
 desc_beua_policy_dip_77:0 "When the absolute territorial ambitions of the crown are directly synchronized with our finest strategic minds, the entire nation transforms into an efficient engine of war. By formalizing a unified command structure across all imperial armies and aggressively optimization our frontline supply networks, we slash unnecessary administrative waste. This logistic efficiency allows us to comfortably maintain significantly lower maintenance costs while fielding an immensely larger standing army to secure our global destiny."

 beua_policy_dip_78:0 "Fortress Inspector"
 desc_beua_policy_dip_78:0 "Fortress inspectors will guarantee the efficiency of our forts."

 beua_policy_dip_79:0 "International Credit Concordat"
 desc_beua_policy_dip_79:0 "When the absolute integrity of our courts is matched by a flawless international reputation, global banking institutions treat our state with unparalleled reverence. By codifying strict legal protections for cross-border investments and standardizing financial contract laws, we transform our realm into a gold standard for international credit. Foreign bankers and merchant guilds compete to offer us their capital, enabling us to secure massive state loans at unprecedentedly low interest rates."

 beua_policy_dip_80:0 "Edict of Benevolent Patronage"
 desc_beua_policy_dip_80:0 "When an empire prioritizes the health and safety of its subjects, the seeds of rebellion find no fertile soil. This edict standardizes humanitarian relief and public health initiatives across all of our global dependencies. Providing this unmatched standard of safety and institutional care ensures that our vassals remain fundamentally satisfied with our oversight, willingly remaining under our grand imperial banner."

 beua_policy_dip_81:0 "Diplomatic Service"
 desc_beua_policy_dip_81:0 "The diplomatic service will be a good connection between us and our vassals."

 beua_policy_dip_82:0 "Casus Belli Doctrine"
 desc_beua_policy_dip_82:0 "We are pretty good to justify our wars."

 beua_policy_dip_83:0 "Foreign Merchants"
 desc_beua_policy_dip_83:0 "Trading foreign weapons will give us interesting insight."

 beua_policy_dip_84:0 "Fortress Presence"
 desc_beua_policy_dip_84:0 "Our fortresses will always be a sign of our dominance."

 beua_policy_dip_85:0 "Judicial Security Mandate"
 desc_beua_policy_dip_85:0 "A secure state must be both legally incorruptible and impenetrable to foreign subversion. By integrating our intelligence networks directly into our judicial framework, counter-espionage becomes an official, systematic process of national law. Simultaneously, this extreme legal oversight roots out local bureaucratic waste and administrative corruption across our provinces—drastically reducing state maintenance costs while casting an unyielding web of defense against enemy infiltrators."

 beua_policy_dip_86:0 "Academic Reconnaissance Act"
 desc_beua_policy_dip_86:0 "Knowledge is the ultimate currency of the modern era. By tasking our covert operatives with infiltrating foreign universities, alchemical guilds, and medical academies, we can systematically siphon away our rivals' intellectual breakthroughs. This unparalleled pipeline of stolen academic data and administrative research allows our state planners to formulate new national concepts at a fraction of the usual cost, while heavily boosting our operational efficiency abroad."

 beua_policy_dip_87:0 "Colonial Health and Safety Act"
 desc_beua_policy_dip_87:0 "When an empire guarantees physical safety and modern medical care even at the bleeding edge of the map, pioneers will cross oceans to get there. This act funds the establishment of permanent field hospitals and clean water infrastructure in our overseas territories from day one. Eradicating the traditional terrors of frontier sickness sparks an unprecedented wave of colonial migration, accelerating our expansion across the globe."

 beua_policy_dip_88:0 "Useful Contacts"
 desc_beua_policy_dip_88:0 "Some contacts might be very useful in the future."

 beua_policy_dip_89:0 "Professional Fleet Integration Act"
 desc_beua_policy_dip_89:0 "To safeguard an empire that spans oceans, the professional standards of our standing military must extend to our high seas. By establishing permanent naval academies and structured career benefits across our maritime provinces and frontier colonies, we turn sailing into a highly sought-after state career. This rigorous institutional pipeline massively expands our reserves of trained sailors, allowing our high command to comfortably field and maintain a significantly larger standing navy."

 beua_policy_dip_90:0 "Fortress Innovation Act"
 desc_beua_policy_dip_90:0 "Drawing upon generations of grand defensive experience, our strategists have devised revolutionary ways to modernize our national strongholds. This comprehensive act heavily reinforces the physical durability of our fortresses, while simultaneously training our engineering corps in innovative, highly efficient sapping techniques to conclude foreign sieges more quickly and decisively."

 beua_policy_dip_91:0 "Sovereign Credit Consolidation Act"
 desc_beua_policy_dip_91:0 "When flawless domestic administration is backed by sweeping international influence, an empire's financial word becomes absolute law. By streamlining our treasury's accounting practices and leveraging our immense diplomatic prestige among global banking cartels, we establish an unshakeable standard of sovereign credit. Foreign syndicates and client states compete to back our grand public initiatives, allowing us to command massive state loans at minimal interest rates."

 beua_policy_dip_92:0 "Penetration of Nobility"
 desc_beua_policy_dip_92:0 "The nobility is very important in our country."

 beua_policy_dip_93:0 "Imperial Arsenal Expansion"
 desc_beua_policy_dip_93:0 "By utilizing our vast diplomatic influence to secure raw materials from our dependencies and applying our superior weapon-smithing methods to assembly lines, we can mass-produce arms on an unprecedented scale. This massive influx of standardized weaponry allows us to rapidly outfit tens of thousands of new frontline soldiers and supply a wave of newly constructed warships, expanding our standing military limits across land and sea."

 beua_policy_dip_94:0 "Local Fortress Advisor"
 desc_beua_policy_dip_94:0 "We will improve our fortresses with local military engineers and advisors."

 beua_policy_dip_95:0 "Consolation of Foreign Countries"
 desc_beua_policy_dip_95:0 "We always try to keep foreign opinions about us neutral at worst."

 beua_policy_dip_96:0 "Naval Procurement Directive"
 desc_beua_policy_dip_96:0 "By integrating our nation's advanced legal framework directly into our coastal infrastructure, we optimize our entire shipbuilding sector. This comprehensive directive regulates raw material supply lines and organizes dockyard labor under centralized state supervision. Eliminating waste and establishing clear construction quotas allows our empire to comfortably build a massive armada at minimized expenses and record-breaking speeds."

 beua_policy_dip_97:0 "Marine Conscription Act"
 desc_beua_policy_dip_97:0 "Our military mobilization must not end at the shoreline. By expanding our state conscription framework to encompass all coastal provinces, commercial ports, and river communities, we can systematically tap into our nation's vast maritime population. Standardizing naval draft rosters and registration protocols ensures that our naval reserves are continuously replenished, providing an uninterrupted stream of fresh, capable deckhands and sailors to rapidly replace our fleet's casualties."

 beua_policy_dip_98:0 "Active Seamen Recruitment"
 desc_beua_policy_dip_98:0 "We will actively recruit seamen for our fleet."

 beua_policy_dip_99:0 "Naval Quality Weapons Act"
 desc_beua_policy_dip_99:0 "We will ensure that our fleets are outfitted exclusively with the highest quality armaments our foundries can produce. By standardizing our finest weapon designs for maritime combat and supplying our ships with premium heavy munitions, we eliminate structural defects and maximize the lethal efficiency of our broadsides on the global stage."

 beua_policy_dip_100:0 "Floating Fortress Act"
 desc_beua_policy_dip_100:0 "Heavy Ships are the backbone of our navy. We need to do everything we can to produce them as cost effective as possible."

 beua_policy_dip_101:0 "Naval Industrial Mobilization Act"
 desc_beua_policy_dip_101:0 "When the entire industrial capacity of our wartime economy is directed toward the high seas, our shipyards transform into unstoppable engines of mass production. This act centralizes the procurement of strategic naval materials—such as premium timber, canvas, and iron armaments—under a unified state production board. Stripping away commercial middlemen and standardizing modular hull designs allows us to mass-produce grand war fleets at a fraction of their traditional costs."

 beua_policy_dip_102:0 "Resilient Merchants"
 desc_beua_policy_dip_102:0 "Our merchant classes are the lifeblood of the economy, and they must not be easily discomposed by foreign outbreaks, physical exhaustion, or regional crises. By integrating advanced health doctrines directly into our trade charters, we safeguard our trade representatives against the typical hazards of international travel. This unyielding physical and structural resilience ensures our commercial operations run with absolute continuity, allowing us to confidently outmaneuver our competitors in every market."

 beua_policy_dip_103:0 "Administrative Support for Merchants Act"
 desc_beua_policy_dip_103:0 "The state is doing everything it can to ease the merchants work."

 beua_policy_dip_104:0 "Military Merchant"
 desc_beua_policy_dip_104:0 "One from the army budget paid merchants will focus on requiring military goods in foreign lands."

 beua_policy_dip_105:0 "Logistical Supply Act"
 desc_beua_policy_dip_105:0 "Using trade routes to supply our conscripts lowers army costs and helps war-torn provinces recover quickly."

 beua_policy_dip_106:0 "Trade Bases"
 desc_beua_policy_dip_106:0 "We will maintain trade bases to protect our trade ships and improve our efficiency."

 beua_policy_dip_107:0 "Armed Expedition Act"
 desc_beua_policy_dip_107:0 "Equipping our pioneers with premium weaponry allows them to venture further and secure new colonies much faster."

 beua_policy_dip_108:0 "Customs Station"
 desc_beua_policy_dip_108:0 "Custom stations will help us to control trade in our land."

 beua_policy_dip_109:0 "Seafaring Focus"
 desc_beua_policy_dip_109:0 "We extend our military conscription framework to coastal regions to greatly expand our naval manpower and fleet capacity."

 beua_policy_dip_110:0 "Mass Fleet Initiative"
 desc_beua_policy_dip_110:0 "Applying our massive logistics and manpower networks to our shipyards allows us to maintain a vastly larger navy."

 beua_policy_dip_111:0 "Privateer Contracts Act"
 desc_beua_policy_dip_111:0 "Hiring mercenary sailors and licensed privateers lowers our official naval maintenance while massively disrupting enemy trade."

 beua_policy_dip_112:0 "Naval Articles of War"
 desc_beua_policy_dip_112:0 "Introducing strict legal codes and fair judicial rights for our crews enforces iron discipline and heavily boosts naval morale."

 beua_policy_dip_113:0 "Coastal Defense Act"
 desc_beua_policy_dip_113:0 "Coordinates coastal fortresses with our fleet patrols to maximize fort defense and heavily optimize naval blockades."

 beua_policy_dip_114:0 "Maritime Levy Act"
 desc_beua_policy_dip_114:0 "Leverages merchant wealth to expand our naval force limit and sustain top-tier naval tradition through galley warfare."

 beua_policy_dip_115:0 "Boarding maneuvers"
 desc_beua_policy_dip_115:0 "While Boarding has long been a part of naval warfare, our captains and crews go about it more vigorously than most. By fearlessly closing the distance and fiercely attacking, our navy is gaining a reputation for their shock tactics."

 beua_policy_dip_116:0 "Psychological Warfare Act"
 desc_beua_policy_dip_116:0 "Using military intelligence and field subversion allows our armies to inflict more morale damage while locking down domestic security."

 beua_policy_dip_117:0 "Kill the Natives!"
